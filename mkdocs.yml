site_name: 민성 한의학 아카이브
site_description: 한의학 고전, 본초, 방제, 변증, 질환 및 현대 연구를 구조화한 지식 아카이브
site_url: https://wiki.minseong.co.kr/
site_author: 민성한의원
repo_name: minseong-korean-medicine-wiki

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: green
      accent: green
    - scheme: slate
      primary: green
      accent: green

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - 홈: index.md
  - 한의학 기초:
      - 개요: basic/index.md
      - 기허: basic/qi-deficiency.md
      - 혈허: basic/blood-deficiency.md
      - 담음: basic/phlegm-fluid.md
      - 어혈: basic/blood-stasis.md
  - 본초학:
      - 개요: herbs/index.md
      - 녹용: herbs/cervi-parvum-cornu.md
      - 인삼: herbs/ginseng.md
      - 황기: herbs/astragalus.md
      - 당귀: herbs/angelica.md
  - 방제학:
      - 개요: formulas/index.md
      - 귀비탕: formulas/guibi-tang.md
      - 온담탕: formulas/wendan-tang.md
      - 독활기생탕: formulas/duhuo-jisheng-tang.md
      - 보중익기탕: formulas/buzhong-yiqi-tang.md
  - 질환·증상:
      - 개요: diseases/index.md
      - 불면: diseases/insomnia.md
      - 만성피로: diseases/chronic-fatigue.md
      - 소화불량: diseases/dyspepsia.md
      - 요통: diseases/low-back-pain.md
  - 한의학 고전:
      - 개요: classics/index.md
      - 동의보감: classics/donguibogam.md
      - 상한론: classics/shanghanlun.md
      - 황제내경: classics/huangdi-neijing.md
  - 현대 연구:
      - 개요: research/index.md
      - 임상시험 읽기: research/clinical-trials.md
      - 체계적 문헌고찰: research/systematic-reviews.md

extra:
  social: []
  generator: false
  analytics: {}

extra_css:
  - assets/extra.css

copyright: "© 2026 민성 한의학 아카이브 · 운영: 민성한의원"
