site_name: 민성 한의학 아카이브
site_description: 본초·방제·고전·사상의학·침구·임상연구를 연결하는 한의학 지식 아카이브
site_url: https://wiki.minseong.co.kr/
site_author: 민성 한의학 아카이브
copyright: 민성 한의학 아카이브 · 민성한의원 운영 · <a href="https://www.minseong.co.kr/" target="_blank" rel="noopener">민성한의원 공식 홈페이지 ↗</a>
use_directory_urls: true
extra_javascript:
  - javascripts/korean-search-fallback.js
  - assets/korean-search-185.js
extra_css:
- assets/extra.css
- stylesheets/portal.css
- assets/korean-search-185.css
extra:
  generator: false
plugins:
- search:
    lang: ko
- tags
- meta
theme:
  name: material
  language: ko
  icon:
    logo: material/book-open-page-variant
  palette:
  - scheme: default
    primary: green
    accent: green
    toggle:
      icon: material/brightness-7
      name: 다크 모드로 전환
  - scheme: slate
    primary: green
    accent: green
    toggle:
      icon: material/brightness-4
      name: 라이트 모드로 전환
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - navigation.indexes
  - toc.follow
  - search.suggest
  - search.highlight
  - search.share
  - content.action.edit
  - content.code.copy
  - navigation.path
  - navigation.prune
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
