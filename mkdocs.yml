theme:
  name: material
  language: ko
  icon:
    logo: material/book-open-page-variant
  palette:
  - scheme: default
    primary: green
    accent: green
    toggle:
      icon: material/brightness-7
      name: 다크 모드로 전환
  - scheme: slate
    primary: green
    accent: green
    toggle:
      icon: material/brightness-4
      name: 라이트 모드로 전환
  features:
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - navigation.indexes
  - toc.follow
  - search.suggest
  - search.highlight
  - search.share
  - content.action.edit
  - content.code.copy
  - navigation.path
  - navigation.prune
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- footnotes
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
