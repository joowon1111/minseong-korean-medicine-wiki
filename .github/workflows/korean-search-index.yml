name: Build Korean Search Index
on:
  push:
    branches: [main]
  workflow_dispatch:

# Protected main is updated through a pull request; this workflow never pushes to it.
permissions:
  contents: write
  pull-requests: write

jobs:
  build-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml
      - name: Check for committed secrets
        run: python tools/check_secrets.py
      - name: Build Korean search index
        run: python tools/build_korean_search_index.py
      - name: Check generated index for secrets
        run: |
          git add docs/assets/korean-search-index.json
          python tools/check_secrets.py --staged
      - name: Create or update search index pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/assets/korean-search-index.json
          branch: automation/update-korean-search-index
          delete-branch: true
          commit-message: Update Korean search fallback index
          title: Update Korean search fallback index
          body: |
            Automatically refresh the committed Korean search fallback index.
            The deployment workflow also rebuilds the index before publishing.
