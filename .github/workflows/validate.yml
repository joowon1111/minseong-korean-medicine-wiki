name: Validate archive code
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_secrets.py
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: node --test tools/test_*.cjs
      - run: python tools/build_korean_search_index.py
      - run: python tools/build_ai_knowledge_layer.py
      - run: mkdocs build
      - run: python tools/audit_internal_links.py --site
      - run: python tools/audit_page_discovery.py
      - name: Check English guide on mobile and desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/guide-browser" --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/guide-browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m http.server 8766 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/guide-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_english_guide.cjs
      - name: Keep English guide browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-guide-browser
          path: guide-browser-results/
          if-no-files-found: ignore
          retention-days: 7
