name: Validate archive code
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_secrets.py
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: node --test tools/test_*.cjs
      - run: python tools/build_korean_search_index.py
      - run: python tools/build_ai_knowledge_layer.py
      - run: mkdocs build
      - run: python tools/audit_internal_links.py --site
      - run: python tools/audit_page_discovery.py
