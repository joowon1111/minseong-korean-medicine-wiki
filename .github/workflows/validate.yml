name: Validate archive code
on:
  pull_request:
  workflow_dispatch:
# Group PR runs together; keep each manual run independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    # Browser dependency downloads and all responsive checks can exceed 15 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch full source history only
        run: bash tools/fetch_source_history.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Check supplemental acupuncture record taxonomy
        run: python tools/build_acupoint_supplements.py --check

      - run: python tools/check_secrets.py
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: node --test tools/test_*.cjs
      - run: python tools/build_korean_search_index.py
      - run: python tools/build_ai_knowledge_layer.py
      - name: Build archive comparison and passage search
        run: python tools/build_archive_tools.py
      - name: Validate AI server bundle
        run: npx --yes wrangler@4.149.0 deploy --dry-run --config services/archive-ai/wrangler.jsonc --outdir "$RUNNER_TEMP/archive-ai-bundle"
      - name: Build public AI connection configuration
        run: python tools/build_archive_ai_config.py

      - run: mkdocs build
      - run: python tools/audit_internal_links.py --site
      - run: python tools/audit_page_discovery.py
      - run: python tools/audit_content_provenance.py
      - run: python tools/audit_seo.py
      - name: Check English guide on mobile and desktop
        run: |
          npm install --prefix "$RUNNER_TEMP/guide-browser" --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/guide-browser/node_modules/.bin/playwright" install --with-deps chromium
          # The Ubuntu mirror can stall on the 61 MB CJK package. Install the
          # official Korean regular font directly with bounded retries instead.
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf \
            --output "$HOME/.local/share/fonts/NotoSansCJKkr-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          python -m http.server 8766 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/guide-server.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_english_guide.cjs
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_archive_tools.cjs
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_archive_ai.cjs
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_daily_reader.cjs
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_acupoint_3d.cjs
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_sasang_explorer.cjs
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_sidebar_scroll.cjs
          # These two checks only read the built site and write distinct screenshots.
          # The runner waits for both and fails if either fails.
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" bash tools/run_parallel_browser_checks.sh
          NODE_PATH="$RUNNER_TEMP/guide-browser/node_modules" node tools/check_content_provenance.cjs
      - name: Keep archive browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-browser
          path: archive-browser-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep English guide browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: english-guide-browser
          path: guide-browser-results/
          if-no-files-found: ignore
          retention-days: 7
