name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # 185: 별도 commit workflow 없이 배포 시점에 검색 인덱스를 생성
      - name: Build Korean search index
        run: python tools/build_korean_search_index.py

      # 기존 운영 원칙대로 strict 검증
      - name: Strict MkDocs build
        run: mkdocs build 
      - name: Deploy
        run: mkdocs gh-deploy --force
