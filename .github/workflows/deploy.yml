name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Serialize Pages pushes; GitHub keeps only the latest pending deployment.
concurrency:
  group: archive-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 다음 단계에서 필요한 소스 이력만 받아 sitemap lastmod에 반영합니다.
          fetch-depth: 1

      - name: Fetch full source history only
        run: bash tools/fetch_source_history.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # 185: 별도 commit workflow 없이 배포 시점에 검색 인덱스를 생성
      - name: Check supplemental acupuncture record taxonomy
        run: python tools/build_acupoint_supplements.py --check

      - name: Build Korean search index
        run: python tools/build_korean_search_index.py

      - name: Check for committed secrets
        run: python tools/check_secrets.py

      - name: Build AI knowledge layer
        run: python tools/build_ai_knowledge_layer.py

      - name: Audit source links and duplicate URLs
        run: python tools/audit_internal_links.py

      - name: Test build, security, links and Evidence Radar
        run: python -m unittest discover -s tools -p "test_*.py"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test Korean search loading and results
        run: node --test tools/test_*.cjs

      - name: Build archive comparison and passage search
        run: python tools/build_archive_tools.py

      - name: Check AI server deployment configuration
        id: ai
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$AI_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'AI server deployment skipped: required runtime secrets are not all configured.'
          fi

      - name: Build public AI connection configuration
        env:
          ARCHIVE_AI_URL: ${{ vars.ARCHIVE_AI_URL }}
        run: python tools/build_archive_ai_config.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Audit generated site links
        run: python tools/audit_internal_links.py --site

      - name: Audit page metadata and AI documents
        run: python tools/audit_page_discovery.py

      - name: Verify document fingerprints and diagram watermarks
        run: python tools/audit_content_provenance.py

      - name: Deploy archive AI server
        if: steps.ai.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/archive-ai
          wranglerVersion: '4.149.0'
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Embed source revision for publication verification
        run: |
          test ! -e docs/indexnow-source-revision.txt
          printf "%s\n" "$GITHUB_SHA" > docs/indexnow-source-revision.txt

      - name: Deploy
        run: |
          # Keep the Pages branch and its history; buffer this generated-site push
          # instead of sending a chunked HTTP request through the transport.
          git config --local http.version HTTP/1.1
          git config --local http.postBuffer 524288000
          # Retain the current Pages commit as parent without fetching its full history.
          git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          mkdocs gh-deploy --force

      - name: Find the published Pages commit
        id: pages
        run: |
          pages_sha=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          test -n "$pages_sha"
          echo "sha=$pages_sha" >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow after Pages publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_SHA: ${{ steps.pages.outputs.sha }}
        run: python tools/indexnow_after_pages.py
