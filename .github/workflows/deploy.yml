name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize Pages pushes; GitHub keeps only the latest pending deployment.
concurrency:
  group: archive-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 문서별 실제 Git 수정일을 sitemap.xml의 lastmod에 반영합니다.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # 185: 별도 commit workflow 없이 배포 시점에 검색 인덱스를 생성
      - name: Check supplemental acupuncture record taxonomy
        run: python tools/build_acupoint_supplements.py --check

      - name: Build Korean search index
        run: python tools/build_korean_search_index.py

      - name: Check for committed secrets
        run: python tools/check_secrets.py

      - name: Build AI knowledge layer
        run: python tools/build_ai_knowledge_layer.py

      - name: Audit source links and duplicate URLs
        run: python tools/audit_internal_links.py

      - name: Test build, security, links and Evidence Radar
        run: python -m unittest discover -s tools -p "test_*.py"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Korean search loading and results
        run: node --test tools/test_*.cjs

      - name: Build archive comparison and passage search
        run: python tools/build_archive_tools.py

      - name: Check AI server deployment configuration
        id: ai
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$AI_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'AI server deployment skipped: required runtime secrets are not all configured.'
          fi

      - name: Build public AI connection configuration
        env:
          ARCHIVE_AI_URL: ${{ vars.ARCHIVE_AI_URL }}
        run: python tools/build_archive_ai_config.py

      - name: Build MkDocs site
        run: mkdocs build

      - name: Audit generated site links
        run: python tools/audit_internal_links.py --site

      - name: Audit page metadata and AI documents
        run: python tools/audit_page_discovery.py

      - name: Verify document fingerprints and diagram watermarks
        run: python tools/audit_content_provenance.py

      - name: Deploy archive AI server
        if: steps.ai.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/archive-ai
          wranglerVersion: '4.149.0'
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy
        run: |
          # Keep the Pages branch and its history; buffer this generated-site push
          # instead of sending a chunked HTTP request through the transport.
          git config --local http.version HTTP/1.1
          git config --local http.postBuffer 524288000
          mkdocs gh-deploy --force
