name: Evidence Radar Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  evidence-autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build internal Evidence Radar candidates
        run: python tools/evidence-radar/evidence_autopilot.py --docs docs
      - name: Upload internal review artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-radar-autopilot
          path: evidence-radar-work/autopilot/
          retention-days: 30
