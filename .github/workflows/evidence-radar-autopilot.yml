name: Evidence Radar Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  evidence-autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build internal Evidence Radar candidates
        run: python tools/evidence-radar/evidence_autopilot.py --docs docs
      - name: Upload internal review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-radar-autopilot
          path: evidence-radar-work/autopilot/
          retention-days: 30
