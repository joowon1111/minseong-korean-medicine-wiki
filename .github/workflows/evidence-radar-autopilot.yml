name: Evidence Radar Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  evidence-autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build internal Evidence Radar candidates
        run: python tools/evidence-radar/evidence_autopilot.py --docs docs
      - name: Upload internal review artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-radar-autopilot
          path: evidence-radar-work/autopilot/
          retention-days: 30
