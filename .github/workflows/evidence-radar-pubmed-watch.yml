name: Evidence Radar PubMed Watch

on:
  workflow_dispatch:
  schedule:
    # Every Monday 03:20 KST = Sunday 18:20 UTC
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  pubmed-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check PubMed for newly published evidence
        run: |
          python tools/evidence-radar/pubmed_weekly_watch.py --days 14 --retmax 200 --docs docs

      - name: Upload private Evidence Radar batch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pubmed-evidence-radar-${{ github.run_number }}
          path: evidence-radar-work/pubmed-watch/
          retention-days: 90
