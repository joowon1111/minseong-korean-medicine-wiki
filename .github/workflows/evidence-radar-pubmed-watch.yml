name: Evidence Radar PubMed Watch

on:
  workflow_dispatch:
  schedule:
    # Every Monday 03:20 KST = Sunday 18:20 UTC
    - cron: "20 18 * * 0"

permissions:
  contents: read

jobs:
  pubmed-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check PubMed for newly published evidence
        run: |
          python tools/evidence-radar/pubmed_weekly_watch.py --days 14 --retmax 200 --docs docs

      - name: Upload private Evidence Radar batch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pubmed-evidence-radar-${{ github.run_number }}
          path: evidence-radar-work/pubmed-watch/
          retention-days: 90
