name: Checkout v7 authentication test
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/checkout-v7-auth-test.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Verify authenticated fetch and push negotiation
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git push --dry-run origin HEAD:refs/heads/checkout-v7-auth-test-dry-run
