" y="23" font-size="13" text-anchor="start">뒤통수뼈</text></g><a id="suboccipitals" class="link" href="/clinical-anatomy/mps-neck/#suboccipitals" target="_top" aria-label="후두하근군 해부와 평가"><title>후두하근군 · Suboccipital muscles</title><g transform="translate(667.33 155) scale(0.950)"><path class="muscle" d="M115 151 L97 100 L112 104 Z M125 151 L128 104 L143 100 Z M113 208 L61 88 L88 102 Z M126 208 L153 102 L180 88 Z M57 151 L42 78 L62 85 Z M183 151 L178 86 L196 79 Z M117 210 L54 158 L72 151 Z M124 210 L167 151 L186 158 Z"/></g><rect class="button" x="642.67" y="532" width="277.33" height="34" rx="8"/><text x="781.3333333333333" y="555" font-size="17" text-anchor="middle">후두하근군 →</text></a><text x="28" y="613" font-size="15" text-anchor="start">초록: 해당 근육·근육군  |  베이지: 뼈·체표 윤곽  |  근육층은 패널별로 분리</text><text x="28" y="642" font-size="14" text-anchor="start">관계를 단순화한 자체 제작 도해 · 고정 유발점·자침 깊이·경로를 나타내지 않습니다.</text><text x="28" y="666" font-size="12" text-anchor="start">민성 한의학 아카이브 · 해부 출처와 평가 기준은 연결된 본문 참조</text></svg>