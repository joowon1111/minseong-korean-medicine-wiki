<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">목·뒤통수 · 근육 해부 도해</title><desc id="desc">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff"/><text x="28" y="43" font-size="27" text-anchor="start">목·뒤통수 · 근육 해부 도해</text><text x="28" y="74" font-size="15" text-anchor="start">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</text><rect x="32.0" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8"/><text x="178.66666666666666" y="128" font-size="13" text-anchor="middle">뒤쪽 · 표층</text><g transform="translate(64.67 155) scale(0.950)"><ellipse class="skin" cx="120" cy="52" rx="51" ry="52"/><path class="skin" d="M89 94 L85 171 Q60 186 13 198 L10 308 L230 308 L227 198 Q175 187 156 171 L152 94 Z"/><path class="bone" d="M120 110 L120 284"/><path class="bone" d="M44 218 L98 210 L72 287 Z"/><path class="bone" d="M142 211 L198 218 L171 287 Z"/><text x="113" y="338" font-size="14" text-anchor="middle">뒤쪽</text></g><a id="upper-trapezius" class="link" href="/clinical-anatomy/mps-neck/#upper-trapezius" target="_top" aria-label="상부 승모근 해부와 평가"><title>상부 승모근 · Upper trapezius</title><g transform="translate(64.67 155) scale(0.950)"><path class="muscle" d="M116 87 L115 176 Q78 193 30 201 L