<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M225 110 Q205 150 224 180 L240 560 L400 560 L416 180 Q435 150 415 110 Z" /><path class="crease" d="M225 150 L415 150" /><path class="crease" d="M240 545 L400 545" /><path class="tendon" d="M262 180 L270 545 M327 190 L325 545 M357 190 L350 545" /><text class="landmark" x="231" y="91">팔꿈치 앞주름</text><text class="landmark" x="253" y="590">손목주름 · 아래쪽</text><text class="landmark" x="431" y="122">노쪽</text><text class="landmark" x="117" y="121">자쪽</text><g id="HT6" class="point"><circle cx="285" cy="528.5" r="7" /></g><g id="LU6" class="point"><circle cx="389" cy="314.6" r="7" /></g><g id="PC4" class="point"><circle cx="337" cy="380.4" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>