<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M215 117 Q204 165 230 209 L201 576 L419 576 L393 209 Q419 163 405 117 Z" /><path class="tendon" d="M242 206 L229 554 M300 182 L303 554 M349 184 L347 554" /><path class="crease" d="M230 213 Q310 229 393 213" /><text class="landmark" x="242" y="99">손가락 방향 ↑</text><text class="landmark" x="265" y="607">팔꿈치 방향 ↓</text><text class="landmark" x="431" y="132">엄지 쪽</text><text class="landmark" x="73" y="561">자쪽손목굽힘근건</text><text class="landmark" x="258" y="580">긴손바닥근건</text><text class="landmark" x="423" y="561">노쪽손목굽힘근건</text><g id="HT7" class="point"><circle cx="258" cy="215" r="8" /></g><g id="HT5" class="point"><circle cx="258" cy="285" r="8" /></g><g id="HT4" class="point"><circle cx="258" cy="320" r="8" /></g><g id="LU9" class="point"><circle cx="386" cy="213" r="8" /></g><g id="PC7" class="point"><circle cx="326" cy="218" r="8" /></g><g id="LU8" class="point"><circle cx="386" cy="283" r="8" /></g><g id="PC6" class="point"><circle cx="326" cy="358" r="8" /></g><g id="PC5" class="point"><circle cx="326" cy="428" r="8" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>