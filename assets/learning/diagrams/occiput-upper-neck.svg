<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M205 125 Q320 64 435 125 L424 316 L383 397 L390 547 L250 547 L257 397 L216 316 Z" /><path class="bone" d="M218 317 Q320 333 422 317" /><circle class="joint" cx="320" cy="318" r="12" /><path class="guide" d="M320 134 L320 533" /><path class="guide" d="M255 458 L385 458" /><text class="landmark" x="417" y="340">바깥뒤통수뼈융기</text><text class="landmark" x="405" y="462">C2 위쪽</text><text class="landmark" x="209" y="591">뒤통수·목 뒷면 확대</text><g id="GV17" class="point"><circle cx="320" cy="302" r="7" /></g><g id="BL9" class="point"><circle cx="359" cy="302" r="7" /></g><g id="GB19" class="point"><circle cx="397" cy="302" r="7" /></g><g id="GV16" class="point"><circle cx="320" cy="366" r="7" /></g><g id="GV15" class="point"><circle cx="320" cy="458" r="7" /></g><g id="BL10" class="point"><circle cx="376" cy="458" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>