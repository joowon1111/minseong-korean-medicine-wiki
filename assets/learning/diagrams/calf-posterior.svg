<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z" /><path class="crease" d="M236 228 Q311 246 401 229" /><path class="tendon" d="M257 135 L256 228 M374 135 L374 228" /><text class="landmark" x="103" y="110">안쪽</text><text class="landmark" x="437" y="110">가쪽</text><text class="landmark" x="422" y="242">오금주름</text><text class="landmark" x="268" y="610">종아리 방향 ↓</text><path class="tendon" d="M263 278 Q255 380 316 403 Q384 380 376 278" /><path class="tendon" d="M316 403 L329 568" /><circle class="joint" cx="362" cy="568" r="12" /><g id="BL38" class="point"><circle cx="374" cy="215" r="7" /></g><g id="BL39" class="point"><circle cx="374" cy="236" r="7" /></g><g id="BL55" class="point"><circle cx="318" cy="277" r="7" /></g><g id="BL56" class="point"><circle cx="318" cy="340" r="7" /></g><g id="BL57" class="point"><circle cx="316" cy="403" r="7" /></g><g id="BL58" class="point"><circle cx="346" cy="424" r="7" /></g><g id="BL59" class="point"><circle cx="355" cy="506" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>