<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z" /><ellipse class="joint" cx="313" cy="208" rx="42" ry="44" /><path class="bone" d="M313 253 L310 570" /><path class="bone" d="M355 296 L367 559" /><text class="landmark" x="80" y="111">안쪽</text><text class="landmark" x="436" y="111">가쪽</text><text class="landmark" x="436" y="216">무릎뼈</text><text class="landmark" x="78" y="521">정강뼈</text><text class="landmark" x="439" y="505">종아리뼈</text><g id="SP10" class="point"><circle cx="246" cy="143" r="8" /></g><g id="ST35" class="point"><circle cx="347" cy="262" r="8" /></g><g id="GB34" class="point"><circle cx="389" cy="298" r="8" /></g><g id="ST36" class="point"><circle cx="346" cy="322" r="8" /></g><g id="ST37" class="point"><circle cx="346" cy="382" r="8" /></g><g id="ST40" class="point">