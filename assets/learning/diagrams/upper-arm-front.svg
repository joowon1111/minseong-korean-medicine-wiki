<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M260 115 Q338 69 399 125 Q420 161 394 218 L389 542 L236 542 L232 218 Q214 161 260 115 Z" /><path class="tendon" d="M256 188 Q284 294 277 475 M355 181 Q383 301 349 475" /><path class="crease" d="M237 525 L389 525" /><path class="crease" d="M238 178 L350 178" /><text class="landmark" x="235" y="95">앞겨드랑주름</text><text class="landmark" x="245" y="578">팔꿈치주름</text><text class="landmark" x="105" y="119">안쪽</text><text class="landmark" x="438" y="119">가쪽</text><g id="HT1" class="point"><circle cx="237" cy="169" r="7" /></g><g id="HT2" class="point"><circle cx="251" cy="421" r="7" /></g><g id="PC2" class="point"><circle cx="316" cy="247" r="7" /></g><g id="LU3" class="point"><circle cx="371" cy="282" r="7" /></g><g id="LU4" class="point"><circle cx="370" cy="317" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계