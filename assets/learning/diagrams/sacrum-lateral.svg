<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M180 121 Q320 86 460 121 L450 498 Q384 552 320 570 Q253 552 190 498 Z" /><path class="joint" d="M246 166 L394 166 L372 327 L320 461 L268 327 Z" /><path class="guide" d="M320 145 L320 503" /><circle class="joint" cx="348" cy="195" r="9" /><path class="guide" d="M289 195 L430 195" /><text class="landmark" x="242" y="199">S1</text><circle class="joint" cx="345" cy="252" r="9" /><path class="guide" d="M289 252 L430 252" /><text class="landmark" x="242" y="256">S2</text><circle class="joint" cx="342" cy="309" r="9" /><path class="guide" d="M289 309 L430 309" /><text class="landmark" x="242" y="313">S3</text><circle class="joint" cx="339" cy="366" r="9" /><path class="guide" d="M289 366 L430 366" /><text class="landmark" x="242" y="370">S4</text><text class="landmark" x="179" y="604">뒤엉치뼈구멍 · 엉치뼈 뒷면</text><circle class="joint" cx="320" cy="465" r="6" /><g id="BL27" class="point"><circle cx="378" cy="195" r="7" /></g><g id="BL28" class="point"><circle cx="378" cy="252" r="7" /></g><g id="BL53" class="point"><circle cx="436" cy="252" r="7" /></g><g id="BL29" class="point"><circle cx="378" cy="309" r="7" /></g><g id="BL30" class="point"><circle cx="378" cy="366" r="7" /></g><g id="BL54" class="point"><circle cx="436" cy="366" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>