<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">기초 해부학 · 구조 식별</title><desc id="desc">주황색으로 강조된 구조의 이름을 말하세요. 해부 관계를 단순화한 자체 제작 개념도입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff" /><rect x="32.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(38.00 155) scale(0.858)"><path class="skin" d="M62 25 Q120 5 179 25 Q210 98 178 192 L148 322 L92 322 L62 191 Q35 97 62 25 Z" /><path class="bone" d="M71 28 Q120 47 171 28" /><path class="bone" d="M104 318 L102 344 L141 347 L142 318 Z" /></g><g id="gastrocnemius" class="link"><g transform="translate(38.00 155) scale(0.858)"><path class="muscle" d="M77 29 Q49 74 67 147 Q83 186 108 200 L111 273 L104 324 L132 324 L130 270 L134 199 Q172 179 177 134 Q185 69 162 30 L130 43 L122 147 L115 45 Z" /><path class="fiber" d="M86 46 Q68 108 111 178 M150 49 Q172 110 133 177 M120 216 L117 313" /></g></g><rect x="258.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(264.00 155) scale(0.858)"><path class="skin" d="M62 25 Q120 5 179 25 Q210 98 178 192 L148 322 L92 322 L62 191 Q35 97 62 25 Z" /><path class="bone" d="M71 28 Q120 47 171 28" /><path class="bone" d="M104 318 L102 344 L141 347 L142 318 Z" /></g><g id="soleus" class="link"><g transform="translate(264.00 155) scale(0.858)"><path class="muscle" d="M74 69 Q47 137 78 209 L108 272 L106 324 L133 324 L132 270 L164 208 Q190 134 164 71 L140 83 L102 84 Z" /><path class="fiber" d="M84 98 L111 241 M155 97 L130 242 M120 266 L119 315" /></g></g><rect x="484.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(490.00 155) scale(0.858)"><path class="skin" d="M62 25 Q120 5 179 25 Q210 98 178 192 L148 322 L92 322 L62 191 Q35 97 62 25 Z" /><path class="bone" d="M71 28 Q120 47 171 28" /><path class="bone" d="M104 318 L102 344 L141 347 L142 318 Z" /></g><g id="tibialis-anterior" class="link"><g transform="translate(490.00 155) scale(0.858)"><path class="muscle" d="M92 35 Q78 107 91 206 L104 286 L101 326 L117 327 L122 286 L119 205 L121 50 Z" /><path class="fiber" d="M104 50 L106 281 L109 315" /></g></g><rect x="710.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(716.00 155) scale(0.858)"><path class="skin" d="M62 25 Q120 5 179 25 Q210 98 178 192 L148 322 L92 322 L62 191 Q35 97 62 25 Z" /><path class="bone" d="M71 28 Q120 47 171 28" /><path class="bone" d="M104 318 L102 344 L141 347 L142 318 Z" /></g><g id="tibialis-posterior" class="link"><g transform="translate(716.00 155) scale(0.858)"><path class="muscle" d="M113 58 L132 58 L143 179 L130 268 L132 323 L111 323 L113 267 L101 180 Z" /><path class="fiber" d="M120 73 L121 305" /></g></g><text x="28" y="43" font-size="22">종아리·발뒤꿈치 · 구조 식별</text><text x="28" y="74" font-size="15">주황색으로 강조된 구조를 확인하세요.</text><text x="28" y="613" font-size="15">패널별로 층·관점을 나눈 개념도 · 실제 해부사진·현미경 사진과 다릅니다.</text></svg>