inseong.co.kr</text></g><metadata id="minseong-provenance">{&quot;asset_id&quot;: &quot;MSA-IMG-AFAA6A764560&quot;, &quot;publisher&quot;: &quot;민성 한의학 아카이브&quot;, &quot;url&quot;: &quot;https://wiki.minseong.co.kr/assets/learning/anatomy-diagrams/thigh.svg&quot;, &quot;source_sha256&quot;: &quot;278404c7e7c9b0965c689fe411cf1cf41936e0611b4e95ad0b33f4123d159c16&quot;, &quot;commit&quot;: &quot;ecb5730aa2de99f46887838d4e4ae53b8b26e5cc&quot;, &quot;committed_at&quot;: &quot;2026-10-31T13:10:48+09:00&quot;}</metadata></svg>