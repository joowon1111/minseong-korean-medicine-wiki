<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">기초 해부학 · 구조 식별</title><desc id="desc">주황색으로 강조된 구조의 이름을 말하세요. 해부 관계를 단순화한 자체 제작 개념도입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff" /><rect x="32.0" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(64.67 155) scale(0.950)"><path class="skin" d="M40 164 Q17 125 30 72 Q46 18 113 20 Q183 15 198 78 L195 114 L218 137 L197 146 L200 175 L212 180 L199 191 Q198 224 164 230 L151 288 L63 285 L73 230 Q45 218 40 164 Z" /><path class="bone" d="M84 161 L104 206 L185 204 L170 226 L91 234 L64 174 Z" /><path class="bone" d="M79 145 L164 143" /><ellipse class="bone" cx="75" cy="151" rx="11" ry="15" /><path class="line" d="M182 115 L193 116" /></g><g id="masseter" class="link"><g transform="translate(64.67 155) scale(0.950)"><path class="muscle" d="M88 147 L151 146 L160 210 L108 219 Z" /><path class="fiber" d="M100 155 L119 207 M119 155 L133 207 M139 155 L147 204" /></g></g><rect x="333.3333333333333" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(366.00 155) scale(0.950)"><path class="skin" d="M40 164 Q17 125 30 72 Q46 18 113 20 Q183 15 198 78 L195 114 L218 137 L197 146 L200 175 L212 180 L199 191 Q198 224 164 230 L151 288 L63 285 L73 230 Q45 218 40 164 Z" /><path class="bone" d="M84 161 L104 206 L185 204 L170 226 L91 234 L64 174 Z" /><path class="bone" d="M79 145 L164 143" /><ellipse class="bone" cx="75" cy="151" rx="11" ry="15" /><path class="line" d="M182 115 L193 116" /></g><g id="temporalis" class="link"><g transform="translate(366.00 155) scale(0.950)"><path class="muscle" d="M46 114 Q23 58 77 35 Q143 15 178 76 L161 122 L140 179 L126 183 L119 130 Z" /><path class="fiber" d="M56 67 L132 165 M94 47 L134 161 M152 67 L138 158" /></g></g><rect x="634.6666666666666" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(667.33 155) scale(0.950)"><path class="skin" d="M40 164 Q17 125 30 72 Q46 18 113 20 Q183 15 198 78 L195 114 L218 137 L197 146 L200 175 L212 180 L199 191 Q198 224 164 230 L151 288 L63 285 L73 230 Q45 218 40 164 Z" /><path class="bone" d="M84 161 L104 206 L185 204 L170 226 L91 234 L64 174 Z" /><path class="bone" d="M79 145 L164 143" /><ellipse class="bone" cx="75" cy="151" rx="11" ry="15" /><path class="line" d="M182 115 L193 116" /><path class="line" d="M82 137 L174 137" /></g><g id="lateral-pterygoid" class="link"><g transform="translate(667.33 155) scale(0.950)"><path class="muscle" d="M67 125 L94 115 L172 145 L164 166 L91 151 Z" /><path class="fiber" d="M82 128 L159 151 M89 141 L157 158" /></g></g><text x="28" y="43" font-size="22">턱·관자 · 구조 식별</text><text x="28" y="74" font-size="15">주황색으로 강조된 구조를 확인하세요.</text><text x="28" y="613" font-size="15">패널별로 층·관점을 나눈 개념도 · 실제 해부사진·현미경 사진과 다릅니다.</text></svg>