<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">넓적다리 뒷면 · 승부·은문</title><desc id="desc">승부는 볼기주름 중점, 은문은 그 아래 6 B-cun의 두 넙다리 뒤근육 사이입니다. 볼기주름–오금주름을 19 B-cun으로 봅니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">넓적다리 뒷면 · 승부·은문</text><path class="skin" d="M230 120 Q315 88 410 120 L405 311 Q394 452 380 559 L246 559 Q223 441 216 306 Z"/><path class="crease" d="M223 171 Q315 215 407 171"/><path class="crease" d="M248 551 L380 551"/><text class="landmark" x="254" y="132">볼기주름</text><text class="landmark" x="255" y="600">오금주름</text><a id="BL36" class="point" href="/acupuncture/points/bl36/" target="_top" aria-label="승부 BL36 상세 설명"><title>승부 BL36 · 엉덩이부위, 엉덩이 주름(gluteal fold)의 중점.</title><path class="callout" d="M315 193 L512 188"/><circle cx="315" cy="193" r="7"/><text x="520" y="193">BL36</text></a><a id="BL37" class="point" href="/acupuncture/points/bl37/" target="_top" aria-label="은문 BL37 상세 설명"><title>은문 BL37 · 넓적다리 뒤쪽면, 넙다리두갈래근(biceps femoris muscle)과 반힘줄모양근(semitendinosus muscle)의 사이, 엉덩이주름(gluteal fold)에서 아래쪽으로 6寸.</title><path class="callout" d="M315 319 L512 314"/><circle cx="315" cy="319" r="7"/><text x="520" y="319">BL37</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>