<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">넓적다리 가쪽 · 풍시·중독</title><desc id="desc">풍시는 팔을 늘어뜨렸을 때 가운데손가락 끝이 닿는 장경인대 뒤쪽입니다. 중독은 오금 위 7 B-cun, 슬양관은 가쪽위관절융기 위뒤의 힘줄과 장경인대 사이입니다. 풍시의 높이는 손가락 표지를 우선합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">넓적다리 가쪽 · 풍시·중독</text><path class="skin" d="M230 120 Q315 88 410 120 L405 311 Q394 452 380 559 L246 559 Q223 441 216 306 Z"/><path class="tendon" d="M302 138 L303 532"/><circle class="joint" cx="320" cy="543" r="20"/><text class="landmark" x="191" y="96">앞쪽 ← · → 뒤쪽</text><text class="landmark" x="138" y="570">가쪽위관절융기</text><text class="landmark" x="393" y="369">장경인대</text><a id="GB31" class="point" href="/acupuncture/points/gb31/" target="_top" aria-label="풍시 GB31 상세 설명"><title>풍시 GB31 · 넓적다리 가쪽면, 양팔을 넓적다리에 나란히 늘어뜨리고 똑바로 섰을 때, 가운데손가락 끝이 닿는 엉덩정강근 막띠(iliotibial band) 뒤쪽의 오목한 곳.</title><path class="callout" d="M339 323 L512 318"/><circle cx="339" cy="323" r="7"/><text x="520" y="323">GB31</text></a><a id="GB32" class="point" href="/acupuncture/points/gb32/" target="_top" aria-label="중독 GB32 상세 설명"><title>중독 GB32 · 넓적다리 가쪽면, 엉덩정강근막띠 (iliotibial band)의 뒤쪽, 오금주름 (popliteal crease)에서 위쪽으로 7寸.</title><path class="callout" d="M336 396 L512 391"/><circle cx="336" cy="396" r="7"/><text x="520" y="396">GB32</text></a><a id="GB33" class="point" href="/acupuncture/points/gb33/" target="_top" aria-label="슬양관 GB33 상세 설명"><title>슬양관 GB33 · 무릎 가쪽면, 넙다리두갈래근힘줄 (biceps femoris tendon)과 엉덩정강근막띠(iliotibial band)의 사이, 넙다리 뼈 가쪽위관절융기(lateral epicondyle of the femur) 위뒤쪽 오목한 곳.</title><path class="callout" d="M348 521 L512 516"/><circle cx="348" cy="521" r="7"/><text x="520" y="521">GB33</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>