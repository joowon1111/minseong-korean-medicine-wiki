<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">위팔 가쪽·뒷면</title><desc id="desc">주료·수오리·비노는 위팔 가쪽입니다. 청랭연·소락은 팔꿈치머리 위 2·5 B-cun의 뒷면, 노회는 어깨뼈봉우리각 아래 3 B-cun의 어깨세모근 뒤아래입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">위팔 가쪽·뒷면</text><path class="skin" d="M260 115 Q338 69 399 125 Q420 161 394 218 L389 542 L236 542 L232 218 Q214 161 260 115 Z"/><path class="tendon" d="M320 181 L320 502"/><circle class="joint" cx="320" cy="528" r="21"/><path class="bone" d="M264 134 L398 134"/><text class="landmark" x="228" y="96">어깨봉우리</text><text class="landmark" x="251" y="579">팔꿈치머리</text><text class="landmark" x="110" y="118">앞쪽</text><text class="landmark" x="438" y="118">뒤쪽</text><a id="LI14" class="point" href="/acupuncture/points/li14/" target="_top" aria-label="비노 LI14 상세 설명"><title>비노 LI14 · 위팔 가쪽면, 어깨세모근(deltoid muscle)의 앞모서리 바로 앞쪽, 曲池(LI11)에서 위쪽으로 7寸.</title><path class="callout" d="M260 289 L88 284"/><circle cx="260" cy="289" r="7"/><text x="24" y="289">LI14</text></a><a id="LI13" class="point" href="/acupuncture/points/li13/" target="_top" aria-label="수오리 LI13 상세 설명"><title>수오리 LI13 · 위팔 가쪽면, 曲池(LI11)와 肩髃(LI15)를 연결하는 선 위, 팔오금주름(cubital crease)에서 위쪽으로 3寸.</title><path class="callout" d="M250 429 L88 424"/><circle cx="250" cy="429" r="7"/><text x="24" y="429">LI13</text></a><a id="LI12" class="point" href="/acupuncture/points/li12/" target="_top" aria-label="주료 LI12 상세 설명"><title>주료 LI12 · 팔꿈치 뒤가쪽면, 위팔뼈 가쪽위관절융기(lateral epicondyle of the humerus) 위쪽, 가쪽위관절융기 위 능선(lateral supraepicondylar ridge) 앞쪽.</title><path class="callout" d="M251 503 L88 498"/><circle cx="251" cy="503" r="7"/><text x="24" y="503">LI12</text></a><a id="TE13" class="point" href="/acupuncture/points/te13/" target="_top" aria-label="노회 TE13 상세 설명"><title>노회 TE13 · 위팔 뒤쪽면, 어깨세모근(deltoid muscle)의 뒤모서리 아래뒤쪽, 봉우리각(acromial angle)에서 아래쪽으로 3寸.</title><path class="callout" d="M361 239 L512 234"/><circle cx="361" cy="239" r="7"/><text x="520" y="239">TE13</text></a><a id="TE12" class="point" href="/acupuncture/points/te12/" target="_top" aria-label="소락 TE12 상세 설명"><title>소락 TE12 · 위팔 뒤쪽면, 팔꿈치머리 융기(prominence of the olecranon)와 봉우리각(acromial angle)을 연결하는 선 위, 팔꿈치머리 융기에서 몸쪽으로 5寸.</title><path class="callout" d="M320 353 L512 348"/><circle cx="320" cy="353" r="7"/><text x="520" y="353">TE12</text></a><a id="TE11" class="point" href="/acupuncture/points/te11/" target="_top" aria-label="청랭연 TE11 상세 설명"><title>청랭연 TE11 · 위팔 뒤쪽면, 팔꿈치머리 융기(prominence of the olecranon)와 봉우리각(acromial angle)을 연결하는 선 위, 팔꿈치머리 융기에서 몸쪽으로 2寸.</title><path class="callout" d="M320 458 L512 453"/><circle cx="320" cy="458" r="7"/><text x="520" y="458">TE11</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>