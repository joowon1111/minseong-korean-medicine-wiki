<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">뒤통수·위쪽 목</title><desc id="desc">뇌호·옥침·뇌공은 바깥뒤통수뼈융기 위모서리 높이이며, 옥침은 옆 1.3 B-cun, 뇌공은 풍지 수직 위입니다. 아문·천주는 C2 위쪽 높이, 풍부는 뒤통수뼈융기 아래입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">뒤통수·위쪽 목</text><path class="skin" d="M205 125 Q320 64 435 125 L424 316 L383 397 L390 547 L250 547 L257 397 L216 316 Z"/><path class="bone" d="M218 317 Q320 333 422 317"/><circle class="joint" cx="320" cy="318" r="12"/><path class="guide" d="M320 134 L320 533"/><path class="guide" d="M255 458 L385 458"/><text class="landmark" x="417" y="340">바깥뒤통수뼈융기</text><text class="landmark" x="405" y="462">C2 위쪽</text><text class="landmark" x="209" y="591">뒤통수·목 뒷면 확대</text><a id="GV17" class="point" href="/acupuncture/points/gv17/" target="_top" aria-label="뇌호 GV17 상세 설명"><title>뇌호 GV17 · 머리, 뒤정중선(posterior median line) 위, 바깥뒤통수뼈융기(external occipital protuberance) 위쪽 오목한 곳.</title><path class="callout" d="M320 302 L512 297"/><circle cx="320" cy="302" r="7"/><text x="520" y="302">GV17</text></a><a id="BL9" class="point" href="/acupuncture/points/bl9/" target="_top" aria-label="옥침 BL9 상세 설명"><title>옥침 BL9 · 머리, 바깥뒤통수뼈융기(external occipital protuberance) 위모서리와 같은 높이, 뒤 정중선(posterior median line)에서 가쪽으로 1.3寸.</title><path class="callout" d="M359 302 L512 336"/><circle cx="359" cy="302" r="7"/><text x="520" y="341">BL9</text></a><a id="GB19" class="point" href="/acupuncture/points/gb19/" target="_top" aria-label="뇌공 GB19 상세 설명"><title>뇌공 GB19 · 머리, 風池(GB20)에서 수직으로 위 쪽, 바깥뒤통수뼈융기(external occipital protuberance) 위모서리와 같은 높이.</title><path class="callout" d="M397 302 L512 375"/><circle cx="397" cy="302" r="7"/><text x="520" y="380">GB19</text></a><a id="GV16" class="point" href="/acupuncture/points/gv16/" target="_top" aria-label="풍부 GV16 상세 설명"><title>풍부 GV16 · 목 뒤부위, 바깥뒤통수뼈융기(external occipital protuberance)에서 수직으로 아래쪽, 양쪽 등세모근(trapezius muscle) 사이의 오목한 곳.</title><path class="callout" d="M320 366 L512 414"/><circle cx="320" cy="366" r="7"/><text x="520" y="419">GV16</text></a><a id="GV15" class="point" href="/acupuncture/points/gv15/" target="_top" aria-label="아문 GV15 상세 설명"><title>아문 GV15 · 목 뒤부위, 뒤정중선(posterior median line), 둘째 목뼈 가시돌기(spinous process of the 2nd cervical vertebra) 위쪽 오목한 곳.</title><path class="callout" d="M320 458 L512 453"/><circle cx="320" cy="458" r="7"/><text x="520" y="458">GV15</text></a><a id="BL10" class="point" href="/acupuncture/points/bl10-tianzhu/" target="_top" aria-label="천주 BL10 상세 설명"><title>천주 BL10 · 목 뒤부위, 둘째 목뼈 가시돌기(spinous process of the 2nd cervical vertebra) 위모서리와 같은 높이, 등세모근(trapezius muscle) 가쪽모서리 오목한 곳.</title><path class="callout" d="M376 458 L512 492"/><circle cx="376" cy="458" r="7"/><text x="520" y="497">BL10</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>