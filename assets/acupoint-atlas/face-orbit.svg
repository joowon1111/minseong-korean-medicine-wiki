<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">눈·눈썹·광대 주변</title><desc id="desc">승읍은 눈확 아래모서리와 안구 사이, 사백은 눈확아래구멍입니다. 정명은 안쪽눈구석 위안쪽, 찬죽·사죽공은 눈썹 안쪽·가쪽 끝입니다. 눈 주변의 표면 위치만 표시합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">눈·눈썹·광대 주변</text><path class="skin" d="M223 105 Q320 63 417 105 Q446 199 419 369 Q396 464 321 491 Q242 464 220 369 Q193 200 223 105 Z"/><path class="crease" d="M240 222 Q266 201 292 222 Q266 242 240 222 M347 222 Q372 201 398 222 Q372 242 347 222"/><circle class="joint" cx="267" cy="222" r="4"/><circle class="joint" cx="372" cy="222" r="4"/><path class="tendon" d="M239 197 Q267 184 291 197 M347 197 Q372 184 398 197"/><path class="crease" d="M315 229 L303 312 Q320 326 337 312 L325 229 M293 321 Q320 340 347 321"/><path class="crease" d="M278 377 Q320 360 362 377 Q320 393 278 377 M298 414 Q320 423 342 414"/><path class="guide" d="M372 168 L372 355"/><text class="landmark" x="168" y="530">정면 · 한쪽 짝혈만 표시</text><a id="GB14" class="point" href="/acupuncture/points/gb14/" target="_top" aria-label="양백 GB14 상세 설명"><title>양백 GB14 · 머리, 동공(pupil) 중심에서 수직으로 위쪽, 눈썹 위쪽으로 1寸.</title><path class="callout" d="M372 155 L88 150"/><circle cx="372" cy="155" r="7"/><text x="24" y="155">GB14</text></a><a id="TE23" class="point" href="/acupuncture/points/te23/" target="_top" aria-label="사죽공 TE23 상세 설명"><title>사죽공 TE23 · 머리, 눈썹 가쪽끝의 오목한 곳.</title><path class="callout" d="M403 195 L88 190"/><circle cx="403" cy="195" r="7"/><text x="24" y="195">TE23</text></a><a id="GB1" class="point" href="/acupuncture/points/gb1/" target="_top" aria-label="동자료 GB1 상세 설명"><title>동자료 GB1 · 머리, 가쪽눈구석(outer canthus)에서 가쪽으로 0.5寸 오목한 곳.</title><path class="callout" d="M410 222 L88 229"/><circle cx="410" cy="222" r="7"/><text x="24" y="234">GB1</text></a><a id="ST2" class="point" href="/acupuncture/points/st2/" target="_top" aria-label="사백 ST2 상세 설명"><title>사백 ST2 · 얼굴, 눈확아래구멍(infraorbital foramen).</title><path class="callout" d="M372 263 L88 268"/><circle cx="372" cy="263" r="7"/><text x="24" y="273">ST2</text></a><a id="ST3" class="point" href="/acupuncture/points/st3/" target="_top" aria-label="거료 ST3 상세 설명"><title>거료 ST3 · 얼굴, 동공(pupil)에서 수직으로 아래 쪽, 콧방울(ala of the nose) 아래모서리와 같은 높이.</title><path class="callout" d="M372 326 L88 321"/><circle cx="372" cy="326" r="7"/><text x="24" y="326">ST3</text></a><a id="BL2" class="point" href="/acupuncture/points/bl2/" target="_top" aria-label="찬죽 BL2 상세 설명"><title>찬죽 BL2 · 머리, 눈썹 안쪽끝의 오목한 곳.</title><path class="callout" d="M346 195 L512 190"/><circle cx="346" cy="195" r="7"/><text x="520" y="195">BL2</text></a><a id="BL1" class="point" href="/acupuncture/points/bl1/" target="_top" aria-label="정명 BL1 상세 설명"><title>정명 BL1 · 얼굴, 안쪽눈구석(inner canthus)의 위 안쪽 부분과 눈확(orbit)의 안쪽 벽 사이의 오목한 곳.</title><path class="callout" d="M343 216 L512 229"/><circle cx="343" cy="216" r="7"/><text x="520" y="234">BL1</text></a><a id="ST1" class="point" href="/acupuncture/points/st1/" target="_top" aria-label="승읍 ST1 상세 설명"><title>승읍 ST1 · 얼굴, 동공(pupil)에서 수직으로 아래 쪽, 안구(eyeball)와 눈확아래모서리(infraorbital margin)의 사이.</title><path class="callout" d="M372 237 L512 268"/><circle cx="372" cy="237" r="7"/><text x="520" y="273">ST1</text></a><a id="SI18" class="point" href="/acupuncture/points/si18/" target="_top" aria-label="관료 SI18 상세 설명"><title>관료 SI18 · 얼굴, 광대뼈(zygomatic bone) 아래쪽, 가쪽눈구석(outer canthus)에서 수직으로 아래쪽 오목한 곳.</title><path class="callout" d="M398 307 L512 307"/><circle cx="398" cy="307" r="7"/><text x="520" y="312">SI18</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>