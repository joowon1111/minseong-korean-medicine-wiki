<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">오른쪽 손목·아래팔 뒷면</title><desc id="desc">양계는 노쪽 코담배갑, 양곡은 자쪽 손목입니다. 열결은 아래팔 노쪽면이며, 외관·지구는 뒷면의 뼈사이 공간입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">오른쪽 손목·아래팔 뒷면</text><path class="skin" d="M215 117 Q204 165 230 209 L201 576 L419 576 L393 209 Q419 163 405 117 Z"/><path class="bone" d="M253 243 L244 555 M365 243 L380 555"/><path class="crease" d="M230 213 Q310 229 393 213"/><text class="landmark" x="242" y="99">손가락 방향 ↑</text><text class="landmark" x="260" y="607">팔꿈치 방향 ↓</text><text class="landmark" x="102" y="131">엄지 쪽 · 노쪽</text><text class="landmark" x="420" y="518">노뼈·자뼈 사이</text><a id="LI5" class="point" href="/acupuncture/points/li5/" target="_top" aria-label="양계 LI5 상세 설명"><title>양계 LI5</title><path class="callout" d="M232 215 L88 210"/><circle cx="232" cy="215" r="8"/><text x="24" y="215">LI5</text></a><a id="LU7" class="point" href="/acupuncture/points/lu7-lieque/" target="_top" aria-label="열결 LU7 상세 설명"><title>열결 LU7</title><path class="callout" d="M232 319 L88 314"/><circle cx="232" cy="319" r="8"/><text x="24" y="319">LU7</text></a><a id="TE5" class="point" href="/acupuncture/points/te5-waiguan/" target="_top" aria-label="외관 TE5 상세 설명"><title>외관 TE5</title><path class="callout" d="M314 358 L88 353"/><circle cx="314" cy="358" r="8"/><text x="24" y="358">TE5</text></a><a id="TE6" class="point" href="/acupuncture/points/te6/" target="_top" aria-label="지구 TE6 상세 설명"><title>지구 TE6</title><path class="callout" d="M314 428 L88 423"/><circle cx="314" cy="428" r="8"/><text x="24" y="428">TE6</text></a><a id="SI5" class="point" href="/acupuncture/points/si5/" target="_top" aria-label="양곡 SI5 상세 설명"><title>양곡 SI5</title><path class="callout" d="M390 217 L501 212"/><circle cx="390" cy="217" r="8"/><text x="508" y="217">SI5</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>