<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">가슴 정중선 · 임맥</title><desc id="desc">선기는 목아래패임 아래 1 B-cun, 화개·자궁·옥당은 제1·2·3갈비사이 높이입니다. 중정은 칼몸통결합 자체를 기준으로 확인하며 개인의 갈비 높이와 구분합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">가슴 정중선 · 임맥</text><path class="skin" d="M285 97 L355 97 L369 123 L473 159 L463 535 Q320 592 177 535 L166 159 L271 123 Z"/><path class="guide" d="M320 128 L320 555"/><path class="bone" d="M186 153 Q253 187 320 160 Q387 187 455 153"/><path class="bone" d="M322 170 Q389 162 455 186"/><text class="landmark" x="109" y="189">1갈비사이</text><path class="bone" d="M322 217 Q389 209 455 233"/><text class="landmark" x="109" y="236">2갈비사이</text><path class="bone" d="M322 264 Q389 256 455 280"/><text class="landmark" x="109" y="283">3갈비사이</text><path class="bone" d="M322 311 Q389 303 455 327"/><text class="landmark" x="109" y="330">4갈비사이</text><path class="bone" d="M322 358 Q389 350 455 374"/><text class="landmark" x="109" y="377">5갈비사이</text><path class="bone" d="M322 405 Q389 397 455 421"/><text class="landmark" x="109" y="424">6갈비사이</text><path class="bone" d="M322 452 Q389 444 455 468"/><text class="landmark" x="109" y="471">7갈비사이</text><circle class="joint" cx="320" cy="420" r="10"/><a id="CV21" class="point" href="/acupuncture/points/cv21/" target="_top" aria-label="선기 CV21 상세 설명"><title>선기 CV21 · 앞가슴부위, 앞정중선(anterior median line) 위, 목아래패임(suprasternal fossa)에서 아래쪽으로 1寸.</title><path class="callout" d="M320 153 L512 148"/><circle cx="320" cy="153" r="7"/><text x="520" y="153">CV21</text></a><a id="CV20" class="point" href="/acupuncture/points/cv20/" target="_top" aria-label="화개 CV20 상세 설명"><title>화개 CV20 · 앞가슴부위, 앞정중선(anterior median line) 위, 첫째 갈비사이공간(the 1st intercostal space)과 같은 높이.</title><path class="callout" d="M320 185 L512 187"/><circle cx="320" cy="185" r="7"/><text x="520" y="192">CV20</text></a><a id="CV19" class="point" href="/acupuncture/points/cv19/" target="_top" aria-label="자궁 CV19 상세 설명"><title>자궁 CV19 · 앞가슴부위, 앞정중선(anterior median line) 위, 둘째 갈비사이공간(the 2nd intercostal space)과 같은 높이.</title><path class="callout" d="M320 232 L512 227"/><circle cx="320" cy="232" r="7"/><text x="520" y="232">CV19</text></a><a id="CV18" class="point" href="/acupuncture/points/cv18/" target="_top" aria-label="옥당 CV18 상세 설명"><title>옥당 CV18 · 앞가슴부위, 앞정중선(anterior median line) 위, 셋째 갈비사이공간(the 3rd intercostal space)과 같은 높이.</title><path class="callout" d="M320 279 L512 274"/><circle cx="320" cy="279" r="7"/><text x="520" y="279">CV18</text></a><a id="CV16" class="point" href="/acupuncture/points/cv16/" target="_top" aria-label="중정 CV16 상세 설명"><title>중정 CV16 · 앞가슴부위, 앞정중선(anterior median line) 위, 칼몸통결합(xiphisternal junction)의 중점.</title><path class="callout" d="M320 420 L512 415"/><circle cx="320" cy="420" r="7"/><text x="520" y="420">CV16</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>