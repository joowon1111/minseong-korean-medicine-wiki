<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">가슴·배 앞면</title><desc id="desc">전중은 제4갈비사이 높이의 정중선, 중완은 배꼽 위 4 B-cun, 기해·관원은 아래 1.5·3 B-cun, 천추는 옆 2 B-cun입니다. 천추는 한쪽만 표시했습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">가슴·배 앞면</text><path class="skin" d="M278 95 L360 95 L366 130 L448 163 L425 289 L410 426 L437 560 L200 560 L227 425 L212 289 L189 163 L273 130 Z"/><path class="guide" d="M319 129 L319 551"/><circle class="joint" cx="319" cy="385" r="8"/><path class="guide" d="M235 205 L403 205"/><text class="landmark" x="445" y="210">제4갈비사이</text><text class="landmark" x="439" y="390">배꼽</text><path class="guide" d="M319 385 L437 385"/><a id="CV17" class="point" href="/acupuncture/points/cv17-danzhong/" target="_top" aria-label="전중 CV17 상세 설명"><title>전중 CV17</title><path class="callout" d="M319 205 L501 200"/><circle cx="319" cy="205" r="8"/><text x="508" y="205">CV17</text></a><a id="CV12" class="point" href="/acupuncture/points/cv12-zhongwan/" target="_top" aria-label="중완(中脘) CV12 상세 설명"><title>중완(中脘) CV12</title><path class="callout" d="M319 297 L501 292"/><circle cx="319" cy="297" r="8"/><text x="508" y="297">CV12</text></a><a id="ST25" class="point" href="/acupuncture/points/st25-tianshu/" target="_top" aria-label="천추 ST25 상세 설명"><title>천추 ST25</title><path class="callout" d="M371 385 L501 380"/><circle cx="371" cy="385" r="8"/><text x="508" y="385">ST25</text></a><a id="CV6" class="point" href="/acupuncture/points/cv6-qihai/" target="_top" aria-label="기해 CV6 상세 설명"><title>기해 CV6</title><path class="callout" d="M319 427 L501 422"/><circle cx="319" cy="427" r="8"/><text x="508" y="427">CV6</text></a><a id="CV4" class="point" href="/acupuncture/points/cv4-guanyuan/" target="_top" aria-label="관원(關元) CV4 상세 설명"><title>관원(關元) CV4</title><path class="callout" d="M319 469 L501 464"/><circle cx="319" cy="469" r="8"/><text x="508" y="469">CV4</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>