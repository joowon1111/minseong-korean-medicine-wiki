<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">손목 뒷면·자쪽 확대</title><desc id="desc">손가락 방향이 위입니다. 양지는 손목주름의 손가락폄근힘줄 자쪽, 양로는 자뼈머리 노쪽의 오목한 곳, 완골은 다섯째 손허리뼈바닥과 세모뼈 사이입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">손목 뒷면·자쪽 확대</text><path class="skin" d="M215 117 Q204 165 230 209 L201 576 L419 576 L393 209 Q419 163 405 117 Z"/><path class="bone" d="M253 243 L244 555 M365 243 L380 555"/><path class="crease" d="M230 213 Q310 229 393 213"/><text class="landmark" x="242" y="99">손가락 방향 ↑</text><text class="landmark" x="260" y="607">팔꿈치 방향 ↓</text><text class="landmark" x="102" y="131">엄지 쪽 · 노쪽</text><text class="landmark" x="420" y="518">노뼈·자뼈 사이</text><circle class="joint" cx="382" cy="251" r="15"/><text class="landmark" x="424" y="276">자뼈머리</text><a id="SI4" class="point" href="/acupuncture/points/si4/" target="_top" aria-label="완골 SI4 상세 설명"><title>완골 SI4 · 손목 뒤 안쪽면, 다섯째 손허리뼈바닥(base of the 5th metacarpal bone)과 세모뼈(triquetrum bone) 사이의 오목한 곳, 赤白肉際.</title><path class="callout" d="M390 168 L512 163"/><circle cx="390" cy="168" r="7"/><text x="520" y="168">SI4</text></a><a id="TE4" class="point" href="/acupuncture/points/te4/" target="_top" aria-label="양지 TE4 상세 설명"><title>양지 TE4 · 손목 뒤쪽면, 손등 쪽 손목주름(dorsal wrist crease) 위, 손가락폄근힘줄(extensor digitorum tendon) 자쪽 오목한 곳. ※주 : 陽谿(LI5), 陽谷(SI5)과 같은 높이에 위치한다.</title><path class="callout" d="M334 218 L512 213"/><circle cx="334" cy="218" r="7"/><text x="520" y="218">TE4</text></a><a id="SI6" class="point" href="/acupuncture/points/si6-yanglao/" target="_top" aria-label="양로 SI6 상세 설명"><title>양로 SI6 · 아래팔 뒤 안쪽면, 자뼈머리(head of the ulna)의 노쪽, 손등 쪽 손목주름(dorsal wrist crease)에서 몸 쪽으로 1寸 지점의 오목한 곳.</title><path class="callout" d="M366 278 L512 273"/><circle cx="366" cy="278" r="7"/><text x="520" y="278">SI6</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>