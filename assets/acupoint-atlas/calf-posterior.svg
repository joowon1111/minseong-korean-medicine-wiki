<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">오금·종아리 뒷면</title><desc id="desc">부극·위양은 넙다리두갈래근힘줄 안쪽의 오금 위 1 B-cun·오금 높이입니다. 합양·승근·승산은 위중 아래 2·5·8 B-cun, 비양은 승산 아래가쪽 1, 부양은 곤륜 위 3 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">오금·종아리 뒷면</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z"/><path class="crease" d="M236 228 Q311 246 401 229"/><path class="tendon" d="M257 135 L256 228 M374 135 L374 228"/><text class="landmark" x="103" y="110">안쪽</text><text class="landmark" x="437" y="110">가쪽</text><text class="landmark" x="422" y="242">오금주름</text><text class="landmark" x="268" y="610">종아리 방향 ↓</text><path class="tendon" d="M263 278 Q255 380 316 403 Q384 380 376 278"/><path class="tendon" d="M316 403 L329 568"/><circle class="joint" cx="362" cy="568" r="12"/><a id="BL38" class="point" href="/acupuncture/points/bl38/" target="_top" aria-label="부극 BL38 상세 설명"><title>부극 BL38 · 무릎 뒤쪽면, 넙다리두갈래근힘줄(biceps femoris tendon)의 안쪽모서리 바로 안쪽, 오금주름(popliteal crease)에서 위쪽으로 1寸.</title><path class="callout" d="M374 215 L512 210"/><circle cx="374" cy="215" r="7"/><text x="520" y="215">BL38</text></a><a id="BL39" class="point" href="/acupuncture/points/bl39/" target="_top" aria-label="위양 BL39 상세 설명"><title>위양 BL39 · 무릎 뒤가쪽면, 오금주름(popliteal crease) 위에 있으며, 무릎을 살짝 굽혔을 때 현저하게 드러나는 넙다리두갈래근힘줄(biceps femoris tendon)의 안쪽모서리 바로 안쪽에서 취혈함.</title><path class="callout" d="M374 236 L512 249"/><circle cx="374" cy="236" r="7"/><text x="520" y="254">BL39</text></a><a id="BL55" class="point" href="/acupuncture/points/bl55/" target="_top" aria-label="합양 BL55 상세 설명"><title>합양 BL55 · 종아리 뒤쪽면, 장딴지근(gastrocnemius muscle) 가쪽갈래와 안쪽갈래의 사이에 위치하며, 오금주름(popliteal crease)에서 먼 쪽으로 2寸에 위치함.</title><path class="callout" d="M318 277 L512 288"/><circle cx="318" cy="277" r="7"/><text x="520" y="293">BL55</text></a><a id="BL56" class="point" href="/acupuncture/points/bl56/" target="_top" aria-label="승근 BL56 상세 설명"><title>승근 BL56 · 종아리 뒤쪽면, 장딴지근(gastrocnemius muscle) 가쪽갈래와 안쪽갈래의 사이에 위치하며, 오금주름(popliteal crease)에서 먼 쪽으로 5寸에 위치함.</title><path class="callout" d="M318 340 L512 335"/><circle cx="318" cy="340" r="7"/><text x="520" y="340">BL56</text></a><a id="BL57" class="point" href="/acupuncture/points/bl57-chengshan/" target="_top" aria-label="승산 BL57 상세 설명"><title>승산 BL57 · 종아리 뒤쪽면, 장딴지근(gastrocnemius muscle)의 두 힘살들과 종아리 뒤쪽면, 장딴지근(gastrocnemius muscle) 가쪽갈래와 안쪽갈래 두 힘살들과 발꿈치힘줄(calcaneal tendon)이 연결되는 오목한 곳에 위치하며, 오금주름(popliteal crease)의 委中(BL40)과 발꿈치힘줄의 중점을 연결하는 선을 16촌으로 하여, 위중에서 먼 쪽으로 8寸 부위에 위치함.</title><path class="callout" d="M316 403 L512 398"/><circle cx="316" cy="403" r="7"/><text x="520" y="403">BL57</text></a><a id="BL58" class="point" href="/acupuncture/points/bl58/" target="_top" aria-label="비양 BL58 상세 설명"><title>비양 BL58 · 종아리 뒤가쪽면, 장딴지근(gastrocnemius m.) 가쪽갈래의 아래모서리와 발꿈치힘줄(calcaneal tendon)의 사이로서, 承山(BL57)에서 가먼쪽 1寸 부위에 해당됨.</title><path class="callout" d="M346 424 L512 437"/><circle cx="346" cy="424" r="7"/><text x="520" y="442">BL58</text></a><a id="BL59" class="point" href="/acupuncture/points/bl59/" target="_top" aria-label="부양 BL59 상세 설명"><title>부양 BL59 · 종아리 뒤가쪽면, 종아리뼈(fibula)와 발꿈치힘줄(calcaneal tendon)의 사이에 있으며, 오금주름 가쪽 끝과 곤륜 사이를 16촌으로 정할 때, 崑崙(BL60)에서 몸 쪽으로 3寸 부위에 취혈한다.</title><path class="callout" d="M355 506 L512 501"/><circle cx="355" cy="506" r="7"/><text x="520" y="506">BL59</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>