<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">어깨뼈·허리 뒷면</title><desc id="desc">천종은 어깨뼈가시 중점과 아래각을 잇는 선의 위쪽 1/3, 신수·대장수는 L2·L4 가시돌기 아래 높이에서 정중선 옆 1.5 B-cun입니다. 짝혈은 한쪽만 표시했습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">어깨뼈·허리 뒷면</text><path class="skin" d="M278 95 L360 95 L366 130 L448 163 L425 289 L410 426 L437 560 L200 560 L227 425 L212 289 L189 163 L273 130 Z"/><path class="guide" d="M319 132 L319 550"/><path class="joint" d="M360 173 L415 211 L359 292 Z"/><path class="bone" d="M360 203 L400 217"/><path class="guide" d="M280 422 L352 422 M280 476 L352 476"/><text class="landmark" x="247" y="426">L2</text><text class="landmark" x="247" y="480">L4</text><text class="landmark" x="435" y="230">어깨뼈</text><a id="SI11" class="point" href="/acupuncture/points/si11-tianzong/" target="_top" aria-label="천종 SI11 상세 설명"><title>천종 SI11</title><path class="callout" d="M377 237 L501 232"/><circle cx="377" cy="237" r="8"/><text x="508" y="237">SI11</text></a><a id="BL23" class="point" href="/acupuncture/points/bl23-shenshu/" target="_top" aria-label="신수 BL23 상세 설명"><title>신수 BL23</title><path class="callout" d="M365 422 L501 417"/><circle cx="365" cy="422" r="8"/><text x="508" y="422">BL23</text></a><a id="BL25" class="point" href="/acupuncture/points/bl25-dachangshu/" target="_top" aria-label="대장수 BL25 상세 설명"><title>대장수 BL25</title><path class="callout" d="M365 476 L501 471"/><circle cx="365" cy="476" r="8"/><text x="508" y="476">BL25</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>