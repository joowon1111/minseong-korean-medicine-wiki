<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">배 정중선 · 임맥</title><desc id="desc">신궐은 배꼽, 수분·하완·건리는 위 1·2·3 B-cun, 상완·거궐은 위 5·6 B-cun입니다. 구미는 칼몸통결합 아래 1 B-cun입니다. 아래쪽 음교·석문·중극·곡골은 배꼽 아래 1·2·4·5 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">배 정중선 · 임맥</text><path class="skin" d="M205 110 Q320 137 435 110 L460 214 L441 355 L472 517 Q320 571 188 517 L199 355 L180 214 Z"/><path class="guide" d="M320 126 L320 505"/><path class="bone" d="M214 159 L320 126 L426 159"/><circle class="joint" cx="320" cy="350" r="8"/><path class="guide" d="M218 350 L422 350"/><path class="bone" d="M275 490 L365 490"/><text class="landmark" x="160" y="90">칼몸통결합 · 배꼽 위 8 B-cun</text><text class="landmark" x="436" y="354">배꼽</text><text class="landmark" x="174" y="594">두덩결합 위 · 배꼽 아래 5 B-cun</text><a id="CV15" class="point" href="/acupuncture/points/cv15/" target="_top" aria-label="구미 CV15 상세 설명"><title>구미 CV15 · 윗배, 앞정중선(anterior median line) 위, 칼몸통결합(xiphisternal junction)에서 아래쪽으로 1寸.</title><path class="callout" d="M320 154 L88 149"/><circle cx="320" cy="154" r="7"/><text x="24" y="154">CV15</text></a><a id="CV13" class="point" href="/acupuncture/points/cv13/" target="_top" aria-label="상완 CV13 상세 설명"><title>상완 CV13 · 윗배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 위쪽으로 5寸.</title><path class="callout" d="M320 210 L88 205"/><circle cx="320" cy="210" r="7"/><text x="24" y="210">CV13</text></a><a id="CV10" class="point" href="/acupuncture/points/cv10/" target="_top" aria-label="하완 CV10 상세 설명"><title>하완 CV10 · 윗배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 위쪽으로 2寸.</title><path class="callout" d="M320 294 L88 289"/><circle cx="320" cy="294" r="7"/><text x="24" y="294">CV10</text></a><a id="CV8" class="point" href="/acupuncture/points/cv8/" target="_top" aria-label="신궐 CV8 상세 설명"><title>신궐 CV8 · 윗배, 배꼽(umbilicus)의 중심.</title><path class="callout" d="M320 350 L88 345"/><circle cx="320" cy="350" r="7"/><text x="24" y="350">CV8</text></a><a id="CV5" class="point" href="/acupuncture/points/cv5/" target="_top" aria-label="석문 CV5 상세 설명"><title>석문 CV5 · 아랫배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 아래쪽으로 2寸.</title><path class="callout" d="M320 406 L88 401"/><circle cx="320" cy="406" r="7"/><text x="24" y="406">CV5</text></a><a id="CV2" class="point" href="/acupuncture/points/cv2/" target="_top" aria-label="곡골 CV2 상세 설명"><title>곡골 CV2 · 아랫배, 앞정중선(anterior median line)위, 두덩결합(pubic symphysis) 위모서리.</title><path class="callout" d="M320 490 L88 485"/><circle cx="320" cy="490" r="7"/><text x="24" y="490">CV2</text></a><a id="CV14" class="point" href="/acupuncture/points/cv14/" target="_top" aria-label="거궐 CV14 상세 설명"><title>거궐 CV14 · 윗배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 위쪽으로 6寸.</title><path class="callout" d="M320 182 L512 177"/><circle cx="320" cy="182" r="7"/><text x="520" y="182">CV14</text></a><a id="CV11" class="point" href="/acupuncture/points/cv11/" target="_top" aria-label="건리 CV11 상세 설명"><title>건리 CV11 · 윗배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 위쪽으로 3寸.</title><path class="callout" d="M320 266 L512 261"/><circle cx="320" cy="266" r="7"/><text x="520" y="266">CV11</text></a><a id="CV9" class="point" href="/acupuncture/points/cv9/" target="_top" aria-label="수분 CV9 상세 설명"><title>수분 CV9 · 윗배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 위쪽으로 1寸.</title><path class="callout" d="M320 322 L512 317"/><circle cx="320" cy="322" r="7"/><text x="520" y="322">CV9</text></a><a id="CV7" class="point" href="/acupuncture/points/cv7/" target="_top" aria-label="음교 CV7 상세 설명"><title>음교 CV7 · 아랫배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 아래쪽으로 1寸.</title><path class="callout" d="M320 378 L512 373"/><circle cx="320" cy="378" r="7"/><text x="520" y="378">CV7</text></a><a id="CV3" class="point" href="/acupuncture/points/cv3/" target="_top" aria-label="중극 CV3 상세 설명"><title>중극 CV3 · 아랫배, 앞정중선(anterior median line) 위, 배꼽(umbilicus) 중심에서 아래쪽으로 4寸.</title><path class="callout" d="M320 462 L512 457"/><circle cx="320" cy="462" r="7"/><text x="520" y="462">CV3</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>