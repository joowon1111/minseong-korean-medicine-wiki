<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">배 · 신경의 정중선 가까운 선</title><desc id="desc">정중선 옆 0.5 B-cun입니다. 횡골–황수는 배꼽 아래 5 B-cun부터 배꼽 높이까지, 상곡–유문은 배꼽 위 2–6 B-cun입니다. 황수와 상곡 사이에는 2 B-cun 간격이 있습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">배 · 신경의 정중선 가까운 선</text><path class="skin" d="M205 110 Q320 137 435 110 L460 214 L441 355 L472 517 Q320 571 188 517 L199 355 L180 214 Z"/><path class="guide" d="M320 126 L320 505"/><path class="bone" d="M214 159 L320 126 L426 159"/><circle class="joint" cx="320" cy="350" r="8"/><path class="guide" d="M218 350 L422 350"/><path class="bone" d="M275 490 L365 490"/><text class="landmark" x="160" y="90">칼몸통결합 · 배꼽 위 8 B-cun</text><text class="landmark" x="436" y="354">배꼽</text><text class="landmark" x="174" y="594">두덩결합 위 · 배꼽 아래 5 B-cun</text><a id="KI21" class="point" href="/acupuncture/points/ki21/" target="_top" aria-label="유문 KI21 상세 설명"><title>유문 KI21 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 6寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 182 L88 177"/><circle cx="332.0" cy="182" r="7"/><text x="24" y="182">KI21</text></a><a id="KI19" class="point" href="/acupuncture/points/ki19/" target="_top" aria-label="음도 KI19 상세 설명"><title>음도 KI19 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 4寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 238 L88 233"/><circle cx="332.0" cy="238" r="7"/><text x="24" y="238">KI19</text></a><a id="KI17" class="point" href="/acupuncture/points/ki17/" target="_top" aria-label="상곡 KI17 상세 설명"><title>상곡 KI17 · 윗배, 배꼽(umbilicus)의 중심에서 위로 2寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 294 L88 289"/><circle cx="332.0" cy="294" r="7"/><text x="24" y="294">KI17</text></a><a id="KI15" class="point" href="/acupuncture/points/ki15/" target="_top" aria-label="중주 KI15 상세 설명"><title>중주 KI15 · 아랫배, 배꼽(umbilicus) 중심에서 아래 쪽으로 1寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 378 L88 373"/><circle cx="332.0" cy="378" r="7"/><text x="24" y="378">KI15</text></a><a id="KI13" class="point" href="/acupuncture/points/ki13/" target="_top" aria-label="기혈 KI13 상세 설명"><title>기혈 KI13 · 아랫배, 배꼽(umbilicus) 중심에서 아래 쪽으로 3寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 434 L88 429"/><circle cx="332.0" cy="434" r="7"/><text x="24" y="434">KI13</text></a><a id="KI11" class="point" href="/acupuncture/points/ki11/" target="_top" aria-label="횡골 KI11 상세 설명"><title>횡골 KI11 · 아랫배, 배꼽(umbilicus) 중심에서 아래 쪽으로 5寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 490 L88 485"/><circle cx="332.0" cy="490" r="7"/><text x="24" y="490">KI11</text></a><a id="KI20" class="point" href="/acupuncture/points/ki20/" target="_top" aria-label="복통곡 KI20 상세 설명"><title>복통곡 KI20 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 5寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 210 L512 205"/><circle cx="332.0" cy="210" r="7"/><text x="520" y="210">KI20</text></a><a id="KI18" class="point" href="/acupuncture/points/ki18/" target="_top" aria-label="석관 KI18 상세 설명"><title>석관 KI18 · 윗배, 배꼽(umbilicus)의 중심에서 위쪽으로 3寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 266 L512 261"/><circle cx="332.0" cy="266" r="7"/><text x="520" y="266">KI18</text></a><a id="KI16" class="point" href="/acupuncture/points/ki16/" target="_top" aria-label="황수 KI16 상세 설명"><title>황수 KI16 · 윗배, 배꼽(umbilicus)의 중심에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 350 L512 345"/><circle cx="332.0" cy="350" r="7"/><text x="520" y="350">KI16</text></a><a id="KI14" class="point" href="/acupuncture/points/ki14/" target="_top" aria-label="사만 KI14 상세 설명"><title>사만 KI14 · 아랫배, 배꼽(umbilicus) 중심에서 아래 쪽으로 2寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 406 L512 401"/><circle cx="332.0" cy="406" r="7"/><text x="520" y="406">KI14</text></a><a id="KI12" class="point" href="/acupuncture/points/ki12/" target="_top" aria-label="대혁 KI12 상세 설명"><title>대혁 KI12 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 4寸, 앞정중선(anterior median line)에서 가쪽으로 0.5寸.</title><path class="callout" d="M332.0 462 L512 457"/><circle cx="332.0" cy="462" r="7"/><text x="520" y="462">KI12</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>