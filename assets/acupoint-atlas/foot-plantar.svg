<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">발바닥</title><desc id="desc">용천은 발가락을 굽힐 때 발바닥 앞부분에서 오목해지는 곳입니다. 발가락 자체가 아닌 발바닥 위치입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">발바닥</text><g transform="translate(610 0) scale(-1 1)"><path class="skin" d="M290 573 Q267 506 230 392 Q206 325 180 217 Q166 161 182 131 Q198 106 219 127 L232 166 Q226 110 247 106 Q269 105 274 161 Q274 115 294 119 Q314 126 314 175 Q319 142 338 150 Q357 159 351 197 Q363 173 379 191 Q395 220 376 266 L388 348 Q394 421 370 503 L370 573 Z"/></g><text class="landmark" x="114" y="80">발가락 방향 ↑</text><text class="landmark" x="275" y="598">뒤꿈치</text><path class="crease" d="M270 245 Q315 218 356 255"/><a id="KI1" class="point" href="/acupuncture/points/ki1-yongquan/" target="_top" aria-label="용천 KI1 상세 설명"><title>용천 KI1</title><path class="callout" d="M318 302 L501 297"/><circle cx="318" cy="302" r="8"/><text x="508" y="302">KI1</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>