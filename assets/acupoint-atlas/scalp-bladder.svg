<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">머리 표면 · 방광경</title><desc id="desc">곡차–낙각은 정중선 옆 1.5 B-cun에서 앞머리카락경계 위 0.5·1·2.5·4·5.5 B-cun입니다. 미충은 이마패임 수직선의 위 0.5 B-cun입니다. 높이는 머리 표면을 따라 잽니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">머리 표면 · 방광경</text><path class="skin" d="M190 130 Q320 83 450 130 L450 537 Q320 592 190 537 Z"/><path class="guide" d="M320 125 L320 550"/><path class="crease" d="M190 150 L450 150 M190 525 L450 525"/><text class="landmark" x="215" y="104">머리 표면을 펼친 위치도</text><text class="landmark" x="232" y="139">앞머리카락 경계</text><text class="landmark" x="232" y="574">뒷머리카락 경계</text><text class="landmark" x="214" y="604">위→아래: 앞이마→뒤통수</text><path class="guide" d="M365 150 L365 525"/><text class="landmark" x="369" y="593">정중선 옆 1.5 B-cun</text><a id="BL3" class="point" href="/acupuncture/points/bl3/" target="_top" aria-label="미충 BL3 상세 설명"><title>미충 BL3 · 머리, 이마뼈패임(frontal notch)의 위 쪽, 前髮際(anterior hairline)에서 위 쪽으로 0.5寸.</title><path class="callout" d="M340 165.6 L512 160.6"/><circle cx="340" cy="165.6" r="7"/><text x="520" y="165.6">BL3</text></a><a id="BL4" class="point" href="/acupuncture/points/bl4/" target="_top" aria-label="곡차 BL4 상세 설명"><title>곡차 BL4 · 머리, 前髮際(anterior hairline)에서 위쪽으로 0.5寸, 앞정중선(anterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M365 165.6 L512 199.6"/><circle cx="365" cy="165.6" r="7"/><text x="520" y="204.6">BL4</text></a><a id="BL5" class="point" href="/acupuncture/points/bl5/" target="_top" aria-label="오처 BL5 상세 설명"><title>오처 BL5 · 머리, 前髮際(anterior hairline)에서 위쪽으로 1寸, 앞정중선(anterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M365 181.2 L512 238.6"/><circle cx="365" cy="181.2" r="7"/><text x="520" y="243.6">BL5</text></a><a id="BL6" class="point" href="/acupuncture/points/bl6/" target="_top" aria-label="승광 BL6 상세 설명"><title>승광 BL6 · 머리, 前髮際(anterior hairline)에서 위로 2.5寸, 앞정중선(anterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M365 228.1 L512 277.6"/><circle cx="365" cy="228.1" r="7"/><text x="520" y="282.6">BL6</text></a><a id="BL7" class="point" href="/acupuncture/points/bl7/" target="_top" aria-label="통천 BL7 상세 설명"><title>통천 BL7 · 머리, 前髮際(anterior hairline)에서 위쪽으로 4寸, 앞정중선(anterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M365 275.0 L512 316.6"/><circle cx="365" cy="275.0" r="7"/><text x="520" y="321.6">BL7</text></a><a id="BL8" class="point" href="/acupuncture/points/bl8/" target="_top" aria-label="낙각 BL8 상세 설명"><title>낙각 BL8 · 머리, 前髮際(anterior hairline)에서 위쪽으로 5.5寸, 앞정중선(anterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M365 321.9 L512 355.6"/><circle cx="365" cy="321.9" r="7"/><text x="520" y="360.6">BL8</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>