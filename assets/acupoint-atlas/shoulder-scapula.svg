<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">어깨뼈·뒤겨드랑주름</title><desc id="desc">노수는 뒤겨드랑주름 수직 위 어깨뼈가시 아래, 견정 SI9는 주름 위 1 B-cun입니다. 병풍·곡원은 가시 위, 견외수·견중수는 T1 옆 3·C7 옆 2 B-cun, 천료는 어깨뼈 위각 위입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">어깨뼈·뒤겨드랑주름</text><path class="skin" d="M241 104 L352 104 L382 153 L466 190 L470 560 L172 560 L180 190 L221 151 Z"/><path class="guide" d="M271 133 L271 536"/><path class="joint" d="M311 226 L425 231 L326 444 Z"/><path class="bone" d="M311 252 L439 255"/><path class="crease" d="M385 345 L458 345"/><path class="guide" d="M244 171 L293 171 M244 208 L293 208"/><text class="landmark" x="198" y="175">C7</text><text class="landmark" x="200" y="212">T1</text><text class="landmark" x="367" y="475">어깨뼈 아래각</text><a id="SI13" class="point" href="/acupuncture/points/si13/" target="_top" aria-label="곡원 SI13 상세 설명"><title>곡원 SI13 · 어깨뼈부위, 어깨뼈가시(spine of the scapula) 안쪽끝 위쪽 오목한 곳.</title><path class="callout" d="M314 234 L88 229"/><circle cx="314" cy="234" r="7"/><text x="24" y="234">SI13</text></a><a id="SI15" class="point" href="/acupuncture/points/si15/" target="_top" aria-label="견중수 SI15 상세 설명"><title>견중수 SI15 · 위쪽 등부위, 일곱째 목뼈 가시돌기(spinous process of the 7th cervical vertebra) 아래 모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M330 171 L512 166"/><circle cx="330" cy="171" r="7"/><text x="520" y="171">SI15</text></a><a id="TE15" class="point" href="/acupuncture/points/te15/" target="_top" aria-label="천료 TE15 상세 설명"><title>천료 TE15 · 어깨뼈부위, 어깨뼈 위각(superior angle of the scapula)에서 위쪽 오목한 곳.</title><path class="callout" d="M322 202 L512 205"/><circle cx="322" cy="202" r="7"/><text x="520" y="210">TE15</text></a><a id="SI14" class="point" href="/acupuncture/points/si14/" target="_top" aria-label="견외수 SI14 상세 설명"><title>견외수 SI14 · 위쪽 등부위, 첫째 등뼈 가시돌기(spinous process of the 1st thoracic vertebra) 아래 모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M359 208 L512 244"/><circle cx="359" cy="208" r="7"/><text x="520" y="249">SI14</text></a><a id="SI12" class="point" href="/acupuncture/points/si12/" target="_top" aria-label="병풍 SI12 상세 설명"><title>병풍 SI12 · 어깨뼈부위, 가시위오목(supraspinatus fossa), 어깨뼈가시(spine of the scapula) 중점 위쪽의 오목한 곳.</title><path class="callout" d="M369 240 L512 283"/><circle cx="369" cy="240" r="7"/><text x="520" y="288">SI12</text></a><a id="SI10" class="point" href="/acupuncture/points/si10/" target="_top" aria-label="노수 SI10 상세 설명"><title>노수 SI10 · 팔이음뼈(shoulder girdle), 겨드랑주름(axillary fold) 뒤쪽끝에서 위쪽, 어깨뼈가시(spine of the scapula) 아래쪽 오목한 곳.</title><path class="callout" d="M423 280 L512 322"/><circle cx="423" cy="280" r="7"/><text x="520" y="327">SI10</text></a><a id="SI9" class="point" href="/acupuncture/points/si9/" target="_top" aria-label="견정 SI9 상세 설명"><title>견정 SI9 · 팔이음뼈(shoulder girdle), 어깨관절(shoulder joint) 아래뒤쪽, 겨드랑주름(axillary fold) 뒤쪽끝에서 위쪽으로 1寸.</title><path class="callout" d="M423 319 L512 361"/><circle cx="423" cy="319" r="7"/><text x="520" y="366">SI9</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>