<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">넓적다리 앞면·안쪽</title><desc id="desc">복토·음시·양구는 무릎뼈바닥 위 6·3·2 B-cun입니다. 음포는 위 4 B-cun의 안쪽 두 근육 사이, 음렴·족오리는 기충 아래 2·3 B-cun입니다. 충문은 샅고랑의 넙다리동맥 가쪽입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">넓적다리 앞면·안쪽</text><path class="skin" d="M230 120 Q315 88 410 120 L405 311 Q394 452 380 559 L246 559 Q223 441 216 306 Z"/><path class="crease" d="M234 152 L397 205"/><path class="tendon" d="M391 150 L255 511"/><ellipse class="joint" cx="324" cy="555" rx="38" ry="27"/><text class="landmark" x="246" y="98">샅고랑주름</text><text class="landmark" x="270" y="606">무릎뼈 바닥</text><text class="landmark" x="107" y="116">안쪽</text><text class="landmark" x="439" y="116">가쪽</text><a id="SP12" class="point" href="/acupuncture/points/sp12/" target="_top" aria-label="충문 SP12 상세 설명"><title>충문 SP12 · 샅부위(groin region), 샅고랑 주름(inguinal crease) 위, 넙다리동맥(femoral artery)의 가쪽.</title><path class="callout" d="M298 172 L88 167"/><circle cx="298" cy="172" r="7"/><text x="24" y="172">SP12</text></a><a id="LR11" class="point" href="/acupuncture/points/lr11/" target="_top" aria-label="음렴 LR11 상세 설명"><title>음렴 LR11 · 넓적다리 안쪽면, 氣衝(ST30)에서 먼쪽으로 2寸.</title><path class="callout" d="M310 237 L88 232"/><circle cx="310" cy="237" r="7"/><text x="24" y="237">LR11</text></a><a id="LR10" class="point" href="/acupuncture/points/lr10/" target="_top" aria-label="족오리 LR10 상세 설명"><title>족오리 LR10 · 넓적다리 안쪽면, 氣衝(ST30)에서 먼쪽으로 3寸, 넙다리동맥(femoral artery)이 뛰는 곳.</title><path class="callout" d="M307 272 L88 271"/><circle cx="307" cy="272" r="7"/><text x="24" y="276">LR10</text></a><a id="SP11" class="point" href="/acupuncture/points/sp11/" target="_top" aria-label="기문 SP11 상세 설명"><title>기문 SP11 · 넓적다리 안쪽면, 무릎뼈바닥(base of the patella) 안쪽끝과 衝門(SP12)을 연결하는 선에서 위쪽으로부터 1/3과 아래쪽으로부터 2/3가 되는 지점, 긴 모음근(adductor longus muscle)과 넙다리빗근(sartorius muscle)의 사이, 넙다리동맥(femoral artery)이 뛰는 곳.</title><path class="callout" d="M272 281 L88 310"/><circle cx="272" cy="281" r="7"/><text x="24" y="315">SP11</text></a><a id="LR9" class="point" href="/acupuncture/points/lr9/" target="_top" aria-label="음포 LR9 상세 설명"><title>음포 LR9 · 넓적다리 안쪽면, 두덩정강근(gracilis muscle)과 넙다리빗근(sartorius muscle)의 사이, 무릎뼈 바닥(base of the patella)에서 몸쪽으로 4寸.</title><path class="callout" d="M253 412 L88 407"/><circle cx="253" cy="412" r="7"/><text x="24" y="412">LR9</text></a><a id="ST31" class="point" href="/acupuncture/points/st31/" target="_top" aria-label="비관 ST31 상세 설명"><title>비관 ST31 · 넓적다리 앞쪽면, 넙다리곧은근(rectus femoris muscle) 몸쪽끝, 넙다리빗근(sartorius muscle), 넙다리근막긴장근(tensor fasciae latae muscle)의 세 근육 사이의 오목한 곳.</title><path class="callout" d="M378 165 L512 160"/><circle cx="378" cy="165" r="7"/><text x="520" y="165">ST31</text></a><a id="ST32" class="point" href="/acupuncture/points/st32/" target="_top" aria-label="복토 ST32 상세 설명"><title>복토 ST32 · 넓적다리 앞가쪽면, 위앞엉덩뼈가시(anterior superior iliac spine)와 무릎뼈바닥 가쪽끝(the lateral end of the base of the patella)을 연결하는 선 위, 무릎뼈바닥에서 위쪽으로 6寸.</title><path class="callout" d="M353 342 L512 337"/><circle cx="353" cy="342" r="7"/><text x="520" y="342">ST32</text></a><a id="ST33" class="point" href="/acupuncture/points/st33/" target="_top" aria-label="음시 ST33 상세 설명"><title>음시 ST33 · 넓적다리 앞가쪽면, 넙다리곧은근힘줄(rectus femoris tendon) 가쪽, 무릎뼈바닥(base of the patella)에서 위쪽으로 3寸.</title><path class="callout" d="M350 447 L512 442"/><circle cx="350" cy="447" r="7"/><text x="520" y="447">ST33</text></a><a id="ST34" class="point" href="/acupuncture/points/st34/" target="_top" aria-label="양구 ST34 상세 설명"><title>양구 ST34 · 넓적다리 앞가쪽면, 가쪽넓은근(vastus lateralis muscle)과 넙다리곧은근힘줄(rectus femoris tendon) 가쪽모서리사이, 무릎뼈바닥(base of patellae)에서 위쪽으로 2寸.</title><path class="callout" d="M349 482 L512 481"/><circle cx="349" cy="482" r="7"/><text x="520" y="486">ST34</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>