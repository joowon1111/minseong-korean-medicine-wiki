<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">종아리 가쪽 · 양교·외구·광명</title><desc id="desc">양교·외구는 가쪽복사 위 7 B-cun에서 종아리뼈의 뒤·앞을 구분합니다. 광명은 같은 뼈의 앞쪽에서 복사 위 5 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">종아리 가쪽 · 양교·외구·광명</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z"/><path class="bone" d="M312 274 L329 552"/><circle class="joint" cx="329" cy="568" r="17"/><text class="landmark" x="92" y="111">앞쪽</text><text class="landmark" x="432" y="111">뒤쪽</text><text class="landmark" x="376" y="334">종아리뼈</text><text class="landmark" x="391" y="572">가쪽복사</text><a id="GB36" class="point" href="/acupuncture/points/gb36/" target="_top" aria-label="외구 GB36 상세 설명"><title>외구 GB36 · 종아리의 종아리뼈쪽면, 종아리뼈(fibula)앞쪽으로, 가쪽복사 융기(prominence of the lateral malleolus)에서 몸 쪽으로 7寸되는 곳임.</title><path class="callout" d="M299 425 L88 420"/><circle cx="299" cy="425" r="7"/><text x="24" y="425">GB36</text></a><a id="GB37" class="point" href="/acupuncture/points/gb37/" target="_top" aria-label="광명 GB37 상세 설명"><title>광명 GB37 · 종아리의 종아리뼈쪽면, 종아리뼈(fibula)앞쪽으로, 오금주름(popliteal crease)의 가쪽끝과 가쪽복사뼈 융기를 연결하는 선을 16촌으로 하여 가쪽복사 융기(prominence of the lataral malleolus)에서 몸쪽으로 5寸되는 곳임.</title><path class="callout" d="M302 466 L88 461"/><circle cx="302" cy="466" r="7"/><text x="24" y="466">GB37</text></a><a id="GB35" class="point" href="/acupuncture/points/gb35/" target="_top" aria-label="양교 GB35 상세 설명"><title>양교 GB35 · 종아리의 종아리뼈쪽면, 종아리뼈(fibula)뒤쪽으로, 가쪽복사 융기(prominence of the lateral malleolus)에서 몸쪽으로 7寸 높이.</title><path class="callout" d="M348 425 L512 420"/><circle cx="348" cy="425" r="7"/><text x="520" y="425">GB35</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>