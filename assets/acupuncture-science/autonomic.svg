<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 830" width="960" height="830" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">체성–자율신경 반사: 회로와 임상 연구</title><desc id="desc">일반 체성감각 입력의 중추 통합과 자율신경 출력을 보여준다. 생쥐의 특정 미주신경–부신 실험과 사람의 HRV·임상 평가를 별도로 구분한다.</desc>
<defs><marker id="arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="arrow-4465aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4465aa"/></marker></defs>
<g font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
<rect width="960" height="830" rx="18" fill="#f8fafc"/>
<text x="36" y="46" font-size="30" fill="#172d43" text-anchor="start" font-weight="700">체성–자율신경 반사: 회로와 임상 연구</text>
<text x="40" y="97" font-size="23" fill="#087f8c" text-anchor="start" font-weight="700">일반적인 기능적 연결</text><rect x="40" y="120" width="880" height="97" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="480.0" y="158" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">체성감각 입력</text><text x="480.0" y="192" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">피부 · 근육 등의 감각신경</text><rect x="40" y="265" width="880" height="97" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="480.0" y="303" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">중추 통합 → 자율신경 출력</text><text x="480.0" y="337" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">척수 · 뇌간 · 상위 중추 → 장기별 반응</text><path d="M480 217 V265" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><text x="40" y="419" font-size="23" fill="#ad7220" text-anchor="start" font-weight="700">특정 조건에서 검증한 생쥐 실험: Liu 등, 2021</text><rect x="40" y="447" width="400" height="110" rx="14" fill="#fff5e7" stroke="#ad7220" stroke-width="2"/><text x="240.0" y="485" font-size="25" fill="#ad7220" text-anchor="middle" font-weight="700">뒷다리 저강도 전침</text><text x="240.0" y="519" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">PROKR2 표지 감각뉴런</text><rect x="520" y="447" width="400" height="110" rx="14" fill="#fff5e7" stroke="#ad7220" stroke-width="2"/><text x="720.0" y="485" font-size="25" fill="#ad7220" text-anchor="middle" font-weight="700">미주신경–부신 축</text><text x="720.0" y="519" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">내독소 염증 모델의 반응</text><path d="M440 502 H520" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><text x="480" y="610" font-size="22" fill="#172d43" text-anchor="middle" font-weight="400">부위 · 강도 · 신경 분포에 따른 회로의 차이를 검증</text><rect x="40" y="653" width="880" height="104" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="480.0" y="691" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">사람의 임상 연구</text><text x="480.0" y="725" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">HRV · 혈압 등 생리 지표 + 증상 · 장기 기능을 평가</text>
<text x="36" y="802" font-size="19" fill="#526477" text-anchor="start" font-weight="400">원본 개념도 · 생쥐 회로의 인과 검증과 사람의 질환별 치료 효과는 구분합니다.</text>
</g></svg>
