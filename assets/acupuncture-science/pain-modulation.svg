<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">상행 통각 처리와 하행성 조절</title><desc id="desc">통각 입력과 침의 감각 입력이 척수 회로에서 상호작용한다. 상행 입력은 뇌로 전달되고 뇌간의 하행 경로는 척수 전달을 억제하거나 촉진한다.</desc>
<defs><marker id="arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="arrow-4465aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4465aa"/></marker></defs>
<g font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
<rect width="960" height="700" rx="18" fill="#f8fafc"/>
<text x="36" y="46" font-size="30" fill="#172d43" text-anchor="start" font-weight="700">상행 통각 처리와 하행성 조절</text>
<rect x="60" y="95" width="380" height="110" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="250.0" y="133" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">뇌의 감각·인지·정서 처리</text><text x="250.0" y="167" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">시상 · 감각피질 · 관련 네트워크</text><rect x="540" y="95" width="360" height="110" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="720.0" y="133" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">뇌간 조절 네트워크</text><text x="720.0" y="167" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">PAG · RVM · 청반 등</text><path d="M440 150 H540" fill="none" stroke="#4465aa" stroke-width="3" marker-end="url(#arrow-4465aa)"/><rect x="280" y="325" width="400" height="115" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="480.0" y="363" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">척수 후각</text><text x="480.0" y="397" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">국소 회로 · 통각 전달 조절</text><path d="M340 325 V245 H230 V205" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><text x="105" y="278" font-size="21" fill="#087f8c" text-anchor="start" font-weight="400">상행 입력</text><path d="M720 205 V385 H680" fill="none" stroke="#4465aa" stroke-width="3" marker-end="url(#arrow-4465aa)"/><text x="755" y="277" font-size="21" fill="#4465aa" text-anchor="start" font-weight="400">하행 조절</text><text x="755" y="311" font-size="21" fill="#4465aa" text-anchor="start" font-weight="400">억제 · 촉진</text><rect x="60" y="525" width="380" height="108" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="250.0" y="563" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">통각 입력</text><text x="250.0" y="597" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">조직 상태 · 유해 자극</text><rect x="520" y="525" width="380" height="108" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="710.0" y="563" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">침의 감각 입력</text><text x="710.0" y="597" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">부위 · 조직층 · 자극량</text><path d="M250 525 V480 H390 V440" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><path d="M710 525 V480 H570 V440" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/>
<text x="36" y="672" font-size="19" fill="#526477" text-anchor="start" font-weight="400">원본 개념도 · 중간 핵·시냅스를 생략한 기능적 관계입니다. 효과 크기를 뜻하지 않습니다.</text>
