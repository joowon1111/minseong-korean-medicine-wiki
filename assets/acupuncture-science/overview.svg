<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">침 자극을 연구하는 네 가지 층위</title><desc id="desc">조직 자극은 국소 반응과 감각 입력에 연결된다. 척수와 뇌의 통합은 통증조절과 자율신경 반사에 연결되며 임상효과는 별도 평가한다.</desc>
<defs><marker id="arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="arrow-4465aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4465aa"/></marker></defs>
<g font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
<rect width="960" height="760" rx="18" fill="#f8fafc"/>
<text x="36" y="46" font-size="30" fill="#172d43" text-anchor="start" font-weight="700">침 자극을 연구하는 네 가지 층위</text>
<rect x="40" y="85" width="400" height="106" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="240.0" y="123" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">조직 자극</text><text x="240.0" y="157" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">피부 · 근육 · 근막</text><rect x="520" y="85" width="400" height="106" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="720.0" y="123" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">국소 반응</text><text x="720.0" y="157" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">기계적 변형 · 생화학 신호</text><path d="M440 138 H520" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><path d="M240 191 V245" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><rect x="40" y="245" width="400" height="106" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="240.0" y="283" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">체성감각 입력</text><text x="240.0" y="317" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">말초 감각신경</text><rect x="520" y="245" width="400" height="106" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="720.0" y="283" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">척수 · 뇌의 통합</text><text x="720.0" y="317" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">통각 전달 · 감각 · 주의 · 정서</text><path d="M440 298 H520" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><rect x="40" y="415" width="400" height="106" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="240.0" y="453" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">통증조절 경로</text><text x="240.0" y="487" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">분절성 · 하행성 조절</text><rect x="520" y="415" width="400" height="106" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="720.0" y="453" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">자율신경 반사</text><text x="720.0" y="487" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">교감 · 부교감 출력</text><path d="M650 351 V383 H240 V415" fill="none" stroke="#4465aa" stroke-width="3" marker-end="url(#arrow-4465aa)"/><path d="M790 351 V415" fill="none" stroke="#4465aa" stroke-width="3" marker-end="url(#arrow-4465aa)"/><rect x="40" y="585" width="880" height="108" rx="14" fill="#fff5e7" stroke="#ad7220" stroke-width="2"/><text x="480.0" y="623" font-size="25" fill="#ad7220" text-anchor="middle" font-weight="700">임상효과는 별도로 비교·평가</text><text x="480.0" y="657" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">통증 · 기능 · 삶의 질 · 지속효과 · 이상반응</text><text x="480" y="559" font-size="21" fill="#526477" text-anchor="middle" font-weight="400">기전 관찰과 환자 결과를 연결해 연구</text>
<text x="36" y="732" font-size="19" fill="#526477" text-anchor="start" font-weight="400">원본 개념도 · 화살표는 기능적 관계이며 모든 단계의 작동이나 임상효과를 보증하지 않습니다.</text>
</g></svg>
