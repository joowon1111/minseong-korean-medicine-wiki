top" aria-label="관원(關元) CV4 상세 도해"><title>관원(關元) CV4</title><path class="callout" d="M270 435 L100 430"/><circle cx="270" cy="435" r="6"/><text x="38" y="435" font-size="16" class="">CV4</text></a><a id="CV1" class="point" href="/acupuncture/points/cv1/" target="_top" aria-label="회음 CV1 상세 도해"><title>회음 CV1</title><path class="callout" d="M270 476 L100 471"/><circle cx="270" cy="476" r="6"/><text x="38" y="476" font-size="16" class="">CV1</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/cv1/" target="_top"><text x="553" y="169" font-size="20" class="">회음 CV1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/cv24/" target="_top"><text x="553" y="239" font-size="20" class="">승장 CV24</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">몸의 앞면 정중선</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">하복부에서 배꼽·명치로</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">가슴 중앙과 목 앞을 지나</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">턱끝입술고랑 승장까지</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>