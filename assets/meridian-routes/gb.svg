<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">족소양담경 · 시작혈부터 마지막혈까지</title><desc id="desc">눈 가쪽 → 관자놀이·귀 주위·뒤통수 → 목·어깨 → 옆가슴·옆구리 → 엉덩이·다리 바깥 → 넷째발가락. 몸의 옆면을 봅니다. 머리의 굽이치는 경로는 개요이며 풍지·양릉천 등 상세 위치는 경혈 도해로 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">족소양담경 GB</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><path class="skin" d="M246 105 Q274 70 307 99 Q331 139 307 182 L299 210 L320 235 Q338 293 311 362 L313 410 Q333 440 319 477 L311 557 L305 674 L310 713 Q286 731 236 721 L235 708 L272 681 L267 565 L244 463 L244 402 L234 338 L227 262 L249 211 L251 187 L232 171 L233 154 L217 150 L234 133 Z"/><path class="landmark" d="M243 128 L253 130 M267 246 Q248 303 259 352 L270 457 M258 709 L306 709"/><ellipse class="landmark" cx="295" cy="141" rx="10" ry="17"/><text x="45" y="116" font-size="16" class="">옆면</text><path class="route" d="M248 131 L277 116 Q278 88 298 96 L312 118 L307 171 Q32