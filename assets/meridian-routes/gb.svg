target="_top"><text x="553" y="239" font-size="20" class="">족규음 GB44</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">머리 옆면에서 앞뒤로 굽이침</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">목·어깨를 지나 몸통 옆면</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">엉덩이·무릎·종아리의 바깥쪽</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">가쪽 발목 앞에서 넷째발가락</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>