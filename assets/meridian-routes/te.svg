<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">수소양삼초경 · 시작혈부터 마지막혈까지</title><desc id="desc">넷째손가락 → 손등 → 아래팔 뼈 사이 → 팔꿈치 뒤 → 어깨·목 → 귀 뒤·귀 앞 → 눈썹 가쪽. 팔 뒷면의 경로와 귀를 도는 가지를 펼친 개요입니다. 사죽공은 얼굴 쪽 눈썹 끝이므로 귀 앞면과 함께 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">수소양삼초경 TE</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><ellipse class="skin" cx="270" cy="135" rx="44" ry="57"/><path class="skin" d="M249 185 L248 210 L185 230 L209 282 L211 348 L193 427 L186 466 Q224 488 270 475 Q315 488 354 466 L347 427 L329 348 L331 282 L355 230 L292 210 L291 185 Z"/><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/></g><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/></g><path class="guide" d="M270 218 L270 449"/><path class="landmark" d="M239 244 L211 271 L245 320 Z M301 244 L329 271 L295 320 Z M200 489 Q219 500 248 489 M292 489 Q321 500 340 489"/><path class="landmark" d="M198 540 L239 540 M301 540 L342 540 M197 682 L238 682 M302 682 L343 682"/><text x="45" y="116" font-size="16" class="">뒷면</text><path class="route" d="M438 554 L419 509 L410 472 L400 440 L383 398 L369 350"/><path class="route" d="M369 350 L351 294 L347 247 L307 221 L306 198 L316 165"/><path class="route" d="M316 165 Q337 130 315 108 Q293 114 310 143 L304 125"/><a id="TE23" class="point end" href="/acupuncture/points/te23/" target="_top" aria-label="사죽공 TE23 상세 도해"><title>사죽공 TE23</title><path class="callout" d="M304 125 L412 120"/><circle cx="304" cy="125" r="6"/><text x="422" y="125" font-size="16" class="">TE23</text></a><a id="TE17" class="point" href="/acupuncture/points/te17-yifeng/" target="_top" aria-label="예풍 TE17 상세 도해"><title>예풍 TE17</title><path class="callout" d="M316 165 L412 160"/><circle cx="316" cy="165" r="6"/><text x="422" y="165" font-size="16" class="">TE17</text></a><a id="TE10" class="point" href="/acupuncture/points/te10/" target="_top" aria-label="천정 TE10 상세 도해"><title>천정 TE10</title><path class="callout" d="M369 350 L412 345"/><circle cx="369" cy="350" r="6"/><text x="422" y="350" font-size="16" class="">TE10</text></a><a id="TE5" class="point" href="/acupuncture/points/te5-waiguan/" target="_top" aria-label="외관 TE5 상세 도해"><title>외관 TE5</title><path class="callout" d="M400 440 L412 435"/><circle cx="400" cy="440" r="6"/><text x="422" y="440" font-size="16" class="">TE5</text></a><a id="TE1" class="point" href="/acupuncture/points/te1/" target="_top" aria-label="관충 TE1 상세 도해"><title>관충 TE1</title><path class="callout" d="M438 554 L412 549"/><circle cx="438" cy="554" r="6"/><text x="422" y="554" font-size="16" class="">TE1</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/te1/" target="_top"><text x="553" y="169" font-size="20" class="">관충 TE1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/te23/" target="_top"><text x="553" y="239" font-size="20" class="">사죽공 TE23</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">넷째손가락과 손등에서 시작</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">아래팔 뒷면의 두 뼈 사이</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">팔꿈치 뒤에서 어깨·목으로</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">귀 주위를 돌아 눈썹 가쪽</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>