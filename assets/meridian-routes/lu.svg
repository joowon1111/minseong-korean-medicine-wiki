<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">수태음폐경 · 시작혈부터 마지막혈까지</title><desc id="desc">가슴 위쪽 → 팔 안쪽의 엄지 쪽 → 팔꿈치 → 손목 → 엄지. 팔의 앞면을 보며 엄지 쪽을 따라 내려갑니다. 몸 안의 기시는 중초이고, 체표의 첫 혈은 중부입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">수태음폐경 LU</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><ellipse class="skin" cx="270" cy="135" rx="44" ry="57"/><path class="skin" d="M249 185 L248 210 L185 230 L209 282 L211 348 L193 427 L186 466 Q224 488 270 475 Q315 488 354 466 L347 427 L329 348 L331 282 L355 230 L292 210 L291 185 Z"/><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/></g><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/></g><path class="landmark" d="M240 224 Q255 230 270 227 Q285 230 300 224 M252 135 L262 135 M278 135 L288 135 M267 140 L264 149 L275 149 M256 162 Q270 169 284 162"/><circle class="landmark" cx="270" cy="382" r="5"/><path class="landmark" d="M198 540 L239 540 M301 540 L342 540 M197 682 L238 682 M302 682 L343 682"/><text x="45" y="116" font-size="16" class="">앞면</text><path class="route" d="M210 242 L207 227 Q189 254 178 283 L157 349"/><path class="route" d="M157 349 L143 400 L125 469"/><path class="route" d="M125 469 L131 495 L140 517"/><a id="LU1" class="point" href="/acupuncture/points/lu1-zhongfu/" target="_top" aria-label="중부 LU1 상세 도해"><title>중부 LU1</title><path class="callout" d="M210 242 L100 237"/><circle cx="210" cy="242" r="6"/><text x="38" y="242" font-size="16" class="">LU1</text></a><a id="LU5" class="point" href="/acupuncture/points/lu5-chize/" target="_top" aria-label="척택 LU5 상세 도해"><title>척택 LU5</title><path class="callout" d="M157 349 L100 344"/><circle cx="157" cy="349" r="6"/><text x="38" y="349" font-size="16" class="">LU5</text></a><a id="LU9" class="point" href="/acupuncture/points/lu9-taiyuan/" target="_top" aria-label="태연 LU9 상세 도해"><title>태연 LU9</title><path class="callout" d="M125 469 L100 464"/><circle cx="125" cy="469" r="6"/><text x="38" y="469" font-size="16" class="">LU9</text></a><a id="LU11" class="point end" href="/acupuncture/points/lu11/" target="_top" aria-label="소상 LU11 상세 도해"><title>소상 LU11</title><path class="callout" d="M140 517 L100 512"/><circle cx="140" cy="517" r="6"/><text x="38" y="517" font-size="16" class="">LU11</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/lu1-zhongfu/" target="_top"><text x="553" y="169" font-size="20" class="">중부 LU1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/lu11/" target="_top"><text x="553" y="239" font-size="20" class="">소상 LU11</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">가슴 위쪽: 중부·운문</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">위팔 안쪽: 팔꿈치로 내려감</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">손목 앞면: 엄지 쪽 맥박 부위</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">엄지 두덩을 지나 엄지 끝</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>