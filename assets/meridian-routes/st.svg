<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">족양명위경 · 시작혈부터 마지막혈까지</title><desc id="desc">눈 아래 → 코·입·턱과 이마 가지 → 목 → 가슴·배 → 넓적다리 앞 → 종아리 앞가쪽 → 둘째발가락. 얼굴의 올라가는 가지와 몸통·다리로 내려가는 가지를 나눕니다. 체표 첫 혈 승읍과 고전 유주의 코 부근 기시는 구별합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">족양명위경 ST</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><ellipse class="skin" cx="270" cy="135" rx="44" ry="57"/><path class="skin" d="M249 185 L248 210 L185 230 L209 282 L211 348 L193 427 L186 466 Q224 488 270 475 Q315 488 354 466 L347 427 L329 348 L331 282 L355 230 L292 210 L291 185 Z"/><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/></g><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/></g><path class="landmark" d="M240 224 Q255 230 270 227 Q285 230 300 224 M252 135 L262 135 M278 135 L288 135 M267 140 L264 149 L275 149 M256 162 Q270 169 284 162"/><circle class="landmark" cx="270" cy="382" r="5"/><path class="landmark" d="M198 540 L239 540 M301 540 L342 540 M197 682 L238 682 M302 682 L343 682"/><text x="45" y="116" font-size="16" class="">앞면</text><path class="route" d="M254 141 L253 151 L250 160 L239 171 L231 159 L232 139 L238 106"/><path class="route" d="M239 171 L243 215 L218 240 L218 311 L241 343 L241 382 L241 453"/><path class="route" d="M241 453 L221 485 L217 530 L216 553 L213 654 L219 716"/><a id="ST8" class="point" href="/acupuncture/points/st8/" target="_top" aria-label="두유 ST8 상세 도해"><title>두유 ST8</title><path class="callout" d="M238 106 L100 101"/><circle cx="238" cy="106" r="6"/><text x="38" y="106" font-size="16" class="">ST8</text></a><a id="ST1" class="point" href="/acupuncture/points/st1/" target="_top" aria-label="승읍 ST1 상세 도해"><title>승읍 ST1</title><path class="callout" d="M254 141 L100 136"/><circle cx="254" cy="141" r="6"/><text x="38" y="141" font-size="16" class="">ST1</text></a><a id="ST25" class="point" href="/acupuncture/points/st25-tianshu/" target="_top" aria-label="천추 ST25 상세 도해"><title>천추 ST25</title><path class="callout" d="M241 382 L100 377"/><circle cx="241" cy="382" r="6"/><text x="38" y="382" font-size="16" class="">ST25</text></a><a id="ST36" class="point" href="/acupuncture/points/st36-zusanli/" target="_top" aria-label="족삼리 ST36 상세 도해"><title>족삼리 ST36</title><path class="callout" d="M216 553 L100 548"/><circle cx="216" cy="553" r="6"/><text x="38" y="553" font-size="16" class="">ST36</text></a><a id="ST45" class="point end" href="/acupuncture/points/st45/" target="_top" aria-label="여태 ST45 상세 도해"><title>여태 ST45</title><path class="callout" d="M219 716 L100 711"/><circle cx="219" cy="716" r="6"/><text x="38" y="716" font-size="16" class="">ST45</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/st1/" target="_top"><text x="553" y="169" font-size="20" class="">승읍 ST1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/st45/" target="_top"><text x="553" y="239" font-size="20" class="">여태 ST45</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">눈 아래에서 턱·얼굴 가지 확인</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">가슴은 정중선 옆, 배는 더 안쪽</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">넓적다리·무릎의 앞면</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">종아리 앞가쪽을 지나 둘째발가락</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>