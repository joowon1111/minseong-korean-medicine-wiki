d="LR3" class="point" href="/acupuncture/points/lr3-taichong/" target="_top" aria-label="태충 LR3 상세 도해"><title>태충 LR3</title><path class="callout" d="M225 701 L100 696"/><circle cx="225" cy="701" r="6"/><text x="38" y="701" font-size="16" class="">LR3</text></a><a id="LR1" class="point" href="/acupuncture/points/lr1/" target="_top" aria-label="대돈 LR1 상세 도해"><title>대돈 LR1</title><path class="callout" d="M235 716 L100 726"/><circle cx="235" cy="716" r="6"/><text x="38" y="731" font-size="16" class="">LR1</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/lr1/" target="_top"><text x="553" y="169" font-size="20" class="">대돈 LR1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/lr14-qimen/" target="_top"><text x="553" y="239" font-size="20" class="">기문 LR14</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">엄지발가락 가쪽에서 발등으로</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">종아리·무릎·넓적다리 안쪽</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">샅고랑·하복부로 올라감</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">장문·기문은 옆배와 갈비부위</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>