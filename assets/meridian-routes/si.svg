/acupuncture/points/si3-houxi/" target="_top" aria-label="후계 SI3 상세 도해"><title>후계 SI3</title><path class="callout" d="M419 509 L412 504"/><circle cx="419" cy="509" r="6"/><text x="422" y="509" font-size="16" class="">SI3</text></a><a id="SI1" class="point" href="/acupuncture/points/si1/" target="_top" aria-label="소택 SI1 상세 도해"><title>소택 SI1</title><path class="callout" d="M458 548 L412 543"/><circle cx="458" cy="548" r="6"/><text x="422" y="548" font-size="16" class="">SI1</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/si1/" target="_top"><text x="553" y="169" font-size="20" class="">소택 SI1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/si19/" target="_top"><text x="553" y="239" font-size="20" class="">청궁 SI19</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">손의 새끼손가락 쪽에서 시작</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">팔 뒤쪽을 따라 어깨로</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">어깨뼈 주위를 돌아 목으로</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">얼굴 쪽 광대를 거쳐 귀 앞</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>