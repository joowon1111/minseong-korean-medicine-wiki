<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">족태음비경 · 시작혈부터 마지막혈까지</title><desc id="desc">엄지발가락 → 발 안쪽 → 안쪽 발목 앞 → 종아리·넓적다리 안쪽 → 배 가쪽 → 가슴·옆가슴. 체표 혈위의 마지막은 옆가슴 대포입니다. 고전의 혀뿌리·혀 아래 연결과 심으로 가는 가지는 본문에서 따로 읽습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">족태음비경 SP</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><ellipse class="skin" cx="270" cy="135" rx="44" ry="57"/><path class="skin" d="M249 185 L248 210 L185 230 L209 282 L211 348 L193 427 L186 466 Q224 488 270 475 Q315 488 354 466 L347 427 L329 348 L331 282 L355 230 L292 210 L291 185 Z"/><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/></g><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/></g><path class="landmark" d="M240 224 Q255 230 270 227 Q285 230 300 224 M252 135 L262 135 M278 135 L288 135 M267 140 L264 149 L275 149 M256 162 Q270 169 284 162"/><circle class="landmark" cx="270" cy="382" r="5"/><path class="landmark" d="M198 540 L239 540 M301 540 L342 540 M197 682 L238 682 M302 682 L343 682"/><text x="45" y="116" font-size="16" class="">앞면</text><path class="route" d="M239 718 L239 683 L239 635 L240 546"/><path class="route" d="M240 546 L239 520 L245 459 L212 427 L199 382 L190 340 L194 258"/><path class="route" d="M194 258 Q175 275 188 305"/><a id="SP21" class="point end" href="/acupuncture/points/sp21/" target="_top" aria-label="대포 SP21 상세 도해"><title>대포 SP21</title><path class="callout" d="M188 305 L100 300"/><circle cx="188" cy="305" r="6"/><text x="38" y="305" font-size="16" class="">SP21</text></a><a id="SP15" class="point" href="/acupuncture/points/sp15/" target="_top" aria-label="대횡 SP15 상세 도해"><title>대횡 SP15</title><path class="callout" d="M199 382 L100 377"/><circle cx="199" cy="382" r="6"/><text x="38" y="382" font-size="16" class="">SP15</text></a><a id="SP9" class="point" href="/acupuncture/points/sp9-yinlingquan/" target="_top" aria-label="음릉천 SP9 상세 도해"><title>음릉천 SP9</title><path class="callout" d="M240 546 L100 541"/><circle cx="240" cy="546" r="6"/><text x="38" y="546" font-size="16" class="">SP9</text></a><a id="SP6" class="point" href="/acupuncture/points/sp6-sanyinjiao/" target="_top" aria-label="삼음교 SP6 상세 도해"><title>삼음교 SP6</title><path class="callout" d="M239 635 L100 630"/><circle cx="239" cy="635" r="6"/><text x="38" y="635" font-size="16" class="">SP6</text></a><a id="SP1" class="point" href="/acupuncture/points/sp1/" target="_top" aria-label="은백 SP1 상세 도해"><title>은백 SP1</title><path class="callout" d="M239 718 L100 713"/><circle cx="239" cy="718" r="6"/><text x="38" y="718" font-size="16" class="">SP1</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/sp1/" target="_top"><text x="553" y="169" font-size="20" class="">은백 SP1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/sp21/" target="_top"><text x="553" y="239" font-size="20" class="">대포 SP21</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">엄지발가락 안쪽에서 시작</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">발목·무릎의 안쪽을 올라감</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">배에서는 정중선보다 가쪽</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">가슴으로 올라간 뒤 대포는 옆가슴</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>