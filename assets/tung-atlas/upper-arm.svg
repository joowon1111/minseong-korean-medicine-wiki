<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 위팔 · 견중·건중</title><desc id="desc">위팔 가쪽 · 어깨에서 팔꿈치 방향. 견우 아래 2.5촌을 설명한 참고 전승의 기준입니다. 서로 다른 어깨 기준점에서 잰 수치를 섞지 않습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 위팔 · 견중·건중</text><text x="24" y="61" font-size="14">위팔 가쪽 · 어깨에서 팔꿈치 방향</text><path class="skin" d="M160 510 L165 235 Q170 126 265 125 Q360 126 365 235 L370 510 Z"/><path class="bone" d="M190 193 Q264 148 340 194 M265 170 L265 485"/><path class="landmark" d="M198 225 Q265 338 335 225 M165 493 Q265 518 368 493"/><text x="230" y="101" font-size="16">어깨 가쪽</text><text x="235" y="545" font-size="15">팔꿈치</text><a id="jianzhong" class="point" href="/tung-acupuncture/upper-arm/#jianzhong" target="_top" aria-label="견중 위치와 임상 설명"><title>견중 肩中</title><path class="callout" d="M265 250 L470 160"/><circle cx="265" cy="250" r="8"/><text x="486" y="165" font-size="19">견중 肩中</text></a><a id="jianzhong-lower" class="point" href="/tung-acupuncture/upper-arm/#jianzhong-lower" target="_top" aria-label="건중 위치와 임상 설명"><title>건중 建中</title><path class="callout" d="M265 330 L470 225"/><circle cx="265" cy="330" r="8"/><text x="486" y="230" font-size="19">건중 建中</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>