<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 아래팔 안쪽 · 장문·간문·심문</title><desc id="desc">자뼈 쪽 면 · 위는 팔꿈치, 아래는 손목. 손을 가슴에 둔 자세의 자뼈 쪽 면을 펼친 개요입니다. 팔꿈치 끝 기준과 손목 주름 기준을 혼용하지 않습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 아래팔 안쪽 · 장문·간문·심문</text><text x="24" y="61" font-size="14">자뼈 쪽 면 · 위는 팔꿈치, 아래는 손목</text><path class="skin" d="M206 145 Q258 105 309 145 L300 532 L222 532 Z"/><path class="bone" d="M268 152 L268 509"/><path class="landmark" d="M231 142 Q270 119 293 151 M224 520 L298 520"/><text x="220" y="91" font-size="16">팔꿈치 끝</text><text x="211" y="563" font-size="15">손목 주름</text><text x="91" y="338" font-size="14">자뼈 가장자리</text><a id="xinmen" class="point" href="/tung-acupuncture/forearm-ulnar/#xinmen" target="_top" aria-label="심문 위치와 임상 설명"><title>심문 心門</title><path class="callout" d="M268 202 L470 160"/><circle cx="268" cy="202" r="8"/><text x="486" y="165" font-size="19">심문 心門</text></a><a id="ganmen" class="point" href="/tung-acupuncture/forearm-ulnar/#ganmen" target="_top" aria-label="간문 위치와 임상 설명"><title>간문 肝門</title><path class="callout" d="M268 340 L470 225"/><circle cx="268" cy="340" r="8"/><text x="486" y="230" font-size="19">간문 肝門</text></a><a id="changmen" class="point" href="/tung-acupuncture/forearm-ulnar/#changmen" target="_top" aria-label="장문 위치와 임상 설명"><title>장문 腸門</title><path class="callout" d="M268 432 L470 290"/><circle cx="268" cy="432" r="8"/><text x="486" y="295" font-size="19">장문 腸門</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>