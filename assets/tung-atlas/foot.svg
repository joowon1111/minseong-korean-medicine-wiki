<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 발등 · 문금·화경·화주·목두·목류·수곡</title><desc id="desc">오른발 발등 · 엄지발가락이 왼쪽. 발허리뼈 사이의 위치 관계를 보여 줍니다. 발등 혈관과 힘줄을 지나가는 자침 경로는 표시하지 않습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 발등 · 문금·화경·화주·목두·목류·수곡</text><text x="24" y="61" font-size="14">오른발 발등 · 엄지발가락이 왼쪽</text><path class="skin" d="M290 573 Q267 506 230 392 Q206 325 180 217 Q166 161 182 131 Q198 106 219 127 L232 166 Q226 110 247 106 Q269 105 274 161 Q274 115 294 119 Q314 126 314 175 Q319 142 338 150 Q357 159 351 197 Q363 173 379 191 Q395 220 376 266 L388 348 Q394 421 370 503 L370 573 Z"/><path class="bone" d="M220 210 L281 430 M257 209 L300 430 M296 220 L319 430 M333 244 L337 430 M372 270 L355 430"/><path class="landmark" d="M281 520 L378 520 M185 140 Q203 125 220 153 M239 127 Q251 120 263 137"/><text x="80" y="98" font-size="14">엄지발가락</text><text x="290" y="600" font-size="15">발목 방향</text><a id="mudou" class="point" href="/tung-acupuncture/foot/#mudou" target="_top" aria-label="목두 위치와 임상 설명"><title>목두 木斗</title><path class="callout" d="M319 267 L470 160"/><circle cx="319" cy="267" r="8"/><text x="486" y="165" font-size="19">목두 木斗</text></a><a id="huoying" class="point" href="/tung-acupuncture/foot/#huoying" target="_top" aria-label="화경 위치와 임상 설명"><title>화경 火硬</title><path class="callout" d="M254 274 L470 225"/><circle cx="254" cy="274" r="8"/><text x="486" y="230" font-size="19">화경 火硬</text></a><a id="menjin" class="point" href="/tung-acupuncture/foot/#menjin" target="_top" aria-label="문금 위치와 임상 설명"><title>문금 門金</title><path class="callout" d="M303 394 L470 290"/><circle cx="303" cy="394" r="8"/><text x="486" y="295" font-size="19">문금 門金</text></a><a id="muliu" class="point" href="/tung-acupuncture/foot/#muliu" target="_top" aria-label="목류 위치와 임상 설명"><title>목류 木留</title><path class="callout" d="M330 397 L470 355"/><circle cx="330" cy="397" r="8"/><text x="486" y="360" font-size="19">목류 木留</text></a><a id="huozhu" class="point" href="/tung-acupuncture/foot/#huozhu" target="_top" aria-label="화주 위치와 임상 설명"><title>화주 火主</title><path class="callout" d="M284 398 L470 420"/><circle cx="284" cy="398" r="8"/><text x="486" y="425" font-size="19">화주 火主</text></a><a id="shuiqu" class="point" href="/tung-acupuncture/foot/#shuiqu" target="_top" aria-label="수곡 위치와 임상 설명"><title>수곡 水曲</title><path class="callout" d="M349 419 L470 485"/><circle cx="349" cy="419" r="8"/><text x="486" y="490" font-size="19">수곡 水曲</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>