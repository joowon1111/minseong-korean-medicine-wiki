<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">기초 해부학 · 구조 식별</title><desc id="desc">주황색으로 강조된 구조의 이름을 말하세요. 해부 관계를 단순화한 자체 제작 개념도입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff" /><rect x="32.0" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(64.67 155) scale(0.950)"><path class="skin" d="M64 30 Q120 6 176 30 L160 258 L157 275 L164 322 L78 322 L83 273 L65 178 Z" /><path class="bone" d="M88 46 L102 258 M157 45 L136 258" /><path class="line" d="M82 269 L157 269" /></g><g id="ecrb" class="link"><g transform="translate(64.67 155) scale(0.950)"><path class="muscle" d="M88 44 Q137 79 127 159 L119 226 L122 272 L135 308 L126 312 L111 273 L108 226 Q78 142 84 74 Z" /><path class="fiber" d="M92 64 Q116 136 113 218" /></g></g><rect x="333.3333333333333" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(366.00 155) scale(0.950)"><path class="skin" d="M64 30 Q120 6 176 30 L160 258 L157 275 L164 322 L78 322 L83 273 L65 178 Z" /><path class="bone" d="M88 46 L102 258 M157 45 L136 258" /><path class="line" d="M82 269 L157 269" /></g><g id="pronator-teres" class="link"><g transform="translate(366.00 155) scale(0.950)"><path class="muscle" d="M161 49 L155 79 L96 174 L84 165 L128 74 L139 53 Z" /><path class="fiber" d="M148 67 L94 158" /></g></g><rect x="634.6666666666666" y="99" width="293.3333333333333" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(667.33 155) scale(0.950)"><path class="skin" d="M64 30 Q120 6 176 30 L160 258 L157 275 L164 322 L78 322 L83 273 L65 178 Z" /><path class="bone" d="M88 46 L102 258 M157 45 L136 258" /><path class="line" d="M82 269 L157 269" /></g><g id="flexor-carpi-radialis" class="link"><g transform="translate(667.33 155) scale(0.950)"><path class="muscle" d="M132 47 Q150 73 140 126 L126 238 L132 302 L119 307 L110 239 L112 125 Q111 76 119 51 Z" /><path class="fiber" d="M127 65 L122 237 L126 294" /></g></g><text x="28" y="43" font-size="22">팔꿈치·아래팔 · 구조 식별</text><text x="28" y="74" font-size="15">주황색으로 강조된 구조를 확인하세요.</text><text x="28" y="613" font-size="15">패널별로 층·관점을 나눈 개념도 · 실제 해부사진·현미경 사진과 다릅니다.</text></svg>