<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">기초 해부학 · 구조 식별</title><desc id="desc">주황색으로 강조된 구조의 이름을 말하세요. 해부 관계를 단순화한 자체 제작 개념도입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff" /><rect x="32.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(38.00 155) scale(0.858)"><ellipse class="skin" cx="120" cy="52" rx="51" ry="52" /><path class="skin" d="M89 94 L85 171 Q60 186 13 198 L10 308 L230 308 L227 198 Q175 187 156 171 L152 94 Z" /><path class="bone" d="M120 110 L120 284" /><path class="bone" d="M44 218 L98 210 L72 287 Z" /><path class="bone" d="M142 211 L198 218 L171 287 Z" /></g><g id="upper-trapezius" class="link"><g transform="translate(38.00 155) scale(0.858)"><path class="muscle" d="M116 87 L115 176 Q78 193 30 201 L48 218 Q103 205 120 163 Q138 205 195 218 L213 201 Q169 194 127 176 L125 87 Z" /><path class="fiber" d="M118 112 Q105 175 45 207 M123 112 Q139 180 198 207" /></g></g><rect x="258.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(264.00 155) scale(0.858)"><ellipse class="skin" cx="120" cy="52" rx="51" ry="52" /><path class="skin" d="M89 94 L85 171 Q60 186 13 198 L10 308 L230 308 L227 198 Q175 187 156 171 L152 94 Z" /><path class="bone" d="M120 110 L120 284" /><path class="bone" d="M44 218 L98 210 L72 287 Z" /><path class="bone" d="M142 211 L198 218 L171 287 Z" /></g><g id="levator-scapulae" class="link"><g transform="translate(264.00 155) scale(0.858)"><path class="muscle" d="M138 104 L153 110 L178 212 L158 214 L136 135 Z" /><path class="fiber" d="M144 116 L167 206" /></g></g><rect x="484.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(490.00 155) scale(0.858)"><ellipse class="skin" cx="120" cy="51" rx="86" ry="53" /><path class="bone" d="M51 155 L189 155 M57 212 L182 212 M120 184 L120 272" /></g><g id="suboccipitals" class="link"><g transform="translate(490.00 155) scale(0.858)"><path class="muscle" d="M115 151 L97 100 L112 104 Z M125 151 L128 104 L143 100 Z M113 208 L61 88 L88 102 Z M126 208 L153 102 L180 88 Z M57 151 L42 78 L62 85 Z M183 151 L178 86 L196 79 Z M117 210 L54 158 L72 151 Z M124 210 L167 151 L186 158 Z" /></g></g><rect x="710.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(716.00 155) scale(0.858)"><ellipse class="skin" cx="114" cy="52" rx="51" ry="52" /><path class="skin" d="M84 92 L75 184 Q58 213 65 308 L166 308 Q171 216 151 183 L145 92 Z" /><path class="bone" d="M76 276 Q115 251 164 276" /><path class="bone" d="M72 291 L158 291" /></g><g id="sternocleidomastoid" class="link"><g transform="translate(716.00 155) scale(0.858)"><path class="muscle" d="M145 74 L153 89 L126 183 L142 283 L123 291 L110 184 L132 90 Z" /><path class="fiber" d="M141 91 L119 180 L132 276" /></g></g><text x="28" y="43" font-size="22">목·뒤통수 · 구조 식별</text><text x="28" y="74" font-size="15">주황색으로 강조된 구조를 확인하세요.</text><text x="28" y="613" font-size="15">패널별로 층·관점을 나눈 개념도 · 실제 해부사진·현미경 사진과 다릅니다.</text></svg>