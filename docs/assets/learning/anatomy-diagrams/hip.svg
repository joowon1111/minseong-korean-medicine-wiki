<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">기초 해부학 · 구조 식별</title><desc id="desc">주황색으로 강조된 구조의 이름을 말하세요. 해부 관계를 단순화한 자체 제작 개념도입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff" /><rect x="32.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(38.00 155) scale(0.858)"><path class="bone" d="M38 67 Q106 9 195 50 L201 119 L165 169 L135 234 L81 222 L51 160 Z" /><path class="bone" d="M166 157 Q204 152 210 184 L200 330 L176 330 L170 211 L141 191 Z" /></g><g id="gluteus-medius" class="link"><g transform="translate(38.00 155) scale(0.858)"><path class="muscle" d="M44 75 Q107 19 192 56 L193 92 Q191 129 184 179 L168 180 Q128 127 44 75 Z" /><path class="fiber" d="M57 75 L175 168 M106 52 L179 166 M168 53 L183 168" /></g></g><rect x="258.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(264.00 155) scale(0.858)"><path class="bone" d="M38 67 Q106 9 195 50 L201 119 L165 169 L135 234 L81 222 L51 160 Z" /><path class="bone" d="M166 157 Q204 152 210 184 L200 330 L176 330 L170 211 L141 191 Z" /></g><g id="gluteus-minimus" class="link"><g transform="translate(264.00 155) scale(0.858)"><path class="muscle" d="M77 103 Q126 62 193 92 L194 132 L183 182 L167 180 Q123 139 77 103 Z" /><path class="fiber" d="M91 103 L176 170 M133 89 L179 167 M176 99 L183 166" /></g></g><rect x="484.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(490.00 155) scale(0.858)"><path class="bone" d="M20 69 L60 77 L78 179 L50 218 L19 153 Z" /><path class="bone" d="M74 49 Q157 26 209 73 L198 149 L151 187 L104 170 L76 116 Z" /><path class="bone" d="M181 174 Q215 164 218 204 L209 325 L184 325 L180 221 L146 199 Z" /><path class="nerve" d="M93 160 Q118 209 111 314" /></g><g id="piriformis" class="link"><g transform="translate(490.00 155) scale(0.858)"><path class="muscle" d="M43 105 L47 140 L186 195 L198 180 L118 135 Z" /><path class="fiber" d="M51 119 L186 184" /></g></g><rect x="710.0" y="99" width="218.0" height="479" rx="12" fill="#f7f9f8" /><g transform="translate(716.00 155) scale(0.858)"><path class="bone" d="M38 67 Q106 9 195 50 L201 119 L165 169 L135 234 L81 222 L51 160 Z" /><path class="bone" d="M166 157 Q204 152 210 184 L200 330 L176 330 L170 211 L141 191 Z" /><path class="bone" d="M28 65 L72 132" /></g><g id="gluteus-maximus" class="link"><g transform="translate(716.00 155) scale(0.858)"><path class="muscle" d="M42 70 Q103 39 184 74 L199 127 L167 205 L131 227 L77 207 L43 157 Z" /><path class="fiber" d="M58 88 L169 188 M50 116 L148 211 M83 67 L184 159 M126 67 L194 130" /></g></g><text x="28" y="43" font-size="22">엉덩이·고관절 · 구조 식별</text><text x="28" y="74" font-size="15">주황색으로 강조된 구조를 확인하세요.</text><text x="28" y="613" font-size="15">패널별로 층·관점을 나눈 개념도 · 실제 해부사진·현미경 사진과 다릅니다.</text></svg>