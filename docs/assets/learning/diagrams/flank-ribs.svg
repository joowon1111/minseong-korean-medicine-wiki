<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M233 116 L389 116 Q406 194 394 279 L383 400 Q415 458 405 548 L219 548 Q208 458 237 400 L218 279 Z" /><path class="guide" d="M307 135 L307 409" /><path class="guide" d="M227 245 L393 245 M227 321 L390 321 M238 419 L391 419" /><path class="bone" d="M391 351 L332 374 M391 374 L364 391" /><text class="landmark" x="229" y="94">앞 ← · 옆면 · → 뒤</text><text class="landmark" x="88" y="249">제4갈비사이</text><text class="landmark" x="88" y="325">제6갈비사이</text><text class="landmark" x="103" y="423">배꼽 높이</text><text class="landmark" x="222" y="592">중간겨드랑선은 점선</text><g id="GB23" class="point"><circle cx="277" cy="245" r="7" /></g><g id="GB22" class="point"><circle cx="307" cy="245" r="7" /></g><g id="SP21" class="point"><circle cx="307" cy="321" r="7" /></g><g id="LR13" class="point"><circle cx="332" cy="380" r="7" /></g><g id="GB25" class="point"><circle cx="364" cy="397" r="7" /></g><g id="GB26" class="point"><circle cx="332" cy="419" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>