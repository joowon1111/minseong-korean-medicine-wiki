<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M278 95 L360 95 L366 130 L448 163 L425 289 L410 426 L437 560 L200 560 L227 425 L212 289 L189 163 L273 130 Z" /><path class="guide" d="M319 129 L319 551" /><circle class="joint" cx="319" cy="385" r="8" /><path class="guide" d="M235 205 L403 205" /><text class="landmark" x="445" y="210">제4갈비사이</text><text class="landmark" x="439" y="390">배꼽</text><path class="guide" d="M319 385 L437 385" /><g id="CV17" class="point"><circle cx="319" cy="205" r="8" /></g><g id="CV12" class="point"><circle cx="319" cy="297" r="8" /></g><g id="ST25" class="point"><circle cx="371" cy="385" r="8" /></g><g id="CV6" class="point"><circle cx="319" cy="427" r="8" /></g><g id="CV4" class="point"><circle cx="319" cy="469" r="8" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>