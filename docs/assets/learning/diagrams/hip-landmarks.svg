<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M221 135 Q334 107 435 164 L458 379 L415 530 L287 537 L282 428 L183 350 Z" /><circle class="joint" cx="229" cy="223" r="12" /><circle class="joint" cx="401" cy="376" r="15" /><circle class="joint" cx="210" cy="388" r="9" /><path class="guide" d="M229 223 L401 376 M401 376 L210 388" /><text class="landmark" x="118" y="199">위앞엉덩뼈가시</text><text class="landmark" x="405" y="415">큰돌기</text><text class="landmark" x="104" y="427">엉치뼈틈새</text><g id="GB29" class="point"><circle cx="315" cy="299" r="7" /></g><g id="GB30" class="point"><circle cx="337" cy="380" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>