<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M249 95 L391 95 L399 177 L447 476 L467 545 L173 545 L193 476 L241 177 Z" /><path class="tendon" d="M393 162 L346 491 M379 174 L408 491" /><path class="bone" d="M200 495 Q250 515 300 496 M337 496 Q391 516 444 495" /><path class="bone" d="M294 300 L343 300 M300 367 L339 367" /><path class="bone" d="M289 244 L347 244" /><text class="landmark" x="96" y="304">방패연골 위</text><text class="landmark" x="99" y="371">반지연골</text><text class="landmark" x="140" y="245">목뿔뼈</text><text class="landmark" x="256" y="598">목 앞면 · 목빗근 두 갈래</text><g id="CV23" class="point"><circle cx="320" cy="230" r="7" /></g><g id="LI18" class="point"><circle cx="370" cy="300" r="7" /></g><g id="ST10" class="point"><circle cx="345" cy="367" r="7" /></g><g id="ST12" class="point"><circle cx="419" cy="481" r="7" /></g><g id="CV22" class="point"><circle cx="320" cy="4