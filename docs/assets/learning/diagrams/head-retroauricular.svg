<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M190 277 L213 246 Q207 129 290 104 Q383 81 431 144 Q460 221 435 318 L406 384 L399 491 L310 491 L320 402 L240 401 L224 360 L209 354 L219 330 L193 320 L213 297 Z" /><path class="skin" d="M348 269 Q378 248 390 282 L382 336 Q370 363 351 339 Q338 313 348 269 Z" /><path class="crease" d="M357 281 Q378 271 375 307 L359 326" /><path class="bone" d="M240 244 L330 267" /><path class="crease" d="M231 214 L261 210 M242 397 L320 402 L339 328" /><text class="landmark" x="205" y="558">앞쪽 ← · → 뒤쪽</text><circle class="joint" cx="400" cy="343" r="12" /><path class="guide" d="M397 171 Q447 253 409 365" /><path class="guide" d="M366 248 Q416 292 380 353" /><text class="landmark" x="405" y="393">꼭지돌기</text><g id="GB10" class="point"><circle cx="425" cy="236" r="7" /></g><g id="TE19" class="point"><circle cx="398" cy="283" r="7" /></g><g id="GB11" class="point"><circle cx="429" cy="303" r="7" /></g><g id="TE18" class="point"><circle cx="398" cy="320" r="7" /></g><g id="TE17" class="point"><circle cx="380" cy="353" r="7" /></g><g id="GB12" class="point"><circle cx="409" cy="365" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>