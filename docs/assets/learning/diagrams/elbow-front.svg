<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M230 108 L410 108 Q425 199 413 302 L433 558 L211 558 L226 305 Q214 200 230 108 Z" /><path class="crease" d="M232 300 Q320 330 410 300" /><path class="tendon" d="M325 161 L325 347" /><text class="landmark" x="70" y="139">안쪽 · 몸통 쪽</text><text class="landmark" x="442" y="139">가쪽</text><text class="landmark" x="266" y="582">아래팔 방향 ↓</text><text class="landmark" x="376" y="243">위팔두갈래근건</text><g id="HT3" class="point"><circle cx="245" cy="305" r="8" /></g><g id="PC3" class="point"><circle cx="304" cy="310" r="8" /></g><g id="LI11" class="point"><circle cx="390" cy="308" r="8" /></g><g id="LU5" class="point"><circle cx="345" cy="310" r="8" /></g><g id="LI10" class="point"><circle cx="402" cy="375" r="8" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>