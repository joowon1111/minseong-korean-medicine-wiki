<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z" /><path class="bone" d="M272 261 L280 575" /><path class="tendon" d="M374 399 L360 577" /><path class="crease" d="M244 211 L392 211" /><text class="landmark" x="95" y="111">앞쪽</text><text class="landmark" x="437" y="111">뒤쪽</text><circle class="joint" cx="304" cy="568" r="17" /><text class="landmark" x="80" y="568">안쪽복사</text><text class="landmark" x="421" y="486">아킬레스건</text><g id="SP8" class="point"><circle cx="289" cy="333" r="7" /></g><g id="LR6" class="point"><circle cx="277" cy="403" r="7" /></g><g id="SP7" class="point"><circle cx="294" cy="427" r="7" /></g><g id="LR5" class="point"><circle cx="278" cy="450" r="7" /></g><g id="KI8" class="point"><circle cx="314" cy="521" r="7" /></g><g id="LR7" class="point"><circle cx="322" cy="262" r="7" /></g><g id="KI9" class="point"><circle cx="357" cy="450" r="7" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>