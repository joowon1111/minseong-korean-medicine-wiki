<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M223 105 Q320 63 417 105 Q446 199 419 369 Q396 464 321 491 Q242 464 220 369 Q193 200 223 105 Z" /><path class="crease" d="M240 222 Q266 201 292 222 Q266 242 240 222 M347 222 Q372 201 398 222 Q372 242 347 222" /><circle class="joint" cx="267" cy="222" r="4" /><circle class="joint" cx="372" cy="222" r="4" /><path class="tendon" d="M239 197 Q267 184 291 197 M347 197 Q372 184 398 197" /><path class="crease" d="M315 229 L303 312 Q320 326 337 312 L325 229 M293 321 Q320 340 347 321" /><path class="crease" d="M278 377 Q320 360 362 377 Q320 393 278 377 M298 414 Q320 423 342 414" /><path class="guide" d="M372 168 L372 355" /><text class="landmark" x="168" y="530">정면 · 한쪽 짝혈만 표시</text><g id="GV25" class="point"><circle cx="320" cy="316" r="7" /></g><g id="LI20" class="point"><circle cx="350" cy="316" r="7" /></g><g id="LI19" class="point