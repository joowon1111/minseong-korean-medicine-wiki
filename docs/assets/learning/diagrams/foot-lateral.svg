<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</title><desc id="desc">경혈 위치 연습 — 붉은 점의 위치를 확인하세요.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white" /><text x="24" y="38" font-size="22" font-weight="700">경혈 위치 연습</text><path class="skin" d="M333 121 L440 121 L444 288 Q457 329 441 376 Q363 410 301 396 Q251 382 179 389 L100 393 Q76 387 83 366 Q91 350 126 351 L207 330 Q249 298 302 291 L333 269 Z" /><circle class="joint" cx="347" cy="290" r="25" /><path class="tendon" d="M421 158 L423 344" /><text class="landmark" x="306" y="251">가쪽복사</text><text class="landmark" x="449" y="347">뒤꿈치</text><text class="landmark" x="84" y="441">발가락 방향 ←</text><g id="BL67" class="point"><circle cx="97" cy="361" r="8" /></g><g id="BL65" class="point"><circle cx="195" cy="363" r="8" /></g><g id="BL66" class="point"><circle cx="157" cy="367" r="8" /></g><g id="BL60" class="point"><circle cx="389" cy="290" r="8" /></g><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>