<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">MPS · 긴장대와 통증을 읽는 방법</title><desc id="desc">촉진 부위와 환자가 실제로 느낀 통증 부위를 구분하여 기록합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff"/><text x="28" y="43" font-size="27" text-anchor="start">MPS · 긴장대와 통증을 읽는 방법</text><text x="28" y="74" font-size="15" text-anchor="start">촉진 부위와 환자가 실제로 느낀 통증 부위를 구분하여 기록합니다.</text><rect x="28" y="105" width="904" height="233" rx="12" fill="#f7f9f8"/><ellipse class="muscle" cx="280" cy="218" rx="192" ry="77"/><path class="fiber" d="M121 174 Q280 184 440 174"/><path class="fiber" d="M121 190 Q280 200 440 190"/><path class="fiber" d="M121 206 Q280 216 440 206"/><path class="fiber" d="M121 222 Q280 232 440 222"/><path class="fiber" d="M121 238 Q280 248 440 238"/><path class="fiber" d="M121 254 Q280 264 440 254"/><path class="nerve" d="M107 215 Q279 233 458 215"/><circle cx="294" cy="223" r="17" fill="#c75f35" stroke="white" stroke-width="3"/><text x="526" y="158" font-size="20" text-anchor="start">긴장대 · taut band</text><text x="526" y="189" font-size="16" text-anchor="start">띠처럼 만져지는 근육 부위</text><text x="526" y="231" font-size="20" text-anchor="start">과민점 · hypersensitive spot</text><text x="526" y="262" font-size="16" text-anchor="start">긴장대 안에서 특히 민감한 곳</text><text x="526" y="305" font-size="18" text-anchor="start">평소의 익숙한 증상인지 확인</text><rect x="28" y="358" width="292" height="221" rx="12" fill="#faf7f1"/><text x="46" y="389" font-size="19" text-anchor="start">국소 통증</text><ellipse class="muscle" cx="143" cy="465" rx="81" ry="38"/><circle cx="126" cy="465" r="11" fill="#c75f35"/><text x="46" y="551" font-size="15" text-anchor="start">누른 곳 가까이 아픔</text><rect x="334" y="358" width="292" height="221" rx="12" fill="#faf7f1"/><text x="352" y="389" font-size="19" text-anchor="start">퍼지는 통증</text><ellipse class="muscle" cx="449" cy="465" rx="81" ry="38"/><ellipse cx="458" cy="465" rx="53" ry="19" fill="#e8ad82" opacity=".9"/><text x="352" y="551" font-size="15" text-anchor="start">같은 근육 안으로 퍼짐</text><rect x="640" y="358" width="292" height="221" rx="12" fill="#faf7f1"/><text x="658" y="389" font-size="19" text-anchor="start">연관통</text><ellipse class="muscle" cx="755" cy="465" rx="81" ry="38"/><circle cx="738" cy="465" r="11" fill="#c75f35"/><ellipse cx="887" cy="456" rx="24" ry="31" fill="#e8ad82"/><text x="658" y="551" font-size="15" text-anchor="start">근육 밖의 다른 곳에서 느낌</text><text x="28" y="612" font-size="16" text-anchor="start">위치·범위는 개인마다 달라집니다. 이 도해는 고정된 통증 지도가 아닙니다.</text><text x="28" y="642" font-size="16" text-anchor="start">통증 양상 + 움직임·기능 + 신경학적 소견을 함께 해석합니다.</text><text x="28" y="666" font-size="12" text-anchor="start">자체 제작 개념도 · 국제 TrP Delphi 합의 및 DC/TMD의 용어 구분을 참고</text></svg>