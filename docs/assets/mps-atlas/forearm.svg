<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">팔꿈치·아래팔 · 근육 해부 도해</title><desc id="desc">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff"/><text x="28" y="43" font-size="27" text-anchor="start">팔꿈치·아래팔 · 근육 해부 도해</text><text x="28" y="74" font-size="15" text-anchor="start">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</text><rect x="32.0" y="99" width="444.0" height="479" rx="12" fill="#f7f9f8"/><text x="254.0" y="128" font-size="13" text-anchor="middle">뒤쪽 · 손등 방향</text><g transform="translate(140.00 155) scale(0.950)"><path class="skin" d="M64 30 Q120 6 176 30 L160 258 L151 284 L170 325 Q172 347 155 347 L115 316 L77 326 Q63 323 71 300 L83 272 L65 178 Z"/><path class="bone" d="M88 46 L102 258 M157 45 L136 258"/><path class="line" d="M82 269 L157 269"/><text x="93" y="7" font-size="13" text-anchor="start">팔꿈치</text><text x="172" y="274" font-size="12" text-anchor="start">손목</text></g><a id="ecrb" class="link" href="/clinical-anatomy/mps-forearm/#ecrb" target="_top" aria-label="단요측수근신근 해부와 평가"><title>단요측수근신근 · Extensor carpi radialis brevis · ECRB</title><g transform="translate(140.00 155) scale(0.950)"><path class="muscle" d="M88 44 Q137 79 127 159 L119 226 L122 272 L135 308 L126 312 L111 273 L108 226 Q78 142 84 74 Z"/><path class="fiber" d="M92 64 Q116 136 113 218"/></g><rect class="button" x="40.00" y="532" width="428.00" height="34" rx="8"/><text x="254.0" y="555" font-size="17" text-anchor="middle">단요측수근신근 →</text></a><rect x="484.0" y="99" width="444.0" height="479" rx="12" fill="#f7f9f8"/><text x="706.0" y="128" font-size="13" text-anchor="middle">앞쪽 · 손바닥 방향</text><g transform="translate(592.00 155) scale(0.950)"><path class="skin" d="M64 30 Q120 6 176 30 L160 258 L151 284 L170 325 Q172 347 155 347 L115 316 L77 326 Q63 323 71 300 L83 272 L65 178 Z"/><path class="bone" d="M88 46 L102 258 M157 45 L136 258"/><path class="line" d="M82 269 L157 269"/><text x="93" y="7" font-size="13" text-anchor="start">팔꿈치</text><text x="172" y="274" font-size="12" text-anchor="start">손목</text></g><a id="pronator-teres" class="link" href="/clinical-anatomy/mps-forearm/#pronator-teres" target="_top" aria-label="원회내근 해부와 평가"><title>원회내근 · Pronator teres</title><g transform="translate(592.00 155) scale(0.950)"><path class="muscle" d="M161 49 L155 79 L96 174 L84 165 L128 74 L139 53 Z"/><path class="fiber" d="M148 67 L94 158"/></g><rect class="button" x="492.00" y="532" width="428.00" height="34" rx="8"/><text x="706.0" y="555" font-size="17" text-anchor="middle">원회내근 →</text></a><text x="28" y="613" font-size="15" text-anchor="start">초록: 해당 근육·근육군  |  베이지: 뼈·체표 윤곽  |  근육층은 패널별로 분리</text><text x="28" y="642" font-size="14" text-anchor="start">관계를 단순화한 자체 제작 도해 · 고정 유발점·자침 깊이·경로를 나타내지 않습니다.</text><text x="28" y="666" font-size="12" text-anchor="start">민성 한의학 아카이브 · 해부 출처와 평가 기준은 연결된 본문 참조</text></svg>