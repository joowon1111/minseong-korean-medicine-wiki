<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">허리·옆구리 · 근육 해부 도해</title><desc id="desc">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff"/><text x="28" y="43" font-size="27" text-anchor="start">허리·옆구리 · 근육 해부 도해</text><text x="28" y="74" font-size="15" text-anchor="start">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</text><rect x="32.0" y="99" width="444.0" height="479" rx="12" fill="#f7f9f8"/><text x="254.0" y="128" font-size="13" text-anchor="middle">뒤쪽 투영 · 후복벽</text><g transform="translate(140.00 155) scale(0.950)"><path class="skin" d="M36 65 Q121 88 204 65 L211 269 Q177 290 157 310 L83 310 Q65 290 30 267 Z"/><path class="bone" d="M108 83 L131 83 L140 270 L100 270 Z"/><path class="bone" d="M24 257 Q57 229 99 253 L107 308 L84 323 L33 293 Z"/><path class="bone" d="M143 253 Q183 229 216 257 L207 293 L155 323 L133 308 Z"/><path class="bone" d="M25 72 L106 98 M134 98 L216 72"/><text x="4" y="52" font-size="13" text-anchor="start">제12갈비뼈</text><text x="156" y="344" font-size="13" text-anchor="start">장골능</text></g><a id="quadratus-lumborum" class="link" href="/clinical-anatomy/mps-lumbar/#quadratus-lumborum" target="_top" aria-label="요방형근 해부와 평가"><title>요방형근 · Quadratus lumborum<