<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">턱·관자 · 근육 해부 도해</title><desc id="desc">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff"/><text x="28" y="43" font-size="27" text-anchor="start">턱·관자 · 근육 해부 도해</text><text x="28" y="74" font-size="15" text-anchor="start">근육이나 이름을 눌러 기능·신경지배·MPS 평가로 이동합니다.</text><rect x="32.0" y="99" width="444.0" height="479" rx="12" fill="#f7f9f8"/><text x="254.0" y="128" font-size="13" text-anchor="middle">옆쪽 · 턱 가쪽</text><g transform="translate(140.00 155) scale(0.950)"><path class="skin" d="M40 164 Q17 125 30 72 Q46 18 113 20 Q183 15 198 78 L195 114 L218 137 L197 146 L200 175 L212 180 L199 191 Q198 224 164 230 L151 288 L63 285 L73 230 Q45 218 40 164 Z"/><path class="bone" d="M84 161 L104 206 L185 204 L170 226 L91 234 L64 174 Z"/><path class="bone" d="M79 145 L164 143"/><ellipse class="bone" cx="75" cy="151" rx="11" ry="15"/><path class="line" d="M182 115 L193 116"/><text x="108" y="319" font-size="13" text-anchor="start">턱뼈</text><text x="160" y="10" font-size="13" text-anchor="start">얼굴 앞 →</text></g><a id="masseter" class="link" href="/clinical-anatomy/mps-jaw/#masseter" target="_top" aria-label="교근 해부와 평가"><title>교근 · Masseter</title><g transform="translate(140.00 155) scale(0.950)"><path class="muscle" d="M88 147 L151 146 L160 210 L108 219 Z"/><path class="fiber" d="M100 155 L119 207 M119 155 L133 207 M139 155 L147 204"/></g><rect class="button" x="40.00" y="532" width="428.00" height="34" rx="8"/><text x="254.0" y="555" font-size="17" text-anchor="middle">교근 →</text></a><rect x="484.0" y="99" width="444.0" height="479" rx="12" fill="#f7f9f8"/><text x="706.0" y="128" font-size="13" text-anchor="middle">옆쪽 · 관자 부위</text><g transform="translate(592.00 155) scale(0.950)"><path class="skin" d="M40 164 Q17 125 30 72 Q46 18 113 20 Q183 15 198 78 L195 114 L218 137 L197 146 L200 175 L212 180 L199 191 Q198 224 164 230 L151 288 L63 285 L73 230 Q45 218 40 164 Z"/><path class="bone" d="M84 161 L104 206 L185 204 L170 226 L91 234 L64 174 Z"/><path class="bone" d="M79 145 L164 143"/><ellipse class="bone" cx="75" cy="151" rx="11" ry="15"/><path class="line" d="M182 115 L193 116"/><text x="108" y="319" font-size="13" text-anchor="start">턱뼈</text><text x="160" y="10" font-size="13" text-anchor="start">얼굴 앞 →</text></g><a id="temporalis" class="link" href="/clinical-anatomy/mps-jaw/#temporalis" target="_top" aria-label="측두근 해부와 평가"><title>측두근 · Temporalis</title><g transform="translate(592.00 155) scale(0.950)"><path class="muscle" d="M46 114 Q23 58 77 35 Q143 15 178 76 L161 122 L140 179 L126 183 L119 130 Z"/><path class="fiber" d="M56 67 L132 165 M94 47 L134 161 M152 67 L138 158"/></g><rect class="button" x="492.00" y="532" width="428.00" height="34" rx="8"/><text x="706.0" y="555" font-size="17" text-anchor="middle">측두근 →</text></a><text x="28" y="613" font-size="15" text-anchor="start">초록: 해당 근육·근육군  |  베이지: 뼈·체표 윤곽  |  근육층은 패널별로 분리</text><text x="28" y="642" font-size="14" text-anchor="start">관계를 단순화한 자체 제작 도해 · 고정 유발점·자침 깊이·경로를 나타내지 않습니다.</text><text x="28" y="666" font-size="12" text-anchor="start">민성 한의학 아카이브 · 해부 출처와 평가 기준은 연결된 본문 참조</text></svg>