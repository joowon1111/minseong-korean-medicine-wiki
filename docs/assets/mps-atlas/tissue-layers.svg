<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc"><title id="title">근육·근막 · 조직층을 나누어 보기</title><desc id="desc">왼쪽은 피부에서 근육까지의 개념 단면, 오른쪽은 근육 내부 결합조직의 확대 개요입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}.bone{fill:#eee5d6;stroke:#b09c7c;stroke-width:2}.skin{fill:#faf3eb;stroke:#cab6a4;stroke-width:2}.line{fill:none;stroke:#b09c7c;stroke-width:2}.muscle{fill:#60b6b0;stroke:#176f70;stroke-width:2}.fiber{fill:none;stroke:#d6f0e9;stroke-width:1.5;pointer-events:none}.nerve{fill:none;stroke:#d6a137;stroke-width:5;stroke-linecap:round}.link:hover .muscle,.link:focus .muscle,.link:target .muscle{fill:#e2a17b;stroke:#a54b28}.link:hover .button,.link:focus .button,.link:target .button{fill:#d7edea}.link:focus{outline:2px solid #176f70}.button{fill:#edf7f4;stroke:#6ba8a3;stroke-width:1.5}.small{fill:#536974}</style><rect x="0" y="0" width="960" height="680" rx="20" fill="#fff"/><text x="28" y="43" font-size="27" text-anchor="start">근육·근막 · 조직층을 나누어 보기</text><text x="28" y="74" font-size="15" text-anchor="start">왼쪽은 피부에서 근육까지의 개념 단면, 오른쪽은 근육 내부 결합조직의 확대 개요입니다.</text><rect x="28" y="110" width="440" height="450" rx="12" fill="#f7f9f8"/><rect x="490" y="110" width="442" height="450" rx="12" fill="#f7f9f8"/><rect x="49" y="166" width="195" height="28" rx="2" fill="#d6ad92"/><text x="263" y="186.0" font-size="16" text-anchor="start">피부</text><rect x="49" y="194" width="195" height="74" rx="2" fill="#f2dfac"/><text x="263" y="237.0" font-size="16" text-anchor="start">피하조직 · 얕은근막</text><rect x="49" y="268" width="195" height="16" rx="2" fill="#c0d8da"/><text x="263" y="282.0" font-size="16" text-anchor="start">깊은근막</text><rect x="49" y="293" width="195" height="21" rx="2" fill="#86babc"/><text x="263" y="309.5" font-size="16" text-anchor="start">근외막</text><rect x="49" y="314" width="195" height="168" rx="2" fill="#d3e8de"/><text x="263" y="404.0" font-size="16" text-anchor="start">골격근</text><path class="fiber" d="M61 330 L231 330"/><path class="fiber" d="M61 352 L231 352"/><path class="fiber" d="M61 374 L231 374"/><path class="fiber" d="M61 396 L231 396"/><path class="fiber" d="M61 418 L231 418"/><path class="fiber" d="M61 440 L231 440"/><path class="fiber" d="M61 462 L231 462"/><text x="49" y="142" font-size="20" text-anchor="start">층별 구조</text><text x="49" y="524" font-size="15" text-anchor="start">부위마다 두께·연결 방식이 다릅니다.</text><ellipse class="muscle" cx="689" cy="302" rx="142" ry="142"/><circle cx="634" cy="261" r="45" fill="#f9eedb" stroke="#628f97" stroke-width="5"/><circle cx="620" cy="248" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="648" cy="248" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="634" cy="276" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="731" cy="256" r="45" fill="#f9eedb" stroke="#628f97" stroke-width="5"/><circle cx="717" cy="243" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="745" cy="243" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="731" cy="271" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="673" cy="358" r="45" fill="#f9eedb" stroke="#628f97" stroke-width="5"/><circle cx="659" cy="345" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="687" cy="345" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><circle cx="673" cy="373" r="12" fill="#bc8273" stroke="#fff" stroke-width="3"/><text x="518" y="142" font-size="20" text-anchor="start">근육 내부 · 확대</text><text x="518" y="484" font-size="16" text-anchor="start">근외막: 근육 전체를 감쌈</text><text x="518" y="513" font-size="16" text-anchor="start">근주막: 근섬유 다발을 감쌈</text><text x="518" y="542" font-size="16" text-anchor="start">근내막: 개별 근섬유를 감쌈</text><text x="28" y="601" font-size="17" text-anchor="start">근막·근육·힘줄은 이어져 있지만, 통증의 원인 조직은 진찰에서 구분합니다.</text><text x="28" y="632" font-size="15" text-anchor="start">신경·혈관은 여러 층 사이를 지나갑니다. 이 그림에서는 생략했습니다.</text><text x="28" y="661" font-size="13" text-anchor="start">자체 제작 개념도 · 실제 조직 두께·주행을 나타내지 않음 · 본문에 해부 출처 수록</text></svg>