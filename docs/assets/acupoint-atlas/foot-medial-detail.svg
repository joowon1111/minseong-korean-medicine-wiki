<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">안쪽 발목·발허리 확대</title><desc id="desc">공손은 첫째 발허리뼈바닥 앞아래, 대종은 안쪽복사 뒤아래의 아킬레스건 부착부 앞쪽, 수천은 태계 바로 아래 1 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">안쪽 발목·발허리 확대</text><path class="skin" d="M333 121 L440 121 L444 288 Q457 329 441 376 Q363 410 301 396 Q251 382 179 389 L100 393 Q76 387 83 366 Q91 350 126 351 L207 330 Q249 298 302 291 L333 269 Z"/><circle class="joint" cx="347" cy="279" r="25"/><path class="tendon" d="M421 158 L423 344"/><circle class="joint" cx="278" cy="320" r="12"/><text class="landmark" x="306" y="245">안쪽복사</text><text class="landmark" x="449" y="347">뒤꿈치</text><text class="landmark" x="84" y="441">발가락 방향 ←</text><text class="landmark" x="210" y="304">발배뼈거친면</text><a id="SP4" class="point" href="/acupuncture/points/sp4-gongsun/" target="_top" aria-label="공손 SP4 상세 설명"><title>공손 SP4 · 발 안쪽면, 첫째 발허리뼈바닥(base of the 1st metatarsal bone)의 아래앞쪽, 赤白肉際.</title><path class="callout" d="M232 346 L88 341"/><circle cx="232" cy="346" r="7"/><text x="24" y="346">SP4</text></a><a id="KI5" class="point" href="/acupuncture/points/ki5/" target="_top" aria-label="수천 KI5 상세 설명"><title>수천 KI5 · 발 안쪽면으로, 太谿(KI3)에서 지면까지 3촌으로 정했을 때, 태계 아래쪽으로 1寸 부위, 발꿈치뼈융기(calcaneal tuberosity)앞쪽 오목한 곳에 취혈함.</title><path class="callout" d="M389 313 L512 308"/><circle cx="389" cy="313" r="7"/><text x="520" y="313">KI5</text></a><a id="KI4" class="point" href="/acupuncture/points/ki4/" target="_top" aria-label="대종 KI4 상세 설명"><title>대종 KI4 · 발 안쪽면에서, 안쪽 복사(medial malleolus)아래 뒤쪽, 발꿈치뼈(calcaneus)위쪽에 해당되며, 발꿈치힘줄(calcaneal tendon)안쪽 부착부의 앞쪽 오목한 곳에 취혈함.</title><path class="callout" d="M408 330 L512 347"/><circle cx="408" cy="330" r="7"/><text x="520" y="352">KI4</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>