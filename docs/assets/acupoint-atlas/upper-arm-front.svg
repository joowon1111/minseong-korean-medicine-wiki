<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">위팔 앞면·안쪽</title><desc id="desc">천부·협백은 앞겨드랑주름 아래 3·4 B-cun의 위팔두갈래근 가쪽입니다. 천천은 주름 아래 2 B-cun의 두 근육갈래 사이, 청령은 팔꿈치 위 3 B-cun 안쪽입니다. 극천은 겨드랑 중심을 따로 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">위팔 앞면·안쪽</text><path class="skin" d="M260 115 Q338 69 399 125 Q420 161 394 218 L389 542 L236 542 L232 218 Q214 161 260 115 Z"/><path class="tendon" d="M256 188 Q284 294 277 475 M355 181 Q383 301 349 475"/><path class="crease" d="M237 525 L389 525"/><path class="crease" d="M238 178 L350 178"/><text class="landmark" x="235" y="95">앞겨드랑주름</text><text class="landmark" x="245" y="578">팔꿈치주름</text><text class="landmark" x="105" y="119">안쪽</text><text class="landmark" x="438" y="119">가쪽</text><a id="HT1" class="point" href="/acupuncture/points/ht1/" target="_top" aria-label="극천 HT1 상세 설명"><title>극천 HT1 · 겨드랑, 겨드랑 중심(centre of the axillary fossa), 겨드랑동맥(axillary artery)이 뛰는 곳.</title><path class="callout" d="M237 169 L88 164"/><circle cx="237" cy="169" r="7"/><text x="24" y="169">HT1</text></a><a id="HT2" class="point" href="/acupuncture/points/ht2/" target="_top" aria-label="청령 HT2 상세 설명"><title>청령 HT2 · 위팔 안쪽면, 위팔두갈래근(biceps brachii muscle)의 안쪽모서리 바로 안쪽, 팔오금주름(cubital crease)에서 위쪽으로 3寸.</title><path class="callout" d="M251 421 L88 416"/><circle cx="251" cy="421" r="7"/><text x="24" y="421">HT2</text></a><a id="PC2" class="point" href="/acupuncture/points/pc2/" target="_top" aria-label="천천 PC2 상세 설명"><title>천천 PC2 · 위팔 앞쪽면, 위팔두갈래근(biceps brachii m.)의 긴갈래와 짧은갈래 사이, 앞겨드랑주름(anterior axillary fold)에서 먼쪽으로 2寸.</title><path class="callout" d="M316 247 L512 242"/><circle cx="316" cy="247" r="7"/><text x="520" y="247">PC2</text></a><a id="LU3" class="point" href="/acupuncture/points/lu3/" target="_top" aria-label="천부 LU3 상세 설명"><title>천부 LU3 · 위팔 앞가쪽면, 위팔두갈래근(biceps brachiimuscle)의 가쪽모서리 바로 가쪽, 앞겨드랑주름(anterior axillary fold)에서 아래쪽으로 3寸.</title><path class="callout" d="M371 282 L512 281"/><circle cx="371" cy="282" r="7"/><text x="520" y="286">LU3</text></a><a id="LU4" class="point" href="/acupuncture/points/lu4/" target="_top" aria-label="협백 LU4 상세 설명"><title>협백 LU4 · 위팔 앞가쪽면, 위팔두갈래근(biceps brachii muscle)의 가쪽모서리 바로가쪽, 앞겨드랑주름(anterior axillary fold)에서 아래쪽으로 4寸.</title><path class="callout" d="M370 317 L512 320"/><circle cx="370" cy="317" r="7"/><text x="520" y="325">LU4</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>