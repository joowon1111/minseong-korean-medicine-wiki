<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">옆가슴·옆배 · 갈비뼈 끝</title><desc id="desc">연액·첩근은 제4갈비사이 중간겨드랑선·그 앞 1 B-cun, 대포는 제6갈비사이 중간겨드랑선입니다. 장문·경문은 제11·12갈비뼈끝 아래, 대맥은 제11갈비뼈끝 아래 수직선에서 배꼽 높이입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">옆가슴·옆배 · 갈비뼈 끝</text><path class="skin" d="M233 116 L389 116 Q406 194 394 279 L383 400 Q415 458 405 548 L219 548 Q208 458 237 400 L218 279 Z"/><path class="guide" d="M307 135 L307 409"/><path class="guide" d="M227 245 L393 245 M227 321 L390 321 M238 419 L391 419"/><path class="bone" d="M391 351 L332 374 M391 374 L364 391"/><text class="landmark" x="229" y="94">앞 ← · 옆면 · → 뒤</text><text class="landmark" x="88" y="249">제4갈비사이</text><text class="landmark" x="88" y="325">제6갈비사이</text><text class="landmark" x="103" y="423">배꼽 높이</text><text class="landmark" x="222" y="592">중간겨드랑선은 점선</text><a id="GB23" class="point" href="/acupuncture/points/gb23/" target="_top" aria-label="첩근 GB23 상세 설명"><title>첩근 GB23 · 가쪽가슴부위, 넷째 갈비사이공간(the 4th intercostal space), 중간겨드랑선 (midaxillary line)에서 앞쪽으로 1寸.</title><path class="callout" d="M277 245 L88 240"/><circle cx="277" cy="245" r="7"/><text x="24" y="245">GB23</text></a><a id="GB22" class="point" href="/acupuncture/points/gb22/" target="_top" aria-label="연액 GB22 상세 설명"><title>연액 GB22 · 가쪽가슴부위, 넷째 갈비사이공간(the 4th intercostal space), 중간겨드랑선(midaxillary line) 위.</title><path class="callout" d="M307 245 L88 279"/><circle cx="307" cy="245" r="7"/><text x="24" y="284">GB22</text></a><a id="SP21" class="point" href="/acupuncture/points/sp21/" target="_top" aria-label="대포 SP21 상세 설명"><title>대포 SP21 · 가쪽가슴부위, 여섯째 갈비사이공간(the 6th intercostal space), 중간겨드랑선(midaxillary line) 위.</title><path class="callout" d="M307 321 L88 318"/><circle cx="307" cy="321" r="7"/><text x="24" y="323">SP21</text></a><a id="LR13" class="point" href="/acupuncture/points/lr13-zhangmen/" target="_top" aria-label="장문 LR13 상세 설명"><title>장문 LR13 · 옆배, 열한째 갈비뼈끝(free extremity of the 11th rib)의 아래쪽.</title><path class="callout" d="M332 380 L512 375"/><circle cx="332" cy="380" r="7"/><text x="520" y="380">LR13</text></a><a id="GB25" class="point" href="/acupuncture/points/gb25/" target="_top" aria-label="경문 GB25 상세 설명"><title>경문 GB25 · 옆배, 열두째 갈비뼈끝(free extremity of the 12th rib)의 아래쪽.</title><path class="callout" d="M364 397 L512 414"/><circle cx="364" cy="397" r="7"/><text x="520" y="419">GB25</text></a><a id="GB26" class="point" href="/acupuncture/points/gb26/" target="_top" aria-label="대맥 GB26 상세 설명"><title>대맥 GB26 · 옆배, 열한째 갈비뼈끝(free extremity of the 11th rib)의 아래쪽, 배꼽 (umbilicus) 중심과 같은 높이.</title><path class="callout" d="M332 419 L512 453"/><circle cx="332" cy="419" r="7"/><text x="520" y="458">GB26</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>