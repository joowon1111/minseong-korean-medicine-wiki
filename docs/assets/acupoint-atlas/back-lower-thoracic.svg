<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">등 아래쪽 · T9–T12</title><desc id="desc">간수·담수·비수·위수는 T9–T12 옆 1.5 B-cun, 혼문·양강·의사·위창은 같은 높이의 옆 3 B-cun입니다. T8에 해당 혈을 임의로 채워 넣지 않았습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">등 아래쪽 · T9–T12</text><path class="skin" d="M199 107 Q320 77 446 107 L452 552 Q320 576 187 552 Z"/><path class="bone" d="M270 121 L270 550"/><circle class="joint" cx="270" cy="135.0" r="6"/><path class="guide" d="M249 145.0 L429 145.0"/><text class="landmark" x="200" y="149.0">T8</text><circle class="joint" cx="270" cy="230.0" r="6"/><path class="guide" d="M249 240.0 L429 240.0"/><text class="landmark" x="200" y="244.0">T9</text><circle class="joint" cx="270" cy="325.0" r="6"/><path class="guide" d="M249 335.0 L429 335.0"/><text class="landmark" x="200" y="339.0">T10</text><circle class="joint" cx="270" cy="420.0" r="6"/><path class="guide" d="M249 430.0 L429 430.0"/><text class="landmark" x="200" y="434.0">T11</text><circle class="joint" cx="270" cy="515.0" r="6"/><path class="guide" d="M249 525.0 L429 525.0"/><text class="landmark" x="200" y="529.0">T12</text><text class="landmark" x="219" y="604">가시돌기 아래 높이 · 오른쪽만 표시</text><text class="landmark" x="300" y="93">1.5 · 3 B-cun</text><a id="BL18" class="point" href="/acupuncture/points/bl18-ganshu/" target="_top" aria-label="간수 BL18 상세 설명"><title>간수 BL18 · 위쪽 등부위, 아홉째 등뼈 가시돌기 (spinous process of the 9th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 240.0 L512 235.0"/><circle cx="330" cy="240.0" r="7"/><text x="520" y="240.0">BL18</text></a><a id="BL47" class="point" href="/acupuncture/points/bl47/" target="_top" aria-label="혼문 BL47 상세 설명"><title>혼문 BL47 · 위쪽 등부위, 아홉째 등뼈 가시돌기 (spinous process of the 9th thoracic vertebra) 아래모서리와 같은 높이, 뒤 정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 240.0 L512 274.0"/><circle cx="390" cy="240.0" r="7"/><text x="520" y="279.0">BL47</text></a><a id="BL19" class="point" href="/acupuncture/points/bl19/" target="_top" aria-label="담수 BL19 상세 설명"><title>담수 BL19 · 위쪽 등부위, 열째 등뼈 가시돌기 (spinous process of the 10th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 335.0 L512 330.0"/><circle cx="330" cy="335.0" r="7"/><text x="520" y="335.0">BL19</text></a><a id="BL48" class="point" href="/acupuncture/points/bl48/" target="_top" aria-label="양강 BL48 상세 설명"><title>양강 BL48 · 위쪽 등부위, 열째 등뼈 가시돌기 (spinous process of the 10th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 335.0 L512 369.0"/><circle cx="390" cy="335.0" r="7"/><text x="520" y="374.0">BL48</text></a><a id="BL20" class="point" href="/acupuncture/points/bl20-pishu/" target="_top" aria-label="비수 BL20 상세 설명"><title>비수 BL20 · 위쪽 등부위, 열한째 등뼈 가시돌기 (spinous process of the 11th thoracic vertebra) 아래모서리와 같은 높이, 뒤 정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 430.0 L512 425.0"/><circle cx="330" cy="430.0" r="7"/><text x="520" y="430.0">BL20</text></a><a id="BL49" class="point" href="/acupuncture/points/bl49/" target="_top" aria-label="의사 BL49 상세 설명"><title>의사 BL49 · 위쪽 등부위, 열한째 등뼈 가시돌기 (spinous process of the 11th thoracic vertebra) 아래모서리와 같은 높이, 뒤 정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 430.0 L512 464.0"/><circle cx="390" cy="430.0" r="7"/><text x="520" y="469.0">BL49</text></a><a id="BL21" class="point" href="/acupuncture/points/bl21/" target="_top" aria-label="위수 BL21 상세 설명"><title>위수 BL21 · 위쪽 등부위, 열두째 등뼈 가시돌기 (spinous process of the 12th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 525.0 L512 520.0"/><circle cx="330" cy="525.0" r="7"/><text x="520" y="525.0">BL21</text></a><a id="BL50" class="point" href="/acupuncture/points/bl50/" target="_top" aria-label="위창 BL50 상세 설명"><title>위창 BL50 · 위쪽 등부위, 열두째 등뼈 가시돌기 (spinous process of the 12th thoracic vertebra) 아래모서리와 같은 높이, 뒤 정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 525.0 L512 559.0"/><circle cx="390" cy="525.0" r="7"/><text x="520" y="564.0">BL50</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>