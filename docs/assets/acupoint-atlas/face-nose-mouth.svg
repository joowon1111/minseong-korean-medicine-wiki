<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">코·입술·턱 주변</title><desc id="desc">영향은 콧방울 가쪽의 코입술고랑, 화료는 콧구멍 가쪽 아래 인중 중점 높이입니다. 수구는 기존 표준 위치 설명의 인중 중점 기준이며, 태단은 윗입술결절, 승장은 턱끝입술고랑입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">코·입술·턱 주변</text><path class="skin" d="M223 105 Q320 63 417 105 Q446 199 419 369 Q396 464 321 491 Q242 464 220 369 Q193 200 223 105 Z"/><path class="crease" d="M240 222 Q266 201 292 222 Q266 242 240 222 M347 222 Q372 201 398 222 Q372 242 347 222"/><circle class="joint" cx="267" cy="222" r="4"/><circle class="joint" cx="372" cy="222" r="4"/><path class="tendon" d="M239 197 Q267 184 291 197 M347 197 Q372 184 398 197"/><path class="crease" d="M315 229 L303 312 Q320 326 337 312 L325 229 M293 321 Q320 340 347 321"/><path class="crease" d="M278 377 Q320 360 362 377 Q320 393 278 377 M298 414 Q320 423 342 414"/><path class="guide" d="M372 168 L372 355"/><text class="landmark" x="168" y="530">정면 · 한쪽 짝혈만 표시</text><a id="GV25" class="point" href="/acupuncture/points/gv25/" target="_top" aria-label="소료 GV25 상세 설명"><title>소료 GV25 · 얼굴, 코끝.</title><path class="callout" d="M320 316 L512 311"/><circle cx="320" cy="316" r="7"/><text x="520" y="316">GV25</text></a><a id="LI20" class="point" href="/acupuncture/points/li20-yingxiang/" target="_top" aria-label="영향 LI20 상세 설명"><title>영향 LI20 · 얼굴, 코입술고랑(nasolabial sulcus) 위, 콧방울(ala of the nose) 가쪽모서리의 중점과 같은 높이.</title><path class="callout" d="M350 316 L512 350"/><circle cx="350" cy="316" r="7"/><text x="520" y="355">LI20</text></a><a id="LI19" class="point" href="/acupuncture/points/li19/" target="_top" aria-label="화료 LI19 상세 설명"><title>화료 LI19 · 얼굴, 인중 부위(philtrum)의 중점과 같은 높이, 콧구멍 가쪽모서리 아래 쪽.</title><path class="callout" d="M342 345 L512 389"/><circle cx="342" cy="345" r="7"/><text x="520" y="394">LI19</text></a><a id="GV26" class="point" href="/acupuncture/points/gv26-shuigou/" target="_top" aria-label="수구 GV26 상세 설명"><title>수구 GV26 · 얼굴, 인중 정중선(philtrum midline) 의 중점. ※참고 : 水溝(GV26)의 부위가 인중 정중선에서 위쪽으로부터 1/3과 아래쪽으로부터 2/3가 되는 지점이라는 의견도 있다.</title><path class="callout" d="M320 350 L512 428"/><circle cx="320" cy="350" r="7"/><text x="520" y="433">GV26</text></a><a id="GV27" class="point" href="/acupuncture/points/gv27/" target="_top" aria-label="태단 GV27 상세 설명"><title>태단 GV27 · 얼굴, 윗입술결절(tubercle of the upper lip)의 중점.</title><path class="callout" d="M320 372 L512 467"/><circle cx="320" cy="372" r="7"/><text x="520" y="472">GV27</text></a><a id="ST4" class="point" href="/acupuncture/points/st4/" target="_top" aria-label="지창 ST4 상세 설명"><title>지창 ST4 · 얼굴, 입꼬리에서 가쪽으로 0.4寸.</title><path class="callout" d="M373 377 L512 506"/><circle cx="373" cy="377" r="7"/><text x="520" y="511">ST4</text></a><a id="CV24" class="point" href="/acupuncture/points/cv24/" target="_top" aria-label="승장 CV24 상세 설명"><title>승장 CV24 · 얼굴, 턱끝입술고랑(mentolabial sulcus) 가운데의 오목한 곳.</title><path class="callout" d="M320 419 L512 545"/><circle cx="320" cy="419" r="7"/><text x="520" y="550">CV24</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>