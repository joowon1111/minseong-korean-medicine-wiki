<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">윗입술 안쪽 · 은교</title><desc id="desc">은교는 위입술주름띠와 위잇몸이 만나는 지점입니다. 얼굴 바깥의 태단·수구와 다른 면이므로 입안 확대도로 구분합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">윗입술 안쪽 · 은교</text><path class="skin" d="M154 243 Q320 142 486 243 L475 426 Q320 487 165 426 Z"/><path class="crease" d="M181 340 Q320 302 459 340"/><path class="tendon" d="M319 214 L319 320"/><rect class="joint" x="206" y="346" width="39" height="57" rx="9"/><rect class="joint" x="252" y="346" width="39" height="57" rx="9"/><rect class="joint" x="300" y="346" width="39" height="57" rx="9"/><rect class="joint" x="348" y="346" width="39" height="57" rx="9"/><rect class="joint" x="394" y="346" width="39" height="57" rx="9"/><text class="landmark" x="199" y="140">윗입술을 들어 올린 안쪽 면</text><text class="landmark" x="369" y="271">위입술주름띠</text><text class="landmark" x="423" y="435">위 앞니</text><a id="GV28" class="point" href="/acupuncture/points/gv28/" target="_top" aria-label="은교 GV28 상세 설명"><title>은교 GV28 · 얼굴, 위입술주름띠(frenulum of the upper lip)와 위잇몸(upper gum)이 만나는 지점.</title><path class="callout" d="M320 320 L512 315"/><circle cx="320" cy="320" r="7"/><text x="520" y="320">GV28</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>