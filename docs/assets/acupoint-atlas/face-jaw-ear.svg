<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">턱관절·귀 앞쪽</title><desc id="desc">상관·하관은 광대활 중점의 위·아래입니다. 이문·청궁·청회는 귀 앞에서 위·가운데·아래로 구분하며, 협거는 아래턱뼈각 앞위, 대영은 교근 앞의 아래턱뼈 가장자리입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">턱관절·귀 앞쪽</text><path class="skin" d="M190 277 L213 246 Q207 129 290 104 Q383 81 431 144 Q460 221 435 318 L406 384 L399 491 L310 491 L320 402 L240 401 L224 360 L209 354 L219 330 L193 320 L213 297 Z"/><path class="skin" d="M348 269 Q378 248 390 282 L382 336 Q370 363 351 339 Q338 313 348 269 Z"/><path class="crease" d="M357 281 Q378 271 375 307 L359 326"/><path class="bone" d="M240 244 L330 267"/><path class="crease" d="M231 214 L261 210 M242 397 L320 402 L339 328"/><text class="landmark" x="205" y="558">앞쪽 ← · → 뒤쪽</text><a id="ST6" class="point" href="/acupuncture/points/st6/" target="_top" aria-label="협거 ST6 상세 설명"><title>협거 ST6 · 얼굴, 턱뼈각(angle of the mandible)에서 위앞쪽으로 1寸.</title><path class="callout" d="M307 379 L88 374"/><circle cx="307" cy="379" r="7"/><text x="24" y="379">ST6</text></a><a id="ST5" class="point" href="/acupuncture/points/st5/" target="_top" aria-label="대영 ST5 상세 설명"><title>대영 ST5 · 얼굴, 턱뼈각(angle of the mandible)앞쪽, 깨물근(masseter muscle) 부착 부분 앞쪽 오목한 곳, 얼굴동맥(facial artery)이 뛰는 곳.</title><path class="callout" d="M282 399 L88 413"/><circle cx="282" cy="399" r="7"/><text x="24" y="418">ST5</text></a><a id="GB3" class="point" href="/acupuncture/points/gb3/" target="_top" aria-label="상관 GB3 상세 설명"><title>상관 GB3 · 머리, 광대활(zygomatic arch) 중점 위쪽의 오목한 곳.</title><path class="callout" d="M316 253 L512 248"/><circle cx="316" cy="253" r="7"/><text x="520" y="253">GB3</text></a><a id="TE22" class="point" href="/acupuncture/points/te22/" target="_top" aria-label="화료 TE22 상세 설명"><title>화료 TE22 · 머리, 관자놀이 머리카락경계선(temple hairline)의 뒤쪽, 귓바퀴뿌리(auricular root)의 앞쪽, 얕은관자동맥(superficial temporal artery)의 뒤쪽.</title><path class="callout" d="M327 270 L512 287"/><circle cx="327" cy="270" r="7"/><text x="520" y="292">TE22</text></a><a id="ST7" class="point" href="/acupuncture/points/st7/" target="_top" aria-label="하관 ST7 상세 설명"><title>하관 ST7 · 얼굴, 광대활(zygomatic arch) 아래모서리의 중점과 턱뼈패임(mandibularnotch) 사이의 오목한 곳.</title><path class="callout" d="M316 280 L512 326"/><circle cx="316" cy="280" r="7"/><text x="520" y="331">ST7</text></a><a id="TE21" class="point" href="/acupuncture/points/te21/" target="_top" aria-label="이문 TE21 상세 설명"><title>이문 TE21 · 얼굴, 귀구슬위패임(supratragic notch)과 아래턱뼈 관절돌기(condylar process of the mandible) 사이의 오목한 곳.</title><path class="callout" d="M338 289 L512 365"/><circle cx="338" cy="289" r="7"/><text x="520" y="370">TE21</text></a><a id="SI19" class="point" href="/acupuncture/points/si19/" target="_top" aria-label="청궁 SI19 상세 설명"><title>청궁 SI19 · 얼굴, 귀구슬(tragus) 중심의 앞모서리와 아래턱뼈 관절돌기(condylar process of the mandible) 사이의 오목한 곳.</title><path class="callout" d="M336 309 L512 404"/><circle cx="336" cy="309" r="7"/><text x="520" y="409">SI19</text></a><a id="GB2" class="point" href="/acupuncture/points/gb2/" target="_top" aria-label="청회 GB2 상세 설명"><title>청회 GB2 · 얼굴, 귀구슬사이패임(intertragic notch)과 아래턱뼈 관절돌기(condylar process of mandible) 사이의 오목한 곳.</title><path class="callout" d="M337 329 L512 443"/><circle cx="337" cy="329" r="7"/><text x="520" y="448">GB2</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>