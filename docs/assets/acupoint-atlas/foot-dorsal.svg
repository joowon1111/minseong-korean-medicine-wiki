<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">오른발 발등·발가락</title><desc id="desc">발가락 사이와 발허리뼈의 접합부를 구분합니다. 대돈은 엄지발톱 가쪽, 족규음은 넷째발톱 가쪽입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">오른발 발등·발가락</text><path class="skin" d="M290 573 Q267 506 230 392 Q206 325 180 217 Q166 161 182 131 Q198 106 219 127 L232 166 Q226 110 247 106 Q269 105 274 161 Q274 115 294 119 Q314 126 314 175 Q319 142 338 150 Q357 159 351 197 Q363 173 379 191 Q395 220 376 266 L388 348 Q394 421 370 503 L370 573 Z"/><path class="bone" d="M220 210 L281 430 M257 209 L300 430 M296 220 L319 430 M333 244 L337 430 M372 270 L355 430"/><text class="landmark" x="93" y="81">엄지 쪽 · 안쪽</text><text class="landmark" x="405" y="525">발목</text><path class="crease" d="M281 520 L378 520"/><a id="ST45" class="point" href="/acupuncture/points/st45/" target="_top" aria-label="여태 ST45 상세 설명"><title>여태 ST45</title><path class="callout" d="M269 136 L88 150"/><circle cx="269" cy="136" r="8"/><text x="24" y="155">ST45</text></a><a id="LR1" class="point" href="/acupuncture/points/lr1/" target="_top