<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">머리 표면 · 독맥</title><desc id="desc">신정·상성·신회·전정은 앞머리카락경계 위 0.5·1·2·3.5 B-cun입니다. 후정·강간은 뒷머리카락경계 위 5.5·4 B-cun입니다. 백회는 기존 머리·목 도해에서 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">머리 표면 · 독맥</text><path class="skin" d="M190 130 Q320 83 450 130 L450 537 Q320 592 190 537 Z"/><path class="guide" d="M320 125 L320 550"/><path class="crease" d="M190 150 L450 150 M190 525 L450 525"/><text class="landmark" x="215" y="104">머리 표면을 펼친 위치도</text><text class="landmark" x="232" y="139">앞머리카락 경계</text><text class="landmark" x="232" y="574">뒷머리카락 경계</text><text class="landmark" x="214" y="604">위→아래: 앞이마→뒤통수</text><a id="GV24" class="point" href="/acupuncture/points/gv24/" target="_top" aria-label="신정 GV24 상세 설명"><title>신정 GV24 · 머리, 앞정중선(anterior median line) 위, 前髮際(anterior hairline)에서 위쪽으로 0.5寸.</title><path class="callout" d="M320 165.6 L512 160.6"/><circle cx="320" cy="165.6" r="7"/><text x="520" y="165.6">GV24</text></a><a id="GV23" class="point" href="/acupuncture/points/gv23/" target="_top" aria-label="상성 GV23 상세 설명"><title>상성 GV23 · 머리, 앞정중선(anterior median line) 위, 前髮際(anterior hairline)에서 위쪽으로 1寸.</title><path class="callout" d="M320 181.2 L512 199.6"/><circle cx="320" cy="181.2" r="7"/><text x="520" y="204.6">GV23</text></a><a id="GV22" class="point" href="/acupuncture/points/gv22/" target="_top" aria-label="신회 GV22 상세 설명"><title>신회 GV22 · 머리, 앞정중선(anterior median line) 위, 前髮際(anterior hairline)에서 위쪽으로 2寸.</title><path class="callout" d="M320 212.5 L512 238.6"/><circle cx="320" cy="212.5" r="7"/><text x="520" y="243.6">GV22</text></a><a id="GV21" class="point" href="/acupuncture/points/gv21/" target="_top" aria-label="전정 GV21 상세 설명"><title>전정 GV21 · 머리, 앞정중선(anterior median line) 위, 前髮際(anterior hairline)에서 위쪽으로 3.5寸.</title><path class="callout" d="M320 259.4 L512 277.6"/><circle cx="320" cy="259.4" r="7"/><text x="520" y="282.6">GV21</text></a><a id="GV19" class="point" href="/acupuncture/points/gv19/" target="_top" aria-label="후정 GV19 상세 설명"><title>후정 GV19 · 머리, 뒤정중선(posterior median line) 위, 後髮際(posterior hairline)에서 위쪽으로 5.5寸.</title><path class="callout" d="M320 353.1 L512 348.1"/><circle cx="320" cy="353.1" r="7"/><text x="520" y="353.1">GV19</text></a><a id="GV18" class="point" href="/acupuncture/points/gv18/" target="_top" aria-label="강간 GV18 상세 설명"><title>강간 GV18 · 머리, 뒤정중선(posterior median line) 위, 後髮際(posterior hairline)에서 위쪽으로 4寸.</title><path class="callout" d="M320 400.0 L512 395.0"/><circle cx="320" cy="400.0" r="7"/><text x="520" y="400.0">GV18</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>