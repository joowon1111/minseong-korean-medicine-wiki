<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">귀 뒤·꼭지돌기 주변</title><desc id="desc">부백·두규음은 천충–완골 곡선의 위쪽 1/3·2/3입니다. 계맥·노식은 예풍–각손의 귀 뒤 곡선에서 아래쪽 1/3·2/3입니다. 완골은 꼭지돌기 뒤아래, 예풍은 귓불 뒤입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">귀 뒤·꼭지돌기 주변</text><path class="skin" d="M190 277 L213 246 Q207 129 290 104 Q383 81 431 144 Q460 221 435 318 L406 384 L399 491 L310 491 L320 402 L240 401 L224 360 L209 354 L219 330 L193 320 L213 297 Z"/><path class="skin" d="M348 269 Q378 248 390 282 L382 336 Q370 363 351 339 Q338 313 348 269 Z"/><path class="crease" d="M357 281 Q378 271 375 307 L359 326"/><path class="bone" d="M240 244 L330 267"/><path class="crease" d="M231 214 L261 210 M242 397 L320 402 L339 328"/><text class="landmark" x="205" y="558">앞쪽 ← · → 뒤쪽</text><circle class="joint" cx="400" cy="343" r="12"/><path class="guide" d="M397 171 Q447 253 409 365"/><path class="guide" d="M366 248 Q416 292 380 353"/><text class="landmark" x="405" y="393">꼭지돌기</text><a id="GB10" class="point" href="/acupuncture/points/gb10/" target="_top" aria-label="부백 GB10 상세 설명"><title>부백 GB10 · 머리, 꼭지돌기(mastoid process)의 위뒤쪽, 天衝(GB9)에서 完骨(GB12)을 연결하는 곡선에서 위로부터 1/3과 아래로부터 2/3가 되는 지점.</title><path class="callout" d="M425 236 L512 231"/><circle cx="425" cy="236" r="7"/><text x="520" y="236">GB10</text></a><a id="TE19" class="point" href="/acupuncture/points/te19/" target="_top" aria-label="노식 TE19 상세 설명"><title>노식 TE19 · 머리, 翳風(TE17)에서 角孫(TE20)을 연결하는 곡선에서 위쪽으로부터 1/3 과 아래쪽으로부터 2/3가 되는 지점.</title><path class="callout" d="M398 283 L512 278"/><circle cx="398" cy="283" r="7"/><text x="520" y="283">TE19</text></a><a id="GB11" class="point" href="/acupuncture/points/gb11/" target="_top" aria-label="두규음 GB11 상세 설명"><title>두규음 GB11 · 머리, 꼭지돌기(mastoid process) 위 뒤쪽, 天衝(GB9)에서 完骨(GB12)을 연결하는 곡선에서 위쪽으로부터 2/3과 아래쪽으로부터 1/3이 되는 지점.</title><path class="callout" d="M429 303 L512 317"/><circle cx="429" cy="303" r="7"/><text x="520" y="322">GB11</text></a><a id="TE18" class="point" href="/acupuncture/points/te18/" target="_top" aria-label="계맥 TE18 상세 설명"><title>계맥 TE18 · 머리, 꼭지돌기(mastoid process) 중심, 翳風(TE17)에서 角孫(TE20)을 연결하는 곡선에서 위쪽으로부터 2/3와 아래쪽으로부터 1/3이 되는 지점.</title><path class="callout" d="M398 320 L512 356"/><circle cx="398" cy="320" r="7"/><text x="520" y="361">TE18</text></a><a id="TE17" class="point" href="/acupuncture/points/te17-yifeng/" target="_top" aria-label="예풍 TE17 상세 설명"><title>예풍 TE17 · 목앞부위, 귓불(ear lobe)의 뒤쪽, 꼭지돌기(mastoid process) 아래끝의 앞쪽 오목한 곳.</title><path class="callout" d="M380 353 L512 395"/><circle cx="380" cy="353" r="7"/><text x="520" y="400">TE17</text></a><a id="GB12" class="point" href="/acupuncture/points/gb12/" target="_top" aria-label="완골 GB12 상세 설명"><title>완골 GB12 · 목 앞부위, 꼭지돌기(mastoid process) 아래뒤쪽의 오목한 곳.</title><path class="callout" d="M409 365 L512 434"/><circle cx="409" cy="365" r="7"/><text x="520" y="439">GB12</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>