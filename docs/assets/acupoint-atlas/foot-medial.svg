<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">발 안쪽·안쪽 발목</title><desc id="desc">대도·태백은 첫째 발허리발가락관절의 먼쪽·몸쪽입니다. 상구·조해·태계는 안쪽복사의 앞·아래·뒤에서 구분합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">발 안쪽·안쪽 발목</text><path class="skin" d="M333 121 L440 121 L444 288 Q457 329 441 376 Q363 410 301 396 Q251 382 179 389 L100 393 Q76 387 83 366 Q91 350 126 351 L207 330 Q249 298 302 291 L333 269 Z"/><circle class="joint" cx="347" cy="279" r="25"/><path class="tendon" d="M421 158 L423 344"/><circle class="joint" cx="278" cy="320" r="12"/><text class="landmark" x="306" y="245">안쪽복사</text><text class="landmark" x="449" y="347">뒤꿈치</text><text class="landmark" x="84" y="441">발가락 방향 ←</text><text class="landmark" x="210" y="304">발배뼈거친면</text><a id="SP5" class="point" href="/acupuncture/points/sp5/" target="_top" aria-label="상구 SP5 상세 설명"><title>상구 SP5</title><path class="callout" d="M310 299 L88 294"/><circle cx="310" cy="299" r="8"/><text x="24" y="299">SP5</text></a><a id="KI2" class="point" href="/acupuncture/points/ki2/" target="_top" aria-label="연곡 KI2 상세 설명"><title>연곡 KI2</title><path class="callout" d="M276 337 L88 332"/><circle cx="276" cy="337" r="8"/><text x="24" y="337">KI2</text></a><a id="SP1" class="point" href="/acupuncture/points/sp1/" target="_top" aria-label="은백 SP1 상세 설명"><title>은백 SP1</title><path class="callout" d="M97 361 L88 369"/><circle cx="97" cy="361" r="8"/><text x="24" y="374">SP1</text></a><a id="SP3" class="point" href="/acupuncture/points/sp3/" target="_top" aria-label="태백 SP3 상세 설명"><title>태백 SP3</title><path class="callout" d="M195 363 L88 406"/><circle cx="195" cy="363" r="8"/><text x="24" y="411">SP3</text></a><a id="SP2" class="point" href="/acupuncture/points/sp2/" target="_top" aria-label="대도 SP2 상세 설명"><title>대도 SP2</title><path class="callout" d="M157 367 L88 443"/><circle cx="157" cy="367" r="8"/><text x="24" y="448">SP2</text></a><a id="KI3" class="point" href="/acupuncture/points/ki3-taixi/" target="_top" aria-label="태계 KI3 상세 설명"><title>태계 KI3</title><path class="callout" d="M389 279 L501 274"/><circle cx="389" cy="279" r="8"/><text x="508" y="279">KI3</text></a><a id="KI6" class="point" href="/acupuncture/points/ki6-zhaohai/" target="_top" aria-label="조해 KI6 상세 설명"><title>조해 KI6</title><path class="callout" d="M347 326 L501 321"/><circle cx="347" cy="326" r="8"/><text x="508" y="326">KI6</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>