<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">앞가슴 · 신경</title><desc id="desc">수부는 빗장뼈 아래, 욱중부터 보랑까지는 제1–5갈비사이에서 정중선 옆 2 B-cun입니다. 갈비뼈 위가 아니라 갈비사이 높이를 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">앞가슴 · 신경</text><path class="skin" d="M285 97 L355 97 L369 123 L473 159 L463 535 Q320 592 177 535 L166 159 L271 123 Z"/><path class="guide" d="M320 128 L320 555"/><path class="bone" d="M186 153 Q253 187 320 160 Q387 187 455 153"/><path class="bone" d="M322 170 Q389 162 455 186"/><text class="landmark" x="109" y="189">1갈비사이</text><path class="bone" d="M322 217 Q389 209 455 233"/><text class="landmark" x="109" y="236">2갈비사이</text><path class="bone" d="M322 264 Q389 256 455 280"/><text class="landmark" x="109" y="283">3갈비사이</text><path class="bone" d="M322 311 Q389 303 455 327"/><text class="landmark" x="109" y="330">4갈비사이</text><path class="bone" d="M322 358 Q389 350 455 374"/><text class="landmark" x="109" y="377">5갈비사이</text><path class="bone" d="M322 405 Q389 397 455 421"/><text class="landmark" x="109" y="424">6갈비사이</text><path class="bone" d="M322 452 Q389 444 455 468"/><text class="landmark" x="109" y="471">7갈비사이</text><a id="KI27" class="point" href="/acupuncture/points/ki27/" target="_top" aria-label="수부 KI27 상세 설명"><title>수부 KI27 · 앞가슴부위, 빗장뼈(clavicle) 바로 아래쪽, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M362 153 L512 148"/><circle cx="362" cy="153" r="7"/><text x="520" y="153">KI27</text></a><a id="KI26" class="point" href="/acupuncture/points/ki26/" target="_top" aria-label="욱중 KI26 상세 설명"><title>욱중 KI26 · 앞가슴부위, 첫째 갈비사이공간(the 1st intercostal space), 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M362 185 L512 187"/><circle cx="362" cy="185" r="7"/><text x="520" y="192">KI26</text></a><a id="KI25" class="point" href="/acupuncture/points/ki25/" target="_top" aria-label="신장 KI25 상세 설명"><title>신장 KI25 · 앞가슴부위, 둘째 갈비사이공간(the 2nd intercostal space), 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M362 232 L512 227"/><circle cx="362" cy="232" r="7"/><text x="520" y="232">KI25</text></a><a id="KI24" class="point" href="/acupuncture/points/ki24/" target="_top" aria-label="영허 KI24 상세 설명"><title>영허 KI24 · 앞가슴부위, 셋째 갈비사이공간(the 3rd intercostal space), 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M362 279 L512 274"/><circle cx="362" cy="279" r="7"/><text x="520" y="279">KI24</text></a><a id="KI23" class="point" href="/acupuncture/points/ki23/" target="_top" aria-label="신봉 KI23 상세 설명"><title>신봉 KI23 · 앞가슴부위, 넷째 갈비사이공간(the 4th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M362 326 L512 321"/><circle cx="362" cy="326" r="7"/><text x="520" y="326">KI23</text></a><a id="KI22" class="point" href="/acupuncture/points/ki22/" target="_top" aria-label="보랑 KI22 상세 설명"><title>보랑 KI22 · 앞가슴부위, 다섯째 갈비사이공간(the 5th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M362 373 L512 368"/><circle cx="362" cy="373" r="7"/><text x="520" y="373">KI22</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>