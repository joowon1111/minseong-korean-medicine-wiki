<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">아래팔 뒷면 · 대장경·삼초경</title><desc id="desc">대장경은 노쪽면, 삼초경은 뼈사이 공간, 소장경은 자쪽면입니다. 회종은 지구와 같은 손목 위 3 B-cun 높이에서 자뼈 노쪽에 있습니다. 사독은 팔꿈치머리 아래 5 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">아래팔 뒷면 · 대장경·삼초경</text><path class="skin" d="M225 110 Q205 150 224 180 L240 560 L400 560 L416 180 Q435 150 415 110 Z"/><path class="crease" d="M225 150 L415 150"/><path class="crease" d="M240 545 L400 545"/><path class="bone" d="M268 180 L270 545 M366 180 L367 545"/><text class="landmark" x="249" y="91">팔꿈치 쪽</text><text class="landmark" x="260" y="590">손목주름</text><text class="landmark" x="107" y="121">노쪽</text><text class="landmark" x="436" y="121">자쪽</text><a id="LI9" class="point" href="/acupuncture/points/li9/" target="_top" aria-label="상렴 LI9 상세 설명"><title>상렴 LI9 · 아래팔 뒤가쪽면, 陽谿(LI5)와 曲池(LI11)를 연결하는 선 위, 팔오금주름(cubital crease)에서 아래쪽으로 3寸.</title><path class="callout" d="M242 249 L88 244"/><circle cx="242" cy="249" r="7"/><text x="24" y="249">LI9</text></a><a id="LI8" class="point" href="/acupuncture/points/li8/" target="_top" aria-label="하렴 LI8 상세 설명"><title>하렴 LI8 · 아래팔 뒤가쪽면, 陽谿(LI5)와 曲池(LI11)를 연결하는 선 위, 팔오금주름(cubital crease)에서 아래쪽으로 4寸.</title><path class="callout" d="M244 282 L88 283"/><circle cx="244" cy="282" r="7"/><text x="24" y="288">LI8</text></a><a id="LI7" class="point" href="/acupuncture/points/li7/" target="_top" aria-label="온류 LI7 상세 설명"><title>온류 LI7 · 아래팔 뒤가쪽면, 陽谿(LI5)와 曲池(LI11)를 연결하는 선 위, 손등 쪽 손목주름(dorsal wrist crease)에서 위쪽으로 5寸.</title><path class="callout" d="M250 380 L88 375"/><circle cx="250" cy="380" r="7"/><text x="24" y="380">LI7</text></a><a id="LI6" class="point" href="/acupuncture/points/li6/" target="_top" aria-label="편력 LI6 상세 설명"><title>편력 LI6 · 아래 팔 뒤가쪽면, 陽谿(LI5)와 曲池(LI11)를 연결하는 선 위, 손등 쪽 손목주름(the dorsal wrist crease)에서 위쪽으로 3寸.</title><path class="callout" d="M253 446 L88 441"/><circle cx="253" cy="446" r="7"/><text x="24" y="446">LI6</text></a><a id="TE9" class="point" href="/acupuncture/points/te9/" target="_top" aria-label="사독 TE9 상세 설명"><title>사독 TE9 · 아래팔 뒤쪽면, 자뼈와 노뼈 뼈사이공간(interosseous space between theradius and the ulna)의 중점, 팔꿈치머리 융기(prominence of the olecranon)에서 먼 쪽으로 5寸.</title><path class="callout" d="M320 315 L512 310"/><circle cx="320" cy="315" r="7"/><text x="520" y="315">TE9</text></a><a id="SI7" class="point" href="/acupuncture/points/si7/" target="_top" aria-label="지정 SI7 상세 설명"><title>지정 SI7 · 아래팔 뒤 안쪽면, 자뼈 안쪽모서리(medial border of the ulna)와 자쪽손목굽힘근(flexor carpi ulnaris muscle)의 사이, 손등 쪽 손목주름(dorsal wrist crease)에서 몸 쪽으로 5寸.</title><path class="callout" d="M388 380 L512 375"/><circle cx="388" cy="380" r="7"/><text x="520" y="380">SI7</text></a><a id="TE8" class="point" href="/acupuncture/points/te8/" target="_top" aria-label="삼양락 TE8 상세 설명"><title>삼양락 TE8 · 아래팔 뒤쪽면, 자뼈와 노뼈 뼈사이공간(interosseous space between the radius and the ulna)의 중점, 손등쪽손목주름(dorsal wrist crease)에서 몸 쪽으로 4寸.</title><path class="callout" d="M320 413 L512 414"/><circle cx="320" cy="413" r="7"/><text x="520" y="419">TE8</text></a><a id="TE7" class="point" href="/acupuncture/points/te7/" target="_top" aria-label="회종 TE7 상세 설명"><title>회종 TE7 · 아래팔 뒤쪽면, 자뼈(ulna)의 바로 노쪽, 손등 쪽 손목주름(dorsal wrist crease)에서 몸 쪽으로 3寸.</title><path class="callout" d="M351 446 L512 453"/><circle cx="351" cy="446" r="7"/><text x="520" y="458">TE7</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>