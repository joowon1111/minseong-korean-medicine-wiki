<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" role="img" aria-labelledby="title desc"><title id="title">오른손 손등 — 합곡 LI4</title><desc id="desc">엄지가 그림 왼쪽인 오른손 손등. 둘째 손허리뼈 중점의 엄지 쪽에 합곡을 표시합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#233c49;font-size:15px}.skin{fill:#f8ede3;stroke:#b79179;stroke-width:2}.bone{fill:none;stroke:#d1b49b;stroke-width:12;stroke-linecap:round}.tendon{fill:none;stroke:#ae8f76;stroke-width:6}.guide{fill:none;stroke:#728997;stroke-width:1.5;stroke-dasharray:5 4}.mark circle{fill:#007e83;stroke:#fff;stroke-width:3}.mark text{fill:#00666c;font-weight:700}.mark:hover circle,.mark:focus circle{fill:#af5018;stroke:#233c49}.mark:focus{outline:2px solid #007e83}</style><rect width="540" height="460" rx="18" fill="#fff"/><text x="24" y="32" style="font-size:19px;font-weight:700">오른손 · 손등</text><path class="skin" d="M223 400 L221 356 Q176 333 149 288 L112 235 Q104 217 117 211 Q130 205 143 222 L183 254 Q195 259 197 237 L189 112 Q189 95 202 94 Q215 94 217 111 L228 207 L230 76 Q230 59 244 59 Q258 59 258 77 L264 205 L273 94 Q274 77 288 79 Q301 81 300 99 L298 216 L313 149 Q318 133 331 137 Q344 142 339 160 L324 280 Q322 326 300 357 L301 400 Z"/><path class="bone" d="M204 225 L247 345 M254 224 L268 344 M287 233 L282 344 M316 246 L297 344 M166 281 L229 350"/><path class="guide" d="M207 285 L225 285"/><text x="24" y="85">엄지 쪽 · 노쪽</text><text x="352" y="220">둘째 손허리뼈</text><path class="guide" d="M348 225 L207 230"/><text x="338" y="359">손목</text><a class="mark" href="/acupuncture/points/li4-hegu/" target="_top" aria-label="합곡 LI4 상세 설명"><title>합곡 LI4 상세 설명</title><circle cx="211" cy="285" r="11"/><path d="M211 285 L38 331" class="guide"/><text x="38" y="337">합곡 LI4</text></a><text x="24" y="437" style="font-size:12px">민성 한의학 아카이브 · 위치 관계를 단순화한 교육용 도해</text></svg>