<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">오른손 손등·손가락</title><desc id="desc">손톱 뿌리각·손가락 사이·손허리손가락관절의 앞뒤를 구분합니다. 중충은 손가락 끝 중심 기준입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">오른손 손등·손가락</text><path class="skin" d="M255 570 L254 488 Q199 453 157 381 L101 302 Q88 280 105 270 Q124 260 144 290 L198 337 Q215 345 216 307 L200 144 Q199 122 217 121 Q236 121 239 145 L255 280 L258 94 Q258 69 277 69 Q297 69 297 95 L304 279 L317 121 Q319 99 338 104 Q355 107 353 132 L350 296 L372 205 Q379 183 397 191 Q414 200 407 224 L385 386 Q383 449 350 489 L352 570 Z"/><path class="bone" d="M226 303 L285 474 M291 302 L309 474 M336 315 L329 474 M380 337 L348 474 M178 374 L260 483"/><text class="landmark" x="95" y="102">엄지 쪽 · 노쪽</text><text class="landmark" x="375" y="552">손목</text><a id="PC9" class="point" href="/acupuncture/points/pc9/" target="_top" aria-label="중충 PC9 상세 설명"><title>중충 PC9</title><path class="callout" d="M277 69 L88 150"/><circle cx="277" cy="69" r="8"/><text x="24" y="155">PC9</text></a><a id="LI1" class="point" href="/acupuncture/po