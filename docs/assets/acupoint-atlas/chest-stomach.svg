<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">앞가슴 · 위경·늑간 높이</title><desc id="desc">기호는 빗장뼈 아래, 고방·옥예·응창은 제1·2·3갈비사이, 유근은 제5갈비사이의 정중선 옆 4 B-cun입니다. 유중은 유두 중심이며, 제4갈비사이 높이의 도식으로 표시했습니다. 기문·일월은 제6·7갈비사이입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">앞가슴 · 위경·늑간 높이</text><path class="skin" d="M285 97 L355 97 L369 123 L473 159 L463 535 Q320 592 177 535 L166 159 L271 123 Z"/><path class="guide" d="M320 128 L320 555"/><path class="bone" d="M186 153 Q253 187 320 160 Q387 187 455 153"/><path class="bone" d="M322 170 Q389 162 455 186"/><text class="landmark" x="109" y="189">1갈비사이</text><path class="bone" d="M322 217 Q389 209 455 233"/><text class="landmark" x="109" y="236">2갈비사이</text><path class="bone" d="M322 264 Q389 256 455 280"/><text class="landmark" x="109" y="283">3갈비사이</text><path class="bone" d="M322 311 Q389 303 455 327"/><text class="landmark" x="109" y="330">4갈비사이</text><path class="bone" d="M322 358 Q389 350 455 374"/><text class="landmark" x="109" y="377">5갈비사이</text><path class="bone" d="M322 405 Q389 397 455 421"/><text class="landmark" x="109" y="424">6갈비사이</text><path class="bone" d="M322 452 Q389 444 455 468"/><text class="landmark" x="109" y="471">7갈비사이</text><circle class="joint" cx="404" cy="326" r="10"/><a id="ST13" class="point" href="/acupuncture/points/st13/" target="_top" aria-label="기호 ST13 상세 설명"><title>기호 ST13 · 앞가슴부위, 빗장뼈(clavicle) 아래쪽, 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 153 L512 148"/><circle cx="404" cy="153" r="7"/><text x="520" y="153">ST13</text></a><a id="ST14" class="point" href="/acupuncture/points/st14/" target="_top" aria-label="고방 ST14 상세 설명"><title>고방 ST14 · 앞가슴부위, 첫째 갈비사이공간(the 1st intercostal space), 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 185 L512 187"/><circle cx="404" cy="185" r="7"/><text x="520" y="192">ST14</text></a><a id="ST15" class="point" href="/acupuncture/points/st15/" target="_top" aria-label="옥예 ST15 상세 설명"><title>옥예 ST15 · 앞가슴부위, 둘째 갈비사이공간(the 2nd intercostal space), 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 232 L512 227"/><circle cx="404" cy="232" r="7"/><text x="520" y="232">ST15</text></a><a id="ST16" class="point" href="/acupuncture/points/st16/" target="_top" aria-label="응창 ST16 상세 설명"><title>응창 ST16 · 앞가슴부위, 셋째 갈비사이공간(the 3rd intercostal space), 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 279 L512 274"/><circle cx="404" cy="279" r="7"/><text x="520" y="279">ST16</text></a><a id="ST17" class="point" href="/acupuncture/points/st17/" target="_top" aria-label="유중 ST17 상세 설명"><title>유중 ST17 · 앞가슴부위, 젖꼭지(nipple)의 중심.</title><path class="callout" d="M404 326 L512 321"/><circle cx="404" cy="326" r="7"/><text x="520" y="326">ST17</text></a><a id="ST18" class="point" href="/acupuncture/points/st18/" target="_top" aria-label="유근 ST18 상세 설명"><title>유근 ST18 · 앞가슴부위, 다섯째 갈비사이공간(the 5th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 373 L512 368"/><circle cx="404" cy="373" r="7"/><text x="520" y="373">ST18</text></a><a id="LR14" class="point" href="/acupuncture/points/lr14-qimen/" target="_top" aria-label="기문 LR14 상세 설명"><title>기문 LR14 · 앞가슴부위, 여섯째 갈비사이공간(the 6th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 420 L512 415"/><circle cx="404" cy="420" r="7"/><text x="520" y="420">LR14</text></a><a id="GB24" class="point" href="/acupuncture/points/gb24/" target="_top" aria-label="일월 GB24 상세 설명"><title>일월 GB24 · 앞가슴부위, 일곱째 갈비사이공간(the 7th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M404 467 L512 462"/><circle cx="404" cy="467" r="7"/><text x="520" y="467">GB24</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>