<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">머리·목·어깨 뒷면</title><desc id="desc">백회는 머리 꼭대기 정중선, 풍지는 뒤통수뼈 아래 가쪽입니다. 대추는 C7 아래, 견정은 C7과 어깨봉우리 사이입니다. 짝혈은 한쪽만 표시했습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">머리·목·어깨 뒷면</text><ellipse class="skin" cx="320" cy="190" rx="82" ry="108"/><path class="skin" d="M277 285 L275 351 L159 391 L132 550 L507 550 L484 391 L365 351 L364 285"/><path class="bone" d="M249 262 Q320 282 391 262"/><path class="guide" d="M320 289 L320 528"/><text class="landmark" x="425" y="244">뒤통수뼈</text><text class="landmark" x="75" y="416">어깨봉우리</text><text class="landmark" x="348" y="364">C7 아래</text><a id="GV20" class="point" href="/acupuncture/points/gv20-baihui/" target="_top" aria-label="백회 GV20 상세 설명"><title>백회 GV20</title><path class="callout" d="M320 82 L501 150"/><circle cx="320" cy="82" r="8"/><text x="508" y="155">GV20</text></a><a id="GB20" class="point" href="/acupuncture/points/gb20-fengchi/" target="_top" aria-label="풍지(風池) GB20 상세 설명"><title>풍지(風池) GB20</title><path class="callout" d="M363 284 L501 279"/><circle cx="363" cy="284" r="8"/><text x="508" y="284">GB20</text></a><a id="GV14" class="point" href="/acupuncture/points/gv14-dazhui/" target="_top" aria-label="대추 GV14 상세 설명"><title>대추 GV14</title><path class="callout" d="M320 360 L501 355"/><circle cx="320" cy="360" r="8"/><text x="508" y="360">GV14</text></a><a id="GB21" class="point" href="/acupuncture/points/gb21-jianjing/" target="_top" aria-label="견정 GB21 상세 설명"><title>견정 GB21</title><path class="callout" d="M402 371 L501 392"/><circle cx="402" cy="371" r="8"/><text x="508" y="397">GB21</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>