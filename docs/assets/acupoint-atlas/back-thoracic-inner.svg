<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">등 위쪽 · 방광경 안쪽 선</title><desc id="desc">대저–격수는 T1–T7 가시돌기 아래 높이에서 뒤정중선 옆 1.5 B-cun입니다. 혈 이름의 순서와 척추 번호가 같지는 않으므로 표시된 분절을 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">등 위쪽 · 방광경 안쪽 선</text><path class="skin" d="M199 107 Q320 77 446 107 L452 552 Q320 576 187 552 Z"/><path class="bone" d="M270 121 L270 550"/><circle class="joint" cx="270" cy="135.0" r="6"/><path class="guide" d="M249 145.0 L429 145.0"/><text class="landmark" x="200" y="149.0">T1</text><circle class="joint" cx="270" cy="198.33333333333334" r="6"/><path class="guide" d="M249 208.33333333333334 L429 208.33333333333334"/><text class="landmark" x="200" y="212.33333333333334">T2</text><circle class="joint" cx="270" cy="261.6666666666667" r="6"/><path class="guide" d="M249 271.6666666666667 L429 271.6666666666667"/><text class="landmark" x="200" y="275.6666666666667">T3</text><circle class="joint" cx="270" cy="325.0" r="6"/><path class="guide" d="M249 335.0 L429 335.0"/><text class="landmark" x="200" y="339.0">T4</text><circle class="joint" cx="270" cy="388.33333333333337" r="6"/><path class="guide" d="M249 398.33333333333337 L429 398.33333333333337"/><text class="landmark" x="200" y="402.33333333333337">T5</text><circle class="joint" cx="270" cy="451.6666666666667" r="6"/><path class="guide" d="M249 461.6666666666667 L429 461.6666666666667"/><text class="landmark" x="200" y="465.6666666666667">T6</text><circle class="joint" cx="270" cy="515.0" r="6"/><path class="guide" d="M249 525.0 L429 525.0"/><text class="landmark" x="200" y="529.0">T7</text><text class="landmark" x="219" y="604">가시돌기 아래 높이 · 오른쪽만 표시</text><text class="landmark" x="316" y="93">옆 1.5 B-cun</text><a id="BL11" class="point" href="/acupuncture/points/bl11/" target="_top" aria-label="대저 BL11 상세 설명"><title>대저 BL11 · 위쪽 등부위, 첫째 등뼈 가시돌기(spinous process of the 1st thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 145.0 L512 145"/><circle cx="330" cy="145.0" r="7"/><text x="520" y="150">BL11</text></a><a id="BL12" class="point" href="/acupuncture/points/bl12/" target="_top" aria-label="풍문 BL12 상세 설명"><title>풍문 BL12 · 위쪽 등부위, 둘째 등뼈 가시돌기(spinous process of the 2nd thoracic vertebra) 아래모서리와 같은 높이,뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 208.3 L512 203.3"/><circle cx="330" cy="208.3" r="7"/><text x="520" y="208.3">BL12</text></a><a id="BL13" class="point" href="/acupuncture/points/bl13-feishu/" target="_top" aria-label="폐수 BL13 상세 설명"><title>폐수 BL13 · 위쪽 등부위, 셋째 등뼈 가시돌기(spinous process of the 3rd thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 271.7 L512 266.7"/><circle cx="330" cy="271.7" r="7"/><text x="520" y="271.7">BL13</text></a><a id="BL14" class="point" href="/acupuncture/points/bl14/" target="_top" aria-label="궐음수 BL14 상세 설명"><title>궐음수 BL14 · 위쪽 등부위, 넷째 등뼈 가시돌기 (spinous process of the 4th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 335.0 L512 330.0"/><circle cx="330" cy="335.0" r="7"/><text x="520" y="335.0">BL14</text></a><a id="BL15" class="point" href="/acupuncture/points/bl15/" target="_top" aria-label="심수 BL15 상세 설명"><title>심수 BL15 · 위쪽 등부위, 다섯째등뼈가시돌기 (spinous process of the 5th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 398.3 L512 393.3"/><circle cx="330" cy="398.3" r="7"/><text x="520" y="398.3">BL15</text></a><a id="BL16" class="point" href="/acupuncture/points/bl16/" target="_top" aria-label="독수 BL16 상세 설명"><title>독수 BL16 · 위쪽 등부위, 여섯째 등뼈 가시돌기 (spinous process of the 6th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 461.7 L512 456.7"/><circle cx="330" cy="461.7" r="7"/><text x="520" y="461.7">BL16</text></a><a id="BL17" class="point" href="/acupuncture/points/bl17-geshu/" target="_top" aria-label="격수 BL17 상세 설명"><title>격수 BL17 · 위쪽 등부위, 일곱째 등뼈 가시돌기 (spinous process of the 7th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 525.0 L512 520.0"/><circle cx="330" cy="525.0" r="7"/><text x="520" y="525.0">BL17</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>