<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">발등 · 충양·지오회</title><desc id="desc">충양은 둘째 발허리뼈바닥과 중간쐐기뼈 사이, 지오회는 넷째·다섯째 발허리뼈 사이에서 넷째 발허리발가락관절 몸쪽입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">발등 · 충양·지오회</text><path class="skin" d="M290 573 Q267 506 230 392 Q206 325 180 217 Q166 161 182 131 Q198 106 219 127 L232 166 Q226 110 247 106 Q269 105 274 161 Q274 115 294 119 Q314 126 314 175 Q319 142 338 150 Q357 159 351 197 Q363 173 379 191 Q395 220 376 266 L388 348 Q394 421 370 503 L370 573 Z"/><path class="bone" d="M220 210 L281 430 M257 209 L300 430 M296 220 L319 430 M333 244 L337 430 M372 270 L355 430"/><text class="landmark" x="93" y="81">엄지 쪽 · 안쪽</text><text class="landmark" x="405" y="525">발목</text><path class="crease" d="M281 520 L378 520"/><a id="ST42" class="point" href="/acupuncture/points/st42-chongyang/" target="_top" aria-label="충양 ST42 상세 설명"><title>충양 ST42 · 발등의 둘째 발허리뼈(the 2nd metatarsal bone) 바닥과 중간쐐기뼈(intermediate cuneiform bone)의 관절부위에 해당되며, 발등동맥(dorsalis pedis artery)이 뛰는 곳에 취혈함.</title><path class="callout" d="M299 424 L88 419"/><circle cx="299" cy="424" r="7"/><text x="24" y="424">ST42</text></a><a id="GB42" class="point" href="/acupuncture/points/gb42/" target="_top" aria-label="지오회 GB42 상세 설명"><title>지오회 GB42 · 발등, 넷째와 다섯째 발허리뼈(the 4th and 5th metatarsal bones) 사이, 넷째 발허리발가락관절(the 4th metatarsophalangeal joint) 몸 쪽 오목한 곳.</title><path class="callout" d="M349 294 L512 289"/><circle cx="349" cy="294" r="7"/><text x="520" y="294">GB42</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>