<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">회음 · 회음·장강</title><desc id="desc">회음은 항문과 남성의 음낭 뒤모서리 또는 여성의 뒤 대음순연결 사이 중점입니다. 장강은 항문과 꼬리뼈끝 사이 중점입니다. 성별 해부 형태를 합성한 실물도가 아니라 표지 사이의 관계도입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">회음 · 회음·장강</text><path class="skin" d="M202 138 Q320 96 438 138 L446 473 Q320 550 194 473 Z"/><path class="guide" d="M320 161 L320 495"/><ellipse class="joint" cx="320" cy="201" rx="52" ry="16"/><circle class="joint" cx="320" cy="354" r="22"/><path class="bone" d="M308 465 L320 443 L332 465"/><text class="landmark" x="182" y="109">회음의 표지 관계 · 아래에서 보기</text><text class="landmark" x="113" y="182">음낭 뒤모서리 / 뒤 대음순연결</text><text class="landmark" x="388" y="359">항문</text><text class="landmark" x="362" y="470">꼬리뼈끝</text><text class="landmark" x="227" y="597">위: 앞쪽 · 아래: 뒤쪽</text><a id="CV1" class="point" href="/acupuncture/points/cv1/" target="_top" aria-label="회음 CV1 상세 설명"><title>회음 CV1 · 회음부위(perineal region), 남성은 항문(anus)과 음낭 뒤모서리(posterior border of the scrotum)를 연결하는 선의 중점, 여성은 항문(anus)과 뒤 대음순연결(posterior commissure of labium majoris)을 연결하는 선의 중점.</title><path class="callout" d="M320 277.5 L512 272.5"/><circle cx="320" cy="277.5" r="7"/><text x="520" y="277.5">CV1</text></a><a id="GV1" class="point" href="/acupuncture/points/gv1/" target="_top" aria-label="장강 GV1 상세 설명"><title>장강 GV1 · 회음부위(perineal region), 꼬리뼈(coccyx) 아래쪽, 꼬리뼈끝과 항문(anus)을 연결하는 선의 중점.</title><path class="callout" d="M320 398.5 L512 393.5"/><circle cx="320" cy="398.5" r="7"/><text x="520" y="398.5">GV1</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>