<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">어깨봉우리 주변</title><desc id="desc">견우는 어깨봉우리 앞과 위팔뼈 큰결절 사이, 견료는 그 뒤쪽입니다. 거골은 빗장뼈 봉우리끝과 어깨뼈가시 사이입니다. 앞뒤 관계를 펼친 도해입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">어깨봉우리 주변</text><path class="skin" d="M220 138 L299 138 L321 191 L430 218 Q475 251 439 337 L417 540 L318 540 L313 322 L208 356 Z"/><path class="bone" d="M287 199 L402 224"/><path class="bone" d="M344 230 L423 235"/><ellipse class="joint" cx="413" cy="277" rx="22" ry="29"/><text class="landmark" x="134" y="130">목 쪽</text><text class="landmark" x="433" y="212">어깨봉우리</text><text class="landmark" x="201" y="397">앞 ← · → 뒤</text><a id="LI16" class="point" href="/acupuncture/points/li16/" target="_top" aria-label="거골 LI16 상세 설명"><title>거골 LI16 · 팔이음뼈(shoulder girdle), 빗장뼈 봉우리끝(acromial end of the clavicle)과 어깨뼈가시(spine of the scapula)사이의 오목한 곳.</title><path class="callout" d="M348 208 L512 203"/><circle cx="348" cy="208" r="7"/><text x="520" y="208">LI16</text></a><a id="TE14" class="point" href="/acupuncture/points/te14/" target="_top" aria-label="견료 TE14 상세 설명"><title>견료 TE14 · 팔이음뼈(shoulder girdle), 봉우리각(acromial angle)과 위팔뼈 큰결절(greater tubercle of the humerus) 사이의 오목한 곳.</title><path class="callout" d="M442 266 L512 261"/><circle cx="442" cy="266" r="7"/><text x="520" y="266">TE14</text></a><a id="LI15" class="point" href="/acupuncture/points/li15-jianyu/" target="_top" aria-label="견우 LI15 상세 설명"><title>견우 LI15 · 팔이음뼈(shoulder girdle), 어깨뼈봉우리(acromion) 가쪽모서리의 앞쪽 끝과 위팔뼈 큰결절(greater tubercle of the humerus) 사이의 오목한 곳.</title><path class="callout" d="M383 267 L512 300"/><circle cx="383" cy="267" r="7"/><text x="520" y="305">LI15</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>