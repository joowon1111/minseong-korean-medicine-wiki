<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">오른쪽 무릎·종아리 앞면</title><desc id="desc">독비는 무릎인대 가쪽, 족삼리·상거허는 그 아래 3·6 B-cun입니다. 양릉천은 종아리뼈머리 앞아래, 혈해는 무릎뼈 위 안쪽입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">오른쪽 무릎·종아리 앞면</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z"/><ellipse class="joint" cx="313" cy="208" rx="42" ry="44"/><path class="bone" d="M313 253 L310 570"/><path class="bone" d="M355 296 L367 559"/><text class="landmark" x="80" y="111">안쪽</text><text class="landmark" x="436" y="111">가쪽</text><text class="landmark" x="436" y="216">무릎뼈</text><text class="landmark" x="78" y="521">정강뼈</text><text class="landmark" x="439" y="505">종아리뼈</text><a id="SP10" class="point" href="/acupuncture/points/sp10-xuehai/" target="_top" aria-label="혈해 SP10 상세 설명"><title>혈해 SP10</title><path class="callout" d="M246 143 L88 150"/><circle cx="246" cy="143" r="8"/><text x="24" y="155">SP10</text></a><a id="ST35" class="point" href="/acupuncture/points/st35-dubi/" target="_top" aria-label="독비 ST35 상세 설명"><title>독비 ST35</title><path class="callout" d="M347 262 L501 257"/><circle cx="347" cy="262" r="8"/><text x="508" y="262">ST35</text></a><a id="GB34" class="point" href="/acupuncture/points/gb34-yanglingquan/" target="_top" aria-label="양릉천 GB34 상세 설명"><title>양릉천 GB34</title><path class="callout" d="M389 298 L501 294"/><circle cx="389" cy="298" r="8"/><text x="508" y="299">GB34</text></a><a id="ST36" class="point" href="/acupuncture/points/st36-zusanli/" target="_top" aria-label="족삼리 ST36 상세 설명"><title>족삼리 ST36</title><path class="callout" d="M346 322 L501 331"/><circle cx="346" cy="322" r="8"/><text x="508" y="336">ST36</text></a><a id="ST37" class="point" href="/acupuncture/points/st37-shangjuxu/" target="_top" aria-label="상거허 ST37 상세 설명"><title>상거허 ST37</title><path class="callout" d="M346 382 L501 377"/><circle cx="346" cy="382" r="8"/><text x="508" y="382">ST37</text></a><a id="ST40" class="point" href="/acupuncture/points/st40-fenglong/" target="_top" aria-label="풍륭 ST40 상세 설명"><title>풍륭 ST40</title><path class="callout" d="M377 422 L501 417"/><circle cx="377" cy="422" r="8"/><text x="508" y="422">ST40</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>