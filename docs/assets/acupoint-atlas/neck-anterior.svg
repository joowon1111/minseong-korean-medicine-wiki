<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">목 앞면 · 연골·목빗근</title><desc id="desc">인영·부돌·천창은 방패연골 위모서리 높이에서 목빗근 앞·사이·뒤입니다. 수돌·천정은 반지연골 높이의 앞·뒤, 천돌은 목아래패임 중심입니다. 표면 표지이며 혈관·기도의 깊이는 나타내지 않습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">목 앞면 · 연골·목빗근</text><path class="skin" d="M249 95 L391 95 L399 177 L447 476 L467 545 L173 545 L193 476 L241 177 Z"/><path class="tendon" d="M393 162 L346 491 M379 174 L408 491"/><path class="bone" d="M200 495 Q250 515 300 496 M337 496 Q391 516 444 495"/><path class="bone" d="M294 300 L343 300 M300 367 L339 367"/><path class="bone" d="M289 244 L347 244"/><text class="landmark" x="96" y="304">방패연골 위</text><text class="landmark" x="99" y="371">반지연골</text><text class="landmark" x="140" y="245">목뿔뼈</text><text class="landmark" x="256" y="598">목 앞면 · 목빗근 두 갈래</text><a id="CV23" class="point" href="/acupuncture/points/cv23/" target="_top" aria-label="염천 CV23 상세 설명"><title>염천 CV23 · 목 앞부위, 앞정중선(anterior median line) 위, 방패연골(thyroid cartilage) 위모서리 위쪽, 목뿔뼈(hyoid bone) 위쪽의 오목한 곳.</title><path class="callout" d="M320 230 L88 225"/><circle cx="320" cy="230" r="7"/><text x="24" y="230">CV23</text></a><a id="LI18" class="point" href="/acupuncture/points/li18/" target="_top" aria-label="부돌 LI18 상세 설명"><title>부돌 LI18 · 목 앞부위, 방패연골(thyriod cartilage) 위모서리와 같은 높이, 목빗근(sternocleidomastoid muscle)의 앞모서리와 뒤모서리의 사이.</title><path class="callout" d="M370 300 L88 295"/><circle cx="370" cy="300" r="7"/><text x="24" y="300">LI18</text></a><a id="ST10" class="point" href="/acupuncture/points/st10/" target="_top" aria-label="수돌 ST10 상세 설명"><title>수돌 ST10 · 목 앞부위, 반지연골(cricoid cartilage)과 같은 높이, 목빗근(sternocleidomastoid muscle) 앞모서리 바로 앞쪽.</title><path class="callout" d="M345 367 L88 362"/><circle cx="345" cy="367" r="7"/><text x="24" y="367">ST10</text></a><a id="ST12" class="point" href="/acupuncture/points/st12/" target="_top" aria-label="결분 ST12 상세 설명"><title>결분 ST12 · 목 앞부위, 큰빗장위오목(greater supraclavicular fossa), 앞정중선(anteriormedian line)에서 가쪽으로 4寸, 빗장 뼈(clavicle) 위쪽 오목한 곳.</title><path class="callout" d="M419 481 L88 476"/><circle cx="419" cy="481" r="7"/><text x="24" y="481">ST12</text></a><a id="CV22" class="point" href="/acupuncture/points/cv22/" target="_top" aria-label="천돌 CV22 상세 설명"><title>천돌 CV22 · 목앞부위, 앞정중선(anterior median line) 위, 목아래패임(suprasternal fossa)의 중심.</title><path class="callout" d="M320 496 L88 515"/><circle cx="320" cy="496" r="7"/><text x="24" y="520">CV22</text></a><a id="ST9" class="point" href="/acupuncture/points/st9/" target="_top" aria-label="인영 ST9 상세 설명"><title>인영 ST9 · 목 앞부위, 방패연골(thyroid catilage) 위모서리와 같은 높이, 목빗근(sternocleidomastoid muscle) 앞쪽, 온목동맥(common carotid artery)이 뛰는 곳.</title><path class="callout" d="M348 300 L512 295"/><circle cx="348" cy="300" r="7"/><text x="520" y="300">ST9</text></a><a id="SI16" class="point" href="/acupuncture/points/si16/" target="_top" aria-label="천창 SI16 상세 설명"><title>천창 SI16 · 목 앞부위, 목빗근(sternocleidomastoid muscle)의 뒤쪽, 방패연골(thyroid cartilage) 위모서리와 같은 높이.</title><path class="callout" d="M398 300 L512 334"/><circle cx="398" cy="300" r="7"/><text x="520" y="339">SI16</text></a><a id="LI17" class="point" href="/acupuncture/points/li17/" target="_top" aria-label="천정 LI17 상세 설명"><title>천정 LI17 · 목 앞부위, 반지연골(cricoid cartilage)과 같은 높이, 목빗근(sternocleidomastoid muscle)의 뒤모서리 바로 뒤쪽.</title><path class="callout" d="M390 367 L512 373"/><circle cx="390" cy="367" r="7"/><text x="520" y="378">LI17</text></a><a id="ST11" class="point" href="/acupuncture/points/st11/" target="_top" aria-label="기사 ST11 상세 설명"><title>기사 ST11 · 목 앞부위, 작은빗장위오목(lesser supraclavicular fossa), 빗장뼈 복장끝(sternal end of the clavicle)의 위쪽, 목빗근(sternocleidomastoid muscle)의 빗장뼈갈래(clavicular head)와 복장뼈갈래(sternal head)의 사이 오목한 곳.</title><path class="callout" d="M371 489 L512 484"/><circle cx="371" cy="489" r="7"/><text x="520" y="489">ST11</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>