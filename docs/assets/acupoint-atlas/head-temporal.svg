<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">관자놀이·귀 위쪽</title><desc id="desc">함염·현로·현리는 두유–곡빈 곡선의 1/4·1/2·3/4입니다. 각손은 귀끝 바로 위, 솔곡은 귀끝 수직선상 머리카락경계 위 1.5 B-cun, 천충은 귀뿌리 뒤 수직선상 위 2 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">관자놀이·귀 위쪽</text><path class="skin" d="M190 277 L213 246 Q207 129 290 104 Q383 81 431 144 Q460 221 435 318 L406 384 L399 491 L310 491 L320 402 L240 401 L224 360 L209 354 L219 330 L193 320 L213 297 Z"/><path class="skin" d="M348 269 Q378 248 390 282 L382 336 Q370 363 351 339 Q338 313 348 269 Z"/><path class="crease" d="M357 281 Q378 271 375 307 L359 326"/><path class="bone" d="M240 244 L330 267"/><path class="crease" d="M231 214 L261 210 M242 397 L320 402 L339 328"/><text class="landmark" x="205" y="558">앞쪽 ← · → 뒤쪽</text><path class="guide" d="M251 158 Q294 184 331 250"/><text class="landmark" x="185" y="122">이마 머리카락 경계</text><path class="guide" d="M290 248 L401 248"/><a id="ST8" class="point" href="/acupuncture/points/st8/" target="_top" aria-label="두유 ST8 상세 설명"><title>두유 ST8 · 머리, 이마각(corner of the forehead) 前髮際(anterior hairline)에서 수직으로 위쪽으로 0.5寸, 앞정중선(anterior median line)에서 가쪽으로 4.5寸.</title><path class="callout" d="M251 158 L88 153"/><circle cx="251" cy="158" r="7"/><text x="24" y="158">ST8</text></a><a id="GB4" class="point" href="/acupuncture/points/gb4/" target="_top" aria-label="함염 GB4 상세 설명"><title>함염 GB4 · 머리, 頭維(ST8)와 曲鬢(GB7)을 연결하는 곡선에서 위쪽으로부터 1/4과 아래쪽으로부터 3/4이 되는 지점.</title><path class="callout" d="M277 181 L88 192"/><circle cx="277" cy="181" r="7"/><text x="24" y="197">GB4</text></a><a id="GB5" class="point" href="/acupuncture/points/gb5/" target="_top" aria-label="현로 GB5 상세 설명"><title>현로 GB5 · 머리, 頭維(ST8)와 曲鬢(GB7)을 연결하는 곡선의 중점.</title><path class="callout" d="M299 205 L88 231"/><circle cx="299" cy="205" r="7"/><text x="24" y="236">GB5</text></a><a id="GB9" class="point" href="/acupuncture/points/gb9/" target="_top" aria-label="천충 GB9 상세 설명"><title>천충 GB9 · 머리, 귓바퀴뿌리(auricular root) 뒤 모서리에서 수직으로 위쪽, 髮際 (hairline)에서 위쪽으로 2寸.</title><path class="callout" d="M397 171 L512 166"/><circle cx="397" cy="171" r="7"/><text x="520" y="171">GB9</text></a><a id="GB8" class="point" href="/acupuncture/points/gb8/" target="_top" aria-label="솔곡 GB8 상세 설명"><title>솔곡 GB8 · 머리, 귓바퀴끝(auricular apex)에서 수직으로 위쪽, 관자놀이 머리카락경계선(temporal hairline)에서 위쪽으로 1.5寸.</title><path class="callout" d="M366 190 L512 205"/><circle cx="366" cy="190" r="7"/><text x="520" y="210">GB8</text></a><a id="GB6" class="point" href="/acupuncture/points/gb6/" target="_top" aria-label="현리 GB6 상세 설명"><title>현리 GB6 · 머리, 頭維(ST8)와 曲鬢(GB7)을 연결하는 곡선에서 위쪽으로부터 3/4과 아래쪽으로부터 1/4이 되는 지점.</title><path class="callout" d="M317 228 L512 244"/><circle cx="317" cy="228" r="7"/><text x="520" y="249">GB6</text></a><a id="TE20" class="point" href="/acupuncture/points/te20/" target="_top" aria-label="각손 TE20 상세 설명"><title>각손 TE20 · 머리, 귓바퀴끝(auricular apex)의 바로 위쪽 지점.</title><path class="callout" d="M366 248 L512 283"/><circle cx="366" cy="248" r="7"/><text x="520" y="288">TE20</text></a><a id="GB7" class="point" href="/acupuncture/points/gb7/" target="_top" aria-label="곡빈 GB7 상세 설명"><title>곡빈 GB7 · 머리, 귓바퀴끝(auricular apex)을 지나는 수평선과 관자놀이 머리카락경계선(temple hairline)의 뒤모서리를 지나는 수직선이 만나는 지점.</title><path class="callout" d="M331 250 L512 322"/><circle cx="331" cy="250" r="7"/><text x="520" y="327">GB7</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>