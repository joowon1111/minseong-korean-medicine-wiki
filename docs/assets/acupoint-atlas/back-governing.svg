<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">등 정중선 · 독맥 분절</title><desc id="desc">도도·신주·신도·영대·지양·근축·중추·척중은 각각 T1·3·5·6·7·9·10·11 가시돌기 아래 오목한 곳입니다. 분절 사이의 실제 피부 간격을 실측한 그림은 아닙니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">등 정중선 · 독맥 분절</text><path class="skin" d="M199 107 Q320 77 446 107 L452 552 Q320 576 187 552 Z"/><path class="bone" d="M270 121 L270 550"/><circle class="joint" cx="270" cy="135.0" r="6"/><path class="guide" d="M249 145.0 L429 145.0"/><text class="landmark" x="200" y="149.0">T1</text><circle class="joint" cx="270" cy="173.0" r="6"/><path class="guide" d="M249 183.0 L429 183.0"/><text class="landmark" x="200" y="187.0">T2</text><circle class="joint" cx="270" cy="211.0" r="6"/><path class="guide" d="M249 221.0 L429 221.0"/><text class="landmark" x="200" y="225.0">T3</text><circle class="joint" cx="270" cy="249.0" r="6"/><path class="guide" d="M249 259.0 L429 259.0"/><text class="landmark" x="200" y="263.0">T4</text><circle class="joint" cx="270" cy="287.0" r="6"/><path class="guide" d="M249 297.0 L429 297.0"/><text class="landmark" x="200" y="301.0">T5</text><circle class="joint" cx="270" cy="325.0" r="6"/><path class="guide" d="M249 335.0 L429 335.0"/><text class="landmark" x="200" y="339.0">T6</text><circle class="joint" cx="270" cy="363.0" r="6"/><path class="guide" d="M249 373.0 L429 373.0"/><text class="landmark" x="200" y="377.0">T7</text><circle class="joint" cx="270" cy="401.0" r="6"/><path class="guide" d="M249 411.0 L429 411.0"/><text class="landmark" x="200" y="415.0">T8</text><circle class="joint" cx="270" cy="439.0" r="6"/><path class="guide" d="M249 449.0 L429 449.0"/><text class="landmark" x="200" y="453.0">T9</text><circle class="joint" cx="270" cy="477.0" r="6"/><path class="guide" d="M249 487.0 L429 487.0"/><text class="landmark" x="200" y="491.0">T10</text><circle class="joint" cx="270" cy="515.0" r="6"/><path class="guide" d="M249 525.0 L429 525.0"/><text class="landmark" x="200" y="529.0">T11</text><text class="landmark" x="219" y="604">가시돌기 아래 높이 · 오른쪽만 표시</text><a id="GV13" class="point" href="/acupuncture/points/gv13/" target="_top" aria-label="도도 GV13 상세 설명"><title>도도 GV13 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 첫째 등뼈 가시돌기(spinous process of the 1st thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 145.0 L88 145"/><circle cx="270" cy="145.0" r="7"/><text x="24" y="150">GV13</text></a><a id="GV12" class="point" href="/acupuncture/points/gv12/" target="_top" aria-label="신주 GV12 상세 설명"><title>신주 GV12 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 셋째 등뼈 가시돌기(spinous process of the 3rd thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 221.0 L88 216.0"/><circle cx="270" cy="221.0" r="7"/><text x="24" y="221.0">GV12</text></a><a id="GV11" class="point" href="/acupuncture/points/gv11/" target="_top" aria-label="신도 GV11 상세 설명"><title>신도 GV11 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 다섯째 등뼈 가시돌기(spinous process of the 5th thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 297.0 L88 292.0"/><circle cx="270" cy="297.0" r="7"/><text x="24" y="297.0">GV11</text></a><a id="GV10" class="point" href="/acupuncture/points/gv10/" target="_top" aria-label="영대 GV10 상세 설명"><title>영대 GV10 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 여섯째 등뼈 가시돌기(spinous process of the 6th thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 335.0 L88 331.0"/><circle cx="270" cy="335.0" r="7"/><text x="24" y="336.0">GV10</text></a><a id="GV9" class="point" href="/acupuncture/points/gv9/" target="_top" aria-label="지양 GV9 상세 설명"><title>지양 GV9 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 일곱째 등뼈 가시돌기(spinous process of the 7th thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 373.0 L88 370.0"/><circle cx="270" cy="373.0" r="7"/><text x="24" y="375.0">GV9</text></a><a id="GV8" class="point" href="/acupuncture/points/gv8/" target="_top" aria-label="근축 GV8 상세 설명"><title>근축 GV8 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 아홉째 등뼈 가시돌기(spinous process of the 9th thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 449.0 L88 444.0"/><circle cx="270" cy="449.0" r="7"/><text x="24" y="449.0">GV8</text></a><a id="GV7" class="point" href="/acupuncture/points/gv7/" target="_top" aria-label="중추 GV7 상세 설명"><title>중추 GV7 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 열째 등뼈 가시돌기(spinous process of the 10th thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 487.0 L88 483.0"/><circle cx="270" cy="487.0" r="7"/><text x="24" y="488.0">GV7</text></a><a id="GV6" class="point" href="/acupuncture/points/gv6/" target="_top" aria-label="척중 GV6 상세 설명"><title>척중 GV6 · 위쪽 등부위, 뒤정중선(posterior median line) 위, 열한째 등뼈 가시돌기(spinous process of the 11th thoracic vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 525.0 L88 522.0"/><circle cx="270" cy="525.0" r="7"/><text x="24" y="527.0">GV6</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>