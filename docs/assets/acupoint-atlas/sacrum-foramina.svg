<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">엉치 · 팔료혈과 정중선</title><desc id="desc">상료·차료·중료·하료는 제1–4뒤엉치뼈구멍입니다. 요수는 엉치뼈틈새, 회양은 꼬리뼈끝 옆 0.5 B-cun입니다. 뼈구멍과 정중선 옆 거리로 정하는 혈을 구분합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">엉치 · 팔료혈과 정중선</text><path class="skin" d="M180 121 Q320 86 460 121 L450 498 Q384 552 320 570 Q253 552 190 498 Z"/><path class="joint" d="M246 166 L394 166 L372 327 L320 461 L268 327 Z"/><path class="guide" d="M320 145 L320 503"/><circle class="joint" cx="348" cy="195" r="9"/><path class="guide" d="M289 195 L430 195"/><text class="landmark" x="242" y="199">S1</text><circle class="joint" cx="345" cy="252" r="9"/><path class="guide" d="M289 252 L430 252"/><text class="landmark" x="242" y="256">S2</text><circle class="joint" cx="342" cy="309" r="9"/><path class="guide" d="M289 309 L430 309"/><text class="landmark" x="242" y="313">S3</text><circle class="joint" cx="339" cy="366" r="9"/><path class="guide" d="M289 366 L430 366"/><text class="landmark" x="242" y="370">S4</text><text class="landmark" x="179" y="604">뒤엉치뼈구멍 · 엉치뼈 뒷면</text><circle class="joint" cx="320" cy="465" r="6"/><a id="BL31" class="point" href="/acupuncture/points/bl31/" target="_top" aria-label="상료 BL31 상세 설명"><title>상료 BL31 · 엉치부위, 첫째 뒤엉치뼈구멍(the 1st posterior sacral foramen).</title><path class="callout" d="M348 195 L512 190"/><circle cx="348" cy="195" r="7"/><text x="520" y="195">BL31</text></a><a id="BL32" class="point" href="/acupuncture/points/bl32/" target="_top" aria-label="차료 BL32 상세 설명"><title>차료 BL32 · 엉치부위, 둘째 뒤엉치뼈구멍(the 2nd posterior sacral foramen).</title><path class="callout" d="M345 252 L512 247"/><circle cx="345" cy="252" r="7"/><text x="520" y="252">BL32</text></a><a id="BL33" class="point" href="/acupuncture/points/bl33/" target="_top" aria-label="중료 BL33 상세 설명"><title>중료 BL33 · 엉치부위, 셋째 뒤엉치뼈구멍(the 3rd posterior sacral foramen).</title><path class="callout" d="M342 309 L512 304"/><circle cx="342" cy="309" r="7"/><text x="520" y="309">BL33</text></a><a id="BL34" class="point" href="/acupuncture/points/bl34/" target="_top" aria-label="하료 BL34 상세 설명"><title>하료 BL34 · 엉치부위, 넷째 뒤엉치뼈구멍(the 4th posterior sacral foramen).</title><path class="callout" d="M339 366 L512 361"/><circle cx="339" cy="366" r="7"/><text x="520" y="366">BL34</text></a><a id="GV2" class="point" href="/acupuncture/points/gv2/" target="_top" aria-label="요수 GV2 상세 설명"><title>요수 GV2 · 엉치부위, 뒤정중선(posterior median line) 위, 엉치뼈틈새(sacral hiatus).</title><path class="callout" d="M320 418 L512 413"/><circle cx="320" cy="418" r="7"/><text x="520" y="418">GV2</text></a><a id="BL35" class="point" href="/acupuncture/points/bl35/" target="_top" aria-label="회양 BL35 상세 설명"><title>회양 BL35 · 엉덩이부위, 꼬리뼈끝(extremity of the coccyx)에서 가쪽으로 0.5寸.</title><path class="callout" d="M339 482 L512 477"/><circle cx="339" cy="482" r="7"/><text x="520" y="482">BL35</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>