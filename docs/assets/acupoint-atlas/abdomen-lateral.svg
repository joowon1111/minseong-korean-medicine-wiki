<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">배 가쪽·샅고랑</title><desc id="desc">비경 네 혈은 정중선 옆 4 B-cun이며 복애·대횡·복결·부사는 배꼽 위 3·같은 높이·아래 1.3·아래 4.3 B-cun입니다. 오추·유도는 위앞엉덩뼈가시 안쪽·아래안쪽, 급맥은 두덩결합 높이 옆 2.5 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">배 가쪽·샅고랑</text><path class="skin" d="M205 110 Q320 137 435 110 L460 214 L441 355 L472 517 Q320 571 188 517 L199 355 L180 214 Z"/><path class="guide" d="M320 126 L320 505"/><path class="bone" d="M214 159 L320 126 L426 159"/><circle class="joint" cx="320" cy="350" r="8"/><path class="guide" d="M218 350 L422 350"/><path class="bone" d="M275 490 L365 490"/><text class="landmark" x="160" y="90">칼몸통결합 · 배꼽 위 8 B-cun</text><text class="landmark" x="436" y="354">배꼽</text><text class="landmark" x="174" y="594">두덩결합 위 · 배꼽 아래 5 B-cun</text><circle class="joint" cx="422" cy="435" r="9"/><text class="landmark" x="405" y="417">위앞엉덩뼈가시</text><a id="SP16" class="point" href="/acupuncture/points/sp16/" target="_top" aria-label="복애 SP16 상세 설명"><title>복애 SP16 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 3寸, 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M416 266 L512 261"/><circle cx="416" cy="266" r="7"/><text x="520" y="266">SP16</text></a><a id="SP15" class="point" href="/acupuncture/points/sp15/" target="_top" aria-label="대횡 SP15 상세 설명"><title>대횡 SP15 · 윗배, 배꼽(umbilicus) 중심에서 가쪽으로 4寸.</title><path class="callout" d="M416 350 L512 345"/><circle cx="416" cy="350" r="7"/><text x="520" y="350">SP15</text></a><a id="SP14" class="point" href="/acupuncture/points/sp14/" target="_top" aria-label="복결 SP14 상세 설명"><title>복결 SP14 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 1.3寸, 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M416 386.4 L512 384"/><circle cx="416" cy="386.4" r="7"/><text x="520" y="389">SP14</text></a><a id="GB27" class="point" href="/acupuncture/points/gb27/" target="_top" aria-label="오추 GB27 상세 설명"><title>오추 GB27 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 3寸, 위앞엉덩뼈가시(anterior superior iliac spine)의 안쪽.</title><path class="callout" d="M405 434 L512 429"/><circle cx="405" cy="434" r="7"/><text x="520" y="434">GB27</text></a><a id="GB28" class="point" href="/acupuncture/points/gb28/" target="_top" aria-label="유도 GB28 상세 설명"><title>유도 GB28 · 아랫배, 위앞엉덩뼈가시(anterior superior iliac spine)에서 아래안쪽으로 0.5寸.</title><path class="callout" d="M410 449 L512 468"/><circle cx="410" cy="449" r="7"/><text x="520" y="473">GB28</text></a><a id="SP13" class="point" href="/acupuncture/points/sp13/" target="_top" aria-label="부사 SP13 상세 설명"><title>부사 SP13 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 4.3寸, 앞정중선(anterior median line)에서 가쪽으로 4寸.</title><path class="callout" d="M416 470.4 L512 507"/><circle cx="416" cy="470.4" r="7"/><text x="520" y="512">SP13</text></a><a id="LR12" class="point" href="/acupuncture/points/lr12/" target="_top" aria-label="급맥 LR12 상세 설명"><title>급맥 LR12 · 샅부위(groin region), 두덩결합(pubic symphysis) 위모서리와 같은 높이, 앞정중선(anterior median line)에서 가쪽으로 2.5寸.</title><path class="callout" d="M380.0 490 L512 546"/><circle cx="380.0" cy="490" r="7"/><text x="520" y="551">LR12</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>