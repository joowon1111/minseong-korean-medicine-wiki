<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">종아리 안쪽 · 뼈모서리·근육</title><desc id="desc">안쪽복사–음릉천은 13 B-cun입니다. 누곡·여구·중도는 복사 위 6·5·7 B-cun, 지기는 음릉천 아래 3 B-cun입니다. 교신은 복사 위 2 B-cun에서 복류 앞쪽, 축빈은 위 5 B-cun에서 뒤쪽입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">종아리 안쪽 · 뼈모서리·근육</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z"/><path class="bone" d="M272 261 L280 575"/><path class="tendon" d="M374 399 L360 577"/><path class="crease" d="M244 211 L392 211"/><text class="landmark" x="95" y="111">앞쪽</text><text class="landmark" x="437" y="111">뒤쪽</text><circle class="joint" cx="304" cy="568" r="17"/><text class="landmark" x="80" y="568">안쪽복사</text><text class="landmark" x="421" y="486">아킬레스건</text><a id="SP8" class="point" href="/acupuncture/points/sp8/" target="_top" aria-label="지기 SP8 상세 설명"><title>지기 SP8 · 종아리 정강뼈면, 정강뼈 안쪽모서리(medial border of the tibia) 뒤쪽에 해당되며, 안쪽복사 융기(prominence of the medial malleolus)에서 음릉천까지 13촌으로 정했을 때 陰陵泉(SP9)에서 아래쪽으로 3寸 부위에 취혈함.</title><path class="callout" d="M289 333 L88 328"/><circle cx="289" cy="333" r="7"/><text x="24" y="333">SP8</text></a><a id="LR6" class="point" href="/acupuncture/points/lr6/" target="_top" aria-label="중도 LR6 상세 설명"><title>중도 LR6 · 종아리 앞 안쪽면, 정강뼈 안쪽모서리(medial border of the tibia)의 중앙에 있으며, 안쪽복사 융기(prominence of the medial malleolus)에서 음릉천까지 13촌으로 정했을 때 안쪽복사 융기에서 몸 쪽으로 7寸되는 곳에 취혈한다.</title><path class="callout" d="M277 403 L88 398"/><circle cx="277" cy="403" r="7"/><text x="24" y="403">LR6</text></a><a id="SP7" class="point" href="/acupuncture/points/sp7/" target="_top" aria-label="누곡 SP7 상세 설명"><title>누곡 SP7 · 종아리 정강뼈면, 정강뼈 안쪽모서리(medial border of the tibia) 뒤쪽에 해당되며, 안쪽복사 융기(prominence of the medial malleolus)에서 음릉천까지 13촌으로 정했을 때 안쪽복사융기에서 위로 6寸 부위에 취혈함.</title><path class="callout" d="M294 427 L88 437"/><circle cx="294" cy="427" r="7"/><text x="24" y="442">SP7</text></a><a id="LR5" class="point" href="/acupuncture/points/lr5/" target="_top" aria-label="여구 LR5 상세 설명"><title>여구 LR5 · 종아리 앞 안쪽면, 정강뼈 안쪽모서리(medial border of the tibia)의 중앙에 있으며, 안쪽복사 융기(prominence of the medial malleolus)에서 음릉천까지 13촌으로 정했을 때 안쪽복사 융기에서 몸 쪽으로 5寸되는 곳으로 뒤쪽의 築賓(KI9)과 같은 높이에 위치한다.</title><path class="callout" d="M278 450 L88 476"/><circle cx="278" cy="450" r="7"/><text x="24" y="481">LR5</text></a><a id="KI8" class="point" href="/acupuncture/points/ki8/" target="_top" aria-label="교신 KI8 상세 설명"><title>교신 KI8 · 종아리 안쪽면, 정강뼈 안쪽모서리(medial border of the tibia)의 뒤쪽, 안쪽복사 융기(prominence of the medial malleolus) 와 음릉천을 연결한 선을 13촌으로 정하여 위쪽으로 2寸 오목한 곳에 해당됨.</title><path class="callout" d="M314 521 L88 516"/><circle cx="314" cy="521" r="7"/><text x="24" y="521">KI8</text></a><a id="LR7" class="point" href="/acupuncture/points/lr7/" target="_top" aria-label="슬관 LR7 상세 설명"><title>슬관 LR7 · 종아리 정강뼈쪽면, 정강뼈 안쪽관절융기(medial condyle of the tibia) 아래쪽으로, 陰陵泉(SP9)에서 뒤쪽으로 1寸부위에 해당됨.</title><path class="callout" d="M322 262 L512 257"/><circle cx="322" cy="262" r="7"/><text x="520" y="262">LR7</text></a><a id="KI9" class="point" href="/acupuncture/points/ki9/" target="_top" aria-label="축빈 KI9 상세 설명"><title>축빈 KI9 · 종아리 뒤안쪽면, 가자미근(soleus muscle)과 발꿈치힘줄(calcaneal tendon)사이로서, 안쪽복사 융기(prominence of the medial malleolus) 위쪽으로 5寸 높이에 해당됨.</title><path class="callout" d="M357 450 L512 445"/><circle cx="357" cy="450" r="7"/><text x="520" y="450">KI9</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>