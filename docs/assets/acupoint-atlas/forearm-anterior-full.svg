<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">아래팔 앞면 · 공최·극문·음극</title><desc id="desc">팔꿈치주름–손목주름을 12 B-cun으로 봅니다. 공최는 척택–태연 선에서 손목 위 7, 극문은 두 힘줄 사이 위 5, 음극은 자쪽손목굽힘근건 노쪽 위 0.5 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">아래팔 앞면 · 공최·극문·음극</text><path class="skin" d="M225 110 Q205 150 224 180 L240 560 L400 560 L416 180 Q435 150 415 110 Z"/><path class="crease" d="M225 150 L415 150"/><path class="crease" d="M240 545 L400 545"/><path class="tendon" d="M262 180 L270 545 M327 190 L325 545 M357 190 L350 545"/><text class="landmark" x="231" y="91">팔꿈치 앞주름</text><text class="landmark" x="253" y="590">손목주름 · 아래쪽</text><text class="landmark" x="431" y="122">노쪽</text><text class="landmark" x="117" y="121">자쪽</text><a id="HT6" class="point" href="/acupuncture/points/ht6/" target="_top" aria-label="음극 HT6 상세 설명"><title>음극 HT6 · 아래팔 앞안쪽면, 자쪽손목굽힘근힘줄(flexor carpi ulnaris tendon)의 노쪽, 손바닥 쪽 손목주름(palmar wrist crease)에서 몸 쪽으로 0.5寸.</title><path class="callout" d="M285 528.5 L88 523.5"/><circle cx="285" cy="528.5" r="7"/><text x="24" y="528.5">HT6</text></a><a id="LU6" class="point" href="/acupuncture/points/lu6/" target="_top" aria-label="공최 LU6 상세 설명"><title>공최 LU6 · 아래팔 앞가쪽면, 尺澤(LU5)과 太淵(LU9)을 연결하는 선 위, 손바닥쪽손목주름(palmar wrist crease)에서 위쪽으로 7寸.</title><path class="callout" d="M389 314.6 L512 309.6"/><circle cx="389" cy="314.6" r="7"/><text x="520" y="314.6">LU6</text></a><a id="PC4" class="point" href="/acupuncture/points/pc4-ximen/" target="_top" aria-label="극문 PC4 상세 설명"><title>극문 PC4 · 아래팔 앞쪽면, 긴손바닥근힘줄(palmaris longus tendon)과 노쪽손목굽힘근힘줄(flexor carpi radialis tendon)의 사이, 손바닥 쪽 손목주름(palmar wrist crease) 에서 몸 쪽으로 5寸.</title><path class="callout" d="M337 380.4 L512 375.4"/><circle cx="337" cy="380.4" r="7"/><text x="520" y="380.4">PC4</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>