<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">무릎·종아리 안쪽</title><desc id="desc">곡천은 오금주름 안쪽끝, 음곡은 그 뒤쪽 두 힘줄 사이입니다. 삼음교는 안쪽복사 위 3 B-cun의 정강뼈 뒤, 복류는 태계 위 2 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">무릎·종아리 안쪽</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z"/><path class="bone" d="M272 261 L280 575"/><path class="tendon" d="M374 399 L360 577"/><path class="crease" d="M244 211 L392 211"/><text class="landmark" x="95" y="111">앞쪽</text><text class="landmark" x="437" y="111">뒤쪽</text><circle class="joint" cx="304" cy="568" r="17"/><text class="landmark" x="80" y="568">안쪽복사</text><text class="landmark" x="421" y="486">아킬레스건</text><a id="SP9" class="point" href="/acupuncture/points/sp9-yinlingquan/" target="_top" aria-label="음릉천 SP9 상세 설명"><title>음릉천 SP9</title><path class="callout" d="M281 262 L88 257"/><circle cx="281" cy="262" r="8"/><text x="24" y="262">SP9</text></a><a id="SP6" class="point" href="/acupuncture/points/sp6-sanyinjiao/" target="_top" aria-label="삼음교 SP6 상세 설명"><title>삼음교 SP6</title><path class="callout" d="M298 497 L88 492"/><circle cx="298" cy="497" r="8"/><text x="24" y="497">SP6</text></a><a id="KI10" class="point" href="/acupuncture/points/ki10/" target="_top" aria-label="음곡 KI10 상세 설명"><title>음곡 KI10</title><path class="callout" d="M380 211 L501 206"/><circle cx="380" cy="211" r="8"/><text x="508" y="211">KI10</text></a><a id="LR8" class="point" href="/acupuncture/points/lr8-ququan/" target="_top" aria-label="곡천 LR8 상세 설명"><title>곡천 LR8</title><path class="callout" d="M353 211 L501 243"/><circle cx="353" cy="211" r="8"/><text x="508" y="248">LR8</text></a><a id="KI7" class="point" href="/acupuncture/points/ki7-fuliu/" target="_top" aria-label="복류 KI7 상세 설명"><title>복류 KI7</title><path class="callout" d="M351 521 L501 516"/><circle cx="351" cy="521" r="8"/><text x="508" y="521">KI7</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>