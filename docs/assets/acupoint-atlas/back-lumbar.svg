<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">허리 · 요추 분절</title><desc id="desc">현추·명문·요양관은 L1·L2·L4 정중선, 삼초수·기해수·관원수는 L1·L3·L5 옆 1.5 B-cun입니다. 황문·지실은 L1·L2 옆 3 B-cun이며 신수·대장수는 기존 허리 도해에 연결됩니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">허리 · 요추 분절</text><path class="skin" d="M199 107 Q320 77 446 107 L452 552 Q320 576 187 552 Z"/><path class="bone" d="M270 121 L270 550"/><circle class="joint" cx="270" cy="135.0" r="6"/><path class="guide" d="M249 145.0 L429 145.0"/><text class="landmark" x="200" y="149.0">L1</text><circle class="joint" cx="270" cy="230.0" r="6"/><path class="guide" d="M249 240.0 L429 240.0"/><text class="landmark" x="200" y="244.0">L2</text><circle class="joint" cx="270" cy="325.0" r="6"/><path class="guide" d="M249 335.0 L429 335.0"/><text class="landmark" x="200" y="339.0">L3</text><circle class="joint" cx="270" cy="420.0" r="6"/><path class="guide" d="M249 430.0 L429 430.0"/><text class="landmark" x="200" y="434.0">L4</text><circle class="joint" cx="270" cy="515.0" r="6"/><path class="guide" d="M249 525.0 L429 525.0"/><text class="landmark" x="200" y="529.0">L5</text><text class="landmark" x="219" y="604">가시돌기 아래 높이 · 오른쪽만 표시</text><a id="GV5" class="point" href="/acupuncture/points/gv5/" target="_top" aria-label="현추 GV5 상세 설명"><title>현추 GV5 · 허리부위, 뒤정중선(posterior median line) 위, 첫째 허리뼈 가시돌기(spinous process of the 1st lumbar vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 145.0 L88 145"/><circle cx="270" cy="145.0" r="7"/><text x="24" y="150">GV5</text></a><a id="GV4" class="point" href="/acupuncture/points/gv4-mingmen/" target="_top" aria-label="명문 GV4 상세 설명"><title>명문 GV4 · 허리부위, 뒤정중선(posterior median line) 위, 둘째 허리뼈 가시돌기(spinous process of the 2nd lumbar vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 240.0 L88 235.0"/><circle cx="270" cy="240.0" r="7"/><text x="24" y="240.0">GV4</text></a><a id="GV3" class="point" href="/acupuncture/points/gv3/" target="_top" aria-label="요양관 GV3 상세 설명"><title>요양관 GV3 · 허리부위, 뒤정중선(posterior median line) 위, 넷째 허리뼈 가시돌기(spinous process of the 4th lumbar vertebra) 아래쪽 오목한 곳.</title><path class="callout" d="M270 430.0 L88 425.0"/><circle cx="270" cy="430.0" r="7"/><text x="24" y="430.0">GV3</text></a><a id="BL22" class="point" href="/acupuncture/points/bl22/" target="_top" aria-label="삼초수 BL22 상세 설명"><title>삼초수 BL22 · 허리부위, 첫째 허리뼈 가시돌기 (spinous process of the 1st lumbar vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 145.0 L512 145"/><circle cx="330" cy="145.0" r="7"/><text x="520" y="150">BL22</text></a><a id="BL51" class="point" href="/acupuncture/points/bl51/" target="_top" aria-label="황문 BL51 상세 설명"><title>황문 BL51 · 허리부위, 첫째 허리뼈 가시돌기 (spinous process of the 1st lumbar vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 145.0 L512 184"/><circle cx="390" cy="145.0" r="7"/><text x="520" y="189">BL51</text></a><a id="BL52" class="point" href="/acupuncture/points/bl52/" target="_top" aria-label="지실 BL52 상세 설명"><title>지실 BL52 · 허리부위, 둘째 허리뼈 가시돌기 (spinous process of the 2nd lumbar vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 240.0 L512 235.0"/><circle cx="390" cy="240.0" r="7"/><text x="520" y="240.0">BL52</text></a><a id="BL24" class="point" href="/acupuncture/points/bl24/" target="_top" aria-label="기해수 BL24 상세 설명"><title>기해수 BL24 · 허리부위, 셋째 허리뼈 가시돌기 (spinous process of the 3rd lumbar vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 335.0 L512 330.0"/><circle cx="330" cy="335.0" r="7"/><text x="520" y="335.0">BL24</text></a><a id="BL26" class="point" href="/acupuncture/points/bl26/" target="_top" aria-label="관원수 BL26 상세 설명"><title>관원수 BL26 · 허리부위, 다섯째 허리뼈 가시돌기 (spinous process of the 5th lumbar vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 1.5寸.</title><path class="callout" d="M330 525.0 L512 520.0"/><circle cx="330" cy="525.0" r="7"/><text x="520" y="525.0">BL26</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>