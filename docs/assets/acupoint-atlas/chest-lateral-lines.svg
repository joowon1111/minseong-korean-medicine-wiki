<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">가슴 가쪽 · 폐경·비경·심포경</title><desc id="desc">중부·운문은 정중선 옆 6 B-cun의 첫째 갈비사이 높이·빗장아래오목입니다. 주영–식두는 제2–5갈비사이 옆 6 B-cun, 천지는 제4갈비사이 옆 5 B-cun입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">가슴 가쪽 · 폐경·비경·심포경</text><path class="skin" d="M285 97 L355 97 L369 123 L473 159 L463 535 Q320 592 177 535 L166 159 L271 123 Z"/><path class="guide" d="M320 128 L320 555"/><path class="bone" d="M186 153 Q253 187 320 160 Q387 187 455 153"/><path class="bone" d="M322 170 Q389 162 455 186"/><text class="landmark" x="109" y="189">1갈비사이</text><path class="bone" d="M322 217 Q389 209 455 233"/><text class="landmark" x="109" y="236">2갈비사이</text><path class="bone" d="M322 264 Q389 256 455 280"/><text class="landmark" x="109" y="283">3갈비사이</text><path class="bone" d="M322 311 Q389 303 455 327"/><text class="landmark" x="109" y="330">4갈비사이</text><path class="bone" d="M322 358 Q389 350 455 374"/><text class="landmark" x="109" y="377">5갈비사이</text><path class="bone" d="M322 405 Q389 397 455 421"/><text class="landmark" x="109" y="424">6갈비사이</text><path class="bone" d="M322 452 Q389 444 455 468"/><text class="landmark" x="109" y="471">7갈비사이</text><a id="LU2" class="point" href="/acupuncture/points/lu2/" target="_top" aria-label="운문 LU2 상세 설명"><title>운문 LU2 · 앞가슴부위, 빗장아래오목(infra- clavicular fossa), 어깨뼈 부리돌기(coracoid process) 안쪽, 앞정중선(anterior median line)에서 가쪽으로 6寸 오목한 곳. ※주 : 氣戶(ST13), 兪府(KI27), 璇璣(CV21), 雲門(LU2)은 빗장뼈아래선을 따라 가로선 위에 위치한다.</title><path class="callout" d="M446 153 L512 148"/><circle cx="446" cy="153" r="7"/><text x="520" y="153">LU2</text></a><a id="LU1" class="point" href="/acupuncture/points/lu1-zhongfu/" target="_top" aria-label="중부 LU1 상세 설명"><title>중부 LU1 · 앞가슴부위, 첫째 갈비사이공간(the 1st intercostal space)과 같은 높이, 빗장아래오목(infraclavicular fossa)의 가쪽, 앞정중선(anterior median line)에서 가쪽으로 6寸.</title><path class="callout" d="M446 185 L512 187"/><circle cx="446" cy="185" r="7"/><text x="520" y="192">LU1</text></a><a id="SP20" class="point" href="/acupuncture/points/sp20/" target="_top" aria-label="주영 SP20 상세 설명"><title>주영 SP20 · 앞가슴부위, 둘째 갈비사이공간(the 2nd intercostal space), 앞정중선(anterior median line)에서 가쪽으로 6寸.</title><path class="callout" d="M446 232 L512 227"/><circle cx="446" cy="232" r="7"/><text x="520" y="232">SP20</text></a><a id="SP19" class="point" href="/acupuncture/points/sp19/" target="_top" aria-label="흉향 SP19 상세 설명"><title>흉향 SP19 · 앞가슴부위, 셋째 갈비사이공간(the 3rd intercostal space), 앞정중선(anterior median line)에서 가쪽으로 6寸.</title><path class="callout" d="M446 279 L512 274"/><circle cx="446" cy="279" r="7"/><text x="520" y="279">SP19</text></a><a id="PC1" class="point" href="/acupuncture/points/pc1/" target="_top" aria-label="천지 PC1 상세 설명"><title>천지 PC1 · 앞가슴부위, 넷째 갈비사이공간(the 4th intercostal space)으로, 앞정중선 (anterior median line)에서 가쪽으로 5寸.</title><path class="callout" d="M425 326 L512 321"/><circle cx="425" cy="326" r="7"/><text x="520" y="326">PC1</text></a><a id="SP18" class="point" href="/acupuncture/points/sp18/" target="_top" aria-label="천계 SP18 상세 설명"><title>천계 SP18 · 앞가슴부위, 넷째 갈비사이공간(the 4th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 6寸.</title><path class="callout" d="M446 326 L512 360"/><circle cx="446" cy="326" r="7"/><text x="520" y="365">SP18</text></a><a id="SP17" class="point" href="/acupuncture/points/sp17/" target="_top" aria-label="식두 SP17 상세 설명"><title>식두 SP17 · 앞가슴부위, 다섯째 갈비사이공간(the 5th intercostal space), 앞정중선(anterior median line)에서 가쪽으로 6寸.</title><path class="callout" d="M446 373 L512 399"/><circle cx="446" cy="373" r="7"/><text x="520" y="404">SP17</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>