<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">가쪽 발목·발허리 확대</title><desc id="desc">복삼은 곤륜 아래 발꿈치뼈 적백육제, 신맥은 가쪽복사 바로 아래입니다. 금문은 입방뼈 아래, 경골은 다섯째 발허리뼈거친면 먼쪽, 구허는 가쪽복사 앞아래입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">가쪽 발목·발허리 확대</text><path class="skin" d="M333 121 L440 121 L444 288 Q457 329 441 376 Q363 410 301 396 Q251 382 179 389 L100 393 Q76 387 83 366 Q91 350 126 351 L207 330 Q249 298 302 291 L333 269 Z"/><circle class="joint" cx="347" cy="290" r="25"/><path class="tendon" d="M421 158 L423 344"/><text class="landmark" x="306" y="251">가쪽복사</text><text class="landmark" x="449" y="347">뒤꿈치</text><text class="landmark" x="84" y="441">발가락 방향 ←</text><circle class="joint" cx="241" cy="350" r="10"/><text class="landmark" x="156" y="469">다섯째 발허리뼈바닥</text><a id="GB40" class="point" href="/acupuncture/points/gb40-qiuxu/" target="_top" aria-label="구허 GB40 상세 설명"><title>구허 GB40 · 발목 앞가쪽면, 긴발가락폄근힘줄(extensor digitorum longus tendon)의 가쪽, 가쪽복사(lateral malleolus)의 앞먼쪽(anterior and distal) 오목한 곳.</title><path class="callout" d="M307 313 L88 308"/><circle cx="307" cy="313" r="7"/><text x="24" y="313">GB40</text></a><a id="BL64" class="point" href="/acupuncture/points/bl64/" target="_top" aria-label="경골 BL64 상세 설명"><title>경골 BL64 · 발 가쪽면, 다섯째 발허리뼈거친면(tuberosity of the 5th metatarsal bone) 먼 쪽, 赤白肉際.</title><path class="callout" d="M223 361 L88 356"/><circle cx="223" cy="361" r="7"/><text x="24" y="361">BL64</text></a><a id="BL63" class="point" href="/acupuncture/points/bl63/" target="_top" aria-label="금문 BL63 상세 설명"><title>금문 BL63 · 발등, 가쪽복사(lateral malleolus) 앞모서리에서 먼 쪽, 다섯째 발허리뼈거친면(tuberosity of the 5th metatarsal bone) 뒤쪽, 입방뼈(cuboid bone) 아래쪽의 오목한 곳.</title><path class="callout" d="M271 365 L88 395"/><circle cx="271" cy="365" r="7"/><text x="24" y="400">BL63</text></a><a id="BL62" class="point" href="/acupuncture/points/bl62-shenmai/" target="_top" aria-label="신맥 BL62 상세 설명"><title>신맥 BL62 · 발 가쪽면, 가쪽복사 융기(prominence of the lateral malleolus)에서 수직으로 아래쪽, 가쪽복사의 아래모서리와 발꿈치뼈(calcaneus) 사이의 오목한 곳. ※주 : 申脈(BL62)에 상응하는 안쪽의 經穴은 照海(KI6)다.</title><path class="callout" d="M347 329 L512 324"/><circle cx="347" cy="329" r="7"/><text x="520" y="329">BL62</text></a><a id="BL61" class="point" href="/acupuncture/points/bl61/" target="_top" aria-label="복삼 BL61 상세 설명"><title>복삼 BL61 · 발 가쪽면, 발꿈치뼈(calcaneus)의 가쪽으로, 崑崙(BL60)에서 먼 쪽, 赤白肉際에 취혈함.</title><path class="callout" d="M389 372 L512 367"/><circle cx="389" cy="372" r="7"/><text x="520" y="372">BL61</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>