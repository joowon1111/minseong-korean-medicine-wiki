<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" role="img" aria-labelledby="title desc"><title id="title">오른손 손바닥 쪽 손목과 아래팔 — 태연 LU9, 내관 PC6, 신문 HT7</title><desc id="desc">손가락 방향은 위, 팔꿈치 방향은 아래. 엄지 쪽은 그림 오른쪽. 태연은 손목 노쪽, 신문은 자쪽손목굽힘근힘줄 노쪽 손목주름, 내관은 손목주름에서 몸쪽 2 B-cun의 두 힘줄 사이입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#233c49;font-size:15px}.skin{fill:#f8ede3;stroke:#b79179;stroke-width:2}.bone{fill:none;stroke:#d1b49b;stroke-width:12;stroke-linecap:round}.tendon{fill:none;stroke:#ae8f76;stroke-width:6}.guide{fill:none;stroke:#728997;stroke-width:1.5;stroke-dasharray:5 4}.mark circle{fill:#007e83;stroke:#fff;stroke-width:3}.mark text{fill:#00666c;font-weight:700}.mark:hover circle,.mark:focus circle{fill:#af5018;stroke:#233c49}.mark:focus{outline:2px solid #007e83}</style><rect width="540" height="460" rx="18" fill="#fff"/><text x="24" y="32" style="font-size:19px;font-weight:700">오른쪽 손목·아래팔 · 손바닥 쪽</text><path class="skin" d="M158 80 Q145 118 170 165 L147 391 L346 391 L312 165 Q344 131 331 80 Z"/><text x="191" y="68">손가락 방향 ↑</text><text x="190" y="414">팔꿈치 방향 ↓</text><text x="354" y="91">엄지 쪽 · 노쪽</text><text x="25" y="91">새끼손가락 쪽</text><path class="tendon" d="M178 156 L169 378 M231 139 L234 378 M273 142 L271 378"/><path d="M171 166 Q240 179 312 165" fill="none" stroke="#b79179" stroke-width="2"/><path class="guide" d="M338 174 L365 174 L365 270 L277 270"/><text x="374" y="226">2 B-cun</text><text x="375" y="249" style="font-size:12px">몸쪽 거리</text><text x="25" y="354" style="font-size:12px">자쪽손목굽힘근건</text><path class="guide" d="M143 350 L171 344"/><text x="192" y="310" style="font-size:12px">긴손바닥근건</text><path class="guide" d="M233 300 L234 286"/><text x="331" y="351" style="font-size:12px">노쪽손목굽힘근건</text><path class="guide" d="M327 347 L272 338"/><a class="mark" href="/acupuncture/points/ht7-shenmen/" target="_top" aria-label="신문 HT7 상세 설명"><title>신문 HT7 상세 설명</title><circle cx="191" cy="171" r="11"/><path d="M191 171 L28 196" class="guide"/><text x="28" y="202">신문 HT7</text></a><a class="mark" href="/acupuncture/points/lu9-taiyuan/" target="_top" aria-label="태연 LU9 상세 설명"><title>태연 LU9 상세 설명</title><circle cx="303" cy="168" r="11"/><path d="M303 168 L362 147" class="guide"/><text x="362" y="153">태연 LU9</text></a><a class="mark" href="/acupuncture/points/pc6-neiguan/" target="_top" aria-label="내관 PC6 상세 설명"><title>내관 PC6 상세 설명</title><circle cx="252" cy="270" r="11"/><path d="M252 270 L350 291" class="guide"/><text x="350" y="297">내관 PC6</text></a><text x="24" y="437" style="font-size:12px">민성 한의학 아카이브 · 위치 관계를 단순화한 교육용 도해</text></svg>