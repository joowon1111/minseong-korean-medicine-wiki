<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">종아리 앞면 · 조구·하거허</title><desc id="desc">독비–해계 구간을 16 B-cun으로 봅니다. 조구·하거허는 독비 아래 8·9 B-cun이며, 정강뼈 앞능선 가쪽의 앞정강근 위에 있습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">종아리 앞면 · 조구·하거허</text><path class="skin" d="M225 96 L403 96 Q420 186 401 254 Q437 369 406 471 L376 586 L262 586 L236 475 Q210 369 231 258 Z"/><ellipse class="joint" cx="313" cy="208" rx="42" ry="44"/><path class="bone" d="M313 253 L310 570"/><path class="bone" d="M355 296 L367 559"/><text class="landmark" x="80" y="111">안쪽</text><text class="landmark" x="436" y="111">가쪽</text><text class="landmark" x="436" y="216">무릎뼈</text><text class="landmark" x="78" y="521">정강뼈</text><text class="landmark" x="439" y="505">종아리뼈</text><a id="ST38" class="point" href="/acupuncture/points/st38/" target="_top" aria-label="조구 ST38 상세 설명"><title>조구 ST38 · 종아리 앞쪽면, 犢鼻(ST35)와 解谿(ST41)를 연결하는 선을 16촌으로 하여, 犢鼻(ST35)에서 아래쪽으로 8寸에 해당됨.</title><path class="callout" d="M346 422 L512 417"/><circle cx="346" cy="422" r="7"/><text x="520" y="422">ST38</text></a><a id="ST39" class="point" href="/acupuncture/points/st39/" target="_top" aria-label="하거허 ST39 상세 설명"><title>하거허 ST39 · 종아리 앞쪽면, 犢鼻(ST35)와 解谿(ST41)를 연결하는 선을 16촌으로 하여, 犢鼻(ST35)에서 아래쪽으로 9寸에 해당됨.</title><path class="callout" d="M346 442 L512 456"/><circle cx="346" cy="442" r="7"/><text x="520" y="461">ST39</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>