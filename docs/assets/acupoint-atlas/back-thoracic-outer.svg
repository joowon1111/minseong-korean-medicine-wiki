<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">등 위쪽 · 방광경 바깥 선</title><desc id="desc">부분–격관은 T2–T7 가시돌기 아래 높이에서 뒤정중선 옆 3 B-cun입니다. 안쪽 선의 혈과 같은 분절 높이를 가질 수 있습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">등 위쪽 · 방광경 바깥 선</text><path class="skin" d="M199 107 Q320 77 446 107 L452 552 Q320 576 187 552 Z"/><path class="bone" d="M270 121 L270 550"/><circle class="joint" cx="270" cy="135.0" r="6"/><path class="guide" d="M249 145.0 L429 145.0"/><text class="landmark" x="200" y="149.0">T2</text><circle class="joint" cx="270" cy="211.0" r="6"/><path class="guide" d="M249 221.0 L429 221.0"/><text class="landmark" x="200" y="225.0">T3</text><circle class="joint" cx="270" cy="287.0" r="6"/><path class="guide" d="M249 297.0 L429 297.0"/><text class="landmark" x="200" y="301.0">T4</text><circle class="joint" cx="270" cy="363.0" r="6"/><path class="guide" d="M249 373.0 L429 373.0"/><text class="landmark" x="200" y="377.0">T5</text><circle class="joint" cx="270" cy="439.0" r="6"/><path class="guide" d="M249 449.0 L429 449.0"/><text class="landmark" x="200" y="453.0">T6</text><circle class="joint" cx="270" cy="515.0" r="6"/><path class="guide" d="M249 525.0 L429 525.0"/><text class="landmark" x="200" y="529.0">T7</text><text class="landmark" x="219" y="604">가시돌기 아래 높이 · 오른쪽만 표시</text><text class="landmark" x="352" y="93">옆 3 B-cun</text><a id="BL41" class="point" href="/acupuncture/points/bl41/" target="_top" aria-label="부분 BL41 상세 설명"><title>부분 BL41 · 위쪽 등부위, 둘째 등뼈 가시돌기(spinous process of the 2nd thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 145.0 L512 145"/><circle cx="390" cy="145.0" r="7"/><text x="520" y="150">BL41</text></a><a id="BL42" class="point" href="/acupuncture/points/bl42/" target="_top" aria-label="백호 BL42 상세 설명"><title>백호 BL42 · 위쪽 등부위, 셋째 등뼈 가시돌기 (spinous process of the 3rd thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 221.0 L512 216.0"/><circle cx="390" cy="221.0" r="7"/><text x="520" y="221.0">BL42</text></a><a id="BL43" class="point" href="/acupuncture/points/bl43/" target="_top" aria-label="고황 BL43 상세 설명"><title>고황 BL43 · 위쪽 등부위, 넷째 등뼈 가시돌기 (spinous process of the 4th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 297.0 L512 292.0"/><circle cx="390" cy="297.0" r="7"/><text x="520" y="297.0">BL43</text></a><a id="BL44" class="point" href="/acupuncture/points/bl44/" target="_top" aria-label="신당 BL44 상세 설명"><title>신당 BL44 · 위쪽 등부위, 다섯째 등뼈 가시돌기 (spinous process of the 5th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 373.0 L512 368.0"/><circle cx="390" cy="373.0" r="7"/><text x="520" y="373.0">BL44</text></a><a id="BL45" class="point" href="/acupuncture/points/bl45/" target="_top" aria-label="의희 BL45 상세 설명"><title>의희 BL45 · 위쪽 등부위, 여섯째 등뼈 가시돌기 (spinous process of the 6th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 449.0 L512 444.0"/><circle cx="390" cy="449.0" r="7"/><text x="520" y="449.0">BL45</text></a><a id="BL46" class="point" href="/acupuncture/points/bl46/" target="_top" aria-label="격관 BL46 상세 설명"><title>격관 BL46 · 위쪽 등부위, 일곱째 등뼈 가시돌기(spinous process of the 7th thoracic vertebra) 아래모서리와 같은 높이, 뒤정중선(posterior median line)에서 가쪽으로 3寸.</title><path class="callout" d="M390 525.0 L512 520.0"/><circle cx="390" cy="525.0" r="7"/><text x="520" y="525.0">BL46</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>