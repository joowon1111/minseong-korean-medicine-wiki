<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 660" role="img" aria-labelledby="title desc"><title id="title">배 · 위경의 안쪽 두 번째 선</title><desc id="desc">정중선 옆 2 B-cun입니다. 불용–활육문은 배꼽 위 6–1 B-cun, 외릉–기충은 아래 1–5 B-cun입니다. 천추는 배꼽과 같은 높이로 기존 도해에 연결되어 있습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#263e48}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#d4b9a0;stroke-width:11;stroke-linecap:round}.tendon{fill:none;stroke:#ae8c73;stroke-width:5}.joint{fill:#ead4bd;stroke:#b18a72;stroke-width:2}.guide{fill:none;stroke:#8c9da3;stroke-width:1.3;stroke-dasharray:4 4}.crease{fill:none;stroke:#b18a72;stroke-width:2}.landmark{font-size:13px}.callout{fill:none;stroke:#657f88;stroke-width:1.1}.point circle{fill:#087d80;stroke:#fff;stroke-width:2.5}.point text{font-size:16px;font-weight:700;fill:#08676b}.point:target circle,.point:hover circle,.point:focus circle{fill:#bd4c23;stroke:#7f3218;stroke-width:3}.point:target text,.point:hover text,.point:focus text{fill:#9e3c18}.point:focus{outline:2px solid #08676b}</style><rect width="640" height="660" rx="18" fill="white"/><text x="24" y="38" font-size="22" font-weight="700">배 · 위경의 안쪽 두 번째 선</text><path class="skin" d="M205 110 Q320 137 435 110 L460 214 L441 355 L472 517 Q320 571 188 517 L199 355 L180 214 Z"/><path class="guide" d="M320 126 L320 505"/><path class="bone" d="M214 159 L320 126 L426 159"/><circle class="joint" cx="320" cy="350" r="8"/><path class="guide" d="M218 350 L422 350"/><path class="bone" d="M275 490 L365 490"/><text class="landmark" x="160" y="90">칼몸통결합 · 배꼽 위 8 B-cun</text><text class="landmark" x="436" y="354">배꼽</text><text class="landmark" x="174" y="594">두덩결합 위 · 배꼽 아래 5 B-cun</text><a id="ST19" class="point" href="/acupuncture/points/st19/" target="_top" aria-label="불용 ST19 상세 설명"><title>불용 ST19 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 6寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 182 L88 177"/><circle cx="368" cy="182" r="7"/><text x="24" y="182">ST19</text></a><a id="ST21" class="point" href="/acupuncture/points/st21/" target="_top" aria-label="양문 ST21 상세 설명"><title>양문 ST21 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 4寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 238 L88 233"/><circle cx="368" cy="238" r="7"/><text x="24" y="238">ST21</text></a><a id="ST23" class="point" href="/acupuncture/points/st23/" target="_top" aria-label="태을 ST23 상세 설명"><title>태을 ST23 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 2寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 294 L88 289"/><circle cx="368" cy="294" r="7"/><text x="24" y="294">ST23</text></a><a id="ST26" class="point" href="/acupuncture/points/st26/" target="_top" aria-label="외릉 ST26 상세 설명"><title>외릉 ST26 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 1寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 378 L88 373"/><circle cx="368" cy="378" r="7"/><text x="24" y="378">ST26</text></a><a id="ST28" class="point" href="/acupuncture/points/st28/" target="_top" aria-label="수도 ST28 상세 설명"><title>수도 ST28 · 아랫배, 배꼽(umbilicus) 중심에서 아래 쪽으로 3寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 434 L88 429"/><circle cx="368" cy="434" r="7"/><text x="24" y="434">ST28</text></a><a id="ST30" class="point" href="/acupuncture/points/st30/" target="_top" aria-label="기충 ST30 상세 설명"><title>기충 ST30 · 샅부위(groin region), 두덩결합(pubic symphysis) 위모서리와 같은 높이,앞정중선(anterior median line)에서 가쪽으로 2寸, 넙다리동맥(femoral artery)이 뛰는 곳.</title><path class="callout" d="M368 490 L88 485"/><circle cx="368" cy="490" r="7"/><text x="24" y="490">ST30</text></a><a id="ST20" class="point" href="/acupuncture/points/st20/" target="_top" aria-label="승만 ST20 상세 설명"><title>승만 ST20 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 5寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 210 L512 205"/><circle cx="368" cy="210" r="7"/><text x="520" y="210">ST20</text></a><a id="ST22" class="point" href="/acupuncture/points/st22/" target="_top" aria-label="관문 ST22 상세 설명"><title>관문 ST22 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 3寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 266 L512 261"/><circle cx="368" cy="266" r="7"/><text x="520" y="266">ST22</text></a><a id="ST24" class="point" href="/acupuncture/points/st24/" target="_top" aria-label="활육문 ST24 상세 설명"><title>활육문 ST24 · 윗배, 배꼽(umbilicus) 중심에서 위쪽으로 1寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 322 L512 317"/><circle cx="368" cy="322" r="7"/><text x="520" y="322">ST24</text></a><a id="ST27" class="point" href="/acupuncture/points/st27/" target="_top" aria-label="대거 ST27 상세 설명"><title>대거 ST27 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 2寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 406 L512 401"/><circle cx="368" cy="406" r="7"/><text x="520" y="406">ST27</text></a><a id="ST29" class="point" href="/acupuncture/points/st29/" target="_top" aria-label="귀래 ST29 상세 설명"><title>귀래 ST29 · 아랫배, 배꼽(umbilicus) 중심에서 아래쪽으로 4寸, 앞정중선(anterior median line)에서 가쪽으로 2寸.</title><path class="callout" d="M368 462 L512 457"/><circle cx="368" cy="462" r="7"/><text x="520" y="462">ST29</text></a><text x="24" y="641" font-size="12">민성 한의학 아카이브 · 해부학적 위치 관계를 단순화한 교육용 도해</text></svg>