<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
  <title id="title">T6부터 T12까지 흉추 신경 분절의 대략적 몸통 분포</title>
  <desc id="desc">흉추 신경이 등에서 옆구리를 돌아 앞가슴과 배로 이어지는 모습을 뒤쪽과 앞쪽 몸통에 나타낸 교육용 도해입니다. T6은 흉골 아래, T7부터 T9는 윗배, T10은 배꼽, T11부터 T12는 아랫배의 대략적인 높이를 표시합니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#176f70"/>
    </marker>
    <style>
      text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#243f4b}
      .panel{fill:#f7f9f8;stroke:#c8d8d5;stroke-width:2}
      .body{fill:#faf3eb;stroke:#8b7566;stroke-width:3}
      .spine{fill:none;stroke:#596d78;stroke-width:5;stroke-linecap:round}
      .rib{fill:none;stroke:#d4c3b7;stroke-width:2}
      .route{fill:none;stroke:#176f70;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
      .band{stroke-width:13;stroke-linecap:round;opacity:.82}
      .guide{stroke:#879aa2;stroke-width:2;stroke-dasharray:5 5}
      .muted{fill:#536974}
    </style>
  </defs>
  <rect width="960" height="650" rx="22" fill="#fff"/>
  <text x="32" y="45" font-size="28" font-weight="700">T6–T12: 등에서 옆구리를 돌아 가슴·배로 이어지는 통증띠</text>
  <text x="32" y="76" font-size="15" class="muted">분절 사이가 겹치고 개인차가 있으므로 위치만으로 진단하거나 신경 높이를 확정하지 않습니다.</text>

  <g transform="translate(34 105)">
    <rect class="panel" width="404" height="458" rx="18"/>
    <text x="202" y="36" font-size="20" font-weight="700" text-anchor="middle">뒤·옆쪽: 척추에서 갈비뼈 사이로</text>
    <ellipse class="body" cx="202" cy="85" rx="42" ry="40"/>
    <path class="body" d="M142 121 Q202 98 262 121 L292 314 Q250 361 202 365 Q154 361 112 314 Z"/>
    <path class="body" d="M142 132 Q98 177 83 262 L108 270 Q129 209 160 174 Z"/>
    <path class="body" d="M262 132 Q306 177 321 262 L296 270 Q275 209 244 174 Z"/>
    <path class="spine" d="M202 122 L202 343"/>
    <path class="rib" d="M198 160 Q148 154 127 187 M206 160 Q256 154 277 187"/>
    <path class="rib" d="M198 191 Q145 188 121 218 M206 191 Q259 188 283 218"/>
    <path class="rib" d="M198 222 Q148 222 118 250 M206 222 Q256 222 286 250"/>
    <path class="rib" d="M198 253 Q153 258 119 282 M206 253 Q251 258 285 282"/>
    <path class="route" d="M199 172 Q152 172 112 194"/>
    <path class="route" d="M199 214 Q150 218 104 241"/>
    <path class="route" d="M199 256 Q151 264 108 286"/>
    <path class="route" d="M199 300 Q156 309 119 322"/>
    <circle cx="202" cy="172" r="7" fill="#d36b5f"/><text x="221" y="178" font-size="16" font-weight="700">T6</text>
    <circle cx="202" cy="214" r="7" fill="#dc9250"/><text x="221" y="220" font-size="16" font-weight="700">T7–9</text>
    <circle cx="202" cy="256" r="7" fill="#c3a53d"/><text x="221" y="262" font-size="16" font-weight="700">T10</text>
    <circle cx="202" cy="300" r="7" fill="#659b75"/><text x="221" y="306" font-size="16" font-weight="700">T11–12</text>
    <text x="202" y="407" font-size="16" text-anchor="middle">통증·저림이 척추 옆에서 시작해</text>
    <text x="202" y="432" font-size="16" text-anchor="middle">한쪽 몸통을 감싸듯 이어질 수 있습니다.</text>
  </g>

  <g transform="translate(522 105)">
    <rect class="panel" width="404" height="458" rx="18"/>
    <text x="202" y="36" font-size="20" font-weight="700" text-anchor="middle">앞쪽: 대략적인 표면 기준점</text>
    <ellipse class="body" cx="202" cy="85" rx="42" ry="40"/>
    <path class="body" d="M142 121 Q202 98 262 121 L292 360 Q245 393 202 395 Q159 393 112 360 Z"/>
    <path class="body" d="M142 132 Q98 177 83 262 L108 270 Q129 209 160 174 Z"/>
    <path class="body" d="M262 132 Q306 177 321 262 L296 270 Q275 209 244 174 Z"/>
    <line x1="137" y1="198" x2="267" y2="198" class="band" stroke="#d36b5f"/>
    <line x1="129" y1="246" x2="275" y2="246" class="band" stroke="#dc9250"/>
    <line x1="124" y1="296" x2="280" y2="296" class="band" stroke="#c3a53d"/>
    <line x1="121" y1="346" x2="283" y2="346" class="band" stroke="#659b75"/>
    <line x1="202" y1="180" x2="202" y2="214" class="guide"/>
    <circle cx="202" cy="296" r="6" fill="#243f4b"/>
    <text x="304" y="204" font-size="16" font-weight="700">T6 전후</text>
    <text x="304" y="226" font-size="14" class="muted">흉골 아래·명치 위</text>
    <text x="304" y="252" font-size="16" font-weight="700">T7–9</text>
    <text x="304" y="274" font-size="14" class="muted">갈비뼈 아래·윗배</text>
    <text x="304" y="302" font-size="16" font-weight="700">T10</text>
    <text x="304" y="324" font-size="14" class="muted">배꼽 주변</text>
    <text x="304" y="352" font-size="16" font-weight="700">T11–12</text>
    <text x="304" y="374" font-size="14" class="muted">아랫배·서혜부 위쪽</text>
    <text x="202" y="430" font-size="15" text-anchor="middle">심장·폐·복부·요로 질환과 같은 위치에</text>
    <text x="202" y="452" font-size="15" text-anchor="middle">느껴질 수 있어 동반 증상을 먼저 확인합니다.</text>
  </g>

  <rect x="34" y="584" width="892" height="42" rx="11" fill="#edf7f4"/>
  <text x="480" y="611" font-size="15" text-anchor="middle">교육용 개략도 · 통증띠는 선 하나가 아니라 겹치는 영역이며, 실제 진단은 진찰과 원인검사를 함께 봅니다.</text>
</svg>
