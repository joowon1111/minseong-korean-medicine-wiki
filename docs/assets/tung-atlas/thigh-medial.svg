<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 허벅지 안쪽 · 상삼황</title><desc id="desc">허벅지 안쪽 · 위는 몸통, 아래는 무릎. 허벅지 안쪽을 따로 펼친 개요입니다. 天黃·明黃·其黃의 상삼황과 종아리 天皇·地皇·人皇의 하삼황을 구별합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 허벅지 안쪽 · 상삼황</text><text x="24" y="61" font-size="14">허벅지 안쪽 · 위는 몸통, 아래는 무릎</text><path class="skin" d="M173 137 Q257 110 341 137 L318 478 Q311 544 291 561 L217 561 Q194 536 189 478 Z"/><path class="landmark" d="M198 173 Q237 309 221 476 M320 184 Q285 319 290 482"/><path class="landmark" d="M227 531 Q254 513 288 533"/><text x="217" y="91" font-size="16">몸통 방향</text><text x="205" y="597" font-size="16">무릎 안쪽</text><a id="tianhuang-thigh" class="point" href="/tung-acupuncture/thigh-medial/#tianhuang-thigh" target="_top" aria-label="천황 위치와 임상 설명"><title>천황 天黃</title><path class="callout" d="M257 242 L470 160"/><circle cx="257" cy="242" r="8"/><text x="486" y="165" font-size="19">천황 天黃</text></a><a id="minghuang" class="point" href="/tung-acupuncture/thigh-medial/#minghuang" target="_top" aria-label="명황 위치와 임상 설명"><title>명황 明黃</title><path class="callout" d="M257 342 L470 225"/><circle cx="257" cy="342" r="8"/><text x="486" y="230" font-size="19">명황 明黃</text></a><a id="qihuang" class="point" href="/tung-acupuncture/thigh-medial/#qihuang" target="_top" aria-label="기황 위치와 임상 설명"><title>기황 其黃</title><path class="callout" d="M257 442 L470 290"/><circle cx="257" cy="442" r="8"/><text x="486" y="295" font-size="19">기황 其黃</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>