<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 아래팔 · 화관·화릉·화산</title><desc id="desc">아래팔 뒷면 · 위는 팔꿈치, 아래는 손목. 참고 전승의 화관 2.5촌 기준을 사용했습니다. 도해의 눈금은 상대적 위치이며 자침 깊이가 아닙니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 아래팔 · 화관·화릉·화산</text><text x="24" y="61" font-size="14">아래팔 뒷면 · 위는 팔꿈치, 아래는 손목</text><path class="skin" d="M175 110 Q265 90 355 110 L320 526 L208 526 Z"/><path class="bone" d="M188 135 L343 135 M210 520 L320 520 M238 150 L244 495 M300 150 L287 495"/><text x="212" y="87" font-size="16">팔꿈치</text><text x="230" y="559" font-size="15">손목 뒤 주름</text><a id="huoshan" class="point" href="/tung-acupuncture/forearm/#huoshan" target="_top" aria-label="화산 위치와 임상 설명"><title>화산 火山</title><path class="callout" d="M265 320 L470 160"/><circle cx="265" cy="320" r="8"/><text x="486" y="165" font-size="19">화산 火山</text></a><a id="huoling" class="point" href="/tung-acupuncture/forearm/#huoling" target="_top" aria-label="화릉 위치와 임상 설명"><title>화릉 火陵</title><path class="callout" d="M265 370 L470 225"/><circle cx="265" cy="370" r="8"/><text x="486" y="230" font-size="19">화릉 火陵</text></a><a id="huochuan" class="point" href="/tung-acupuncture/forearm/#huochuan" target="_top" aria-label="화관 위치와 임상 설명"><title>화관 火串</title><path class="callout" d="M265 437 L470 290"/><circle cx="265" cy="437" r="8"/><text x="486" y="295" font-size="19">화관 火串</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>