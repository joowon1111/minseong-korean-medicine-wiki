<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 손가락 · 대간·소간·중간·측간</title><desc id="desc">손바닥 쪽 검지 확대. 손가락의 작은 간격을 확대해 상대적 배열을 보여 줍니다. 본문의 촌·분을 화면의 길이나 고정된 mm로 환산하지 않습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 손가락 · 대간·소간·중간·측간</text><text x="24" y="61" font-size="14">손바닥 쪽 검지 확대</text><path class="skin" d="M178 550 L175 160 Q177 110 234 110 Q293 113 295 160 L297 550 Z"/><path class="landmark" d="M179 255 Q235 270 293 255 M179 320 Q235 335 294 320 M183 530 Q235 541 291 530"/><text x="190" y="92" font-size="15">검지 손끝</text><text x="70" y="340" font-size="15">엄지 쪽</text><text x="185" y="575" font-size="15">손바닥 방향</text><text x="355" y="326" font-size="14">첫 마디</text><a id="xiaojian" class="point" href="/tung-acupuncture/fingers/#xiaojian" target="_top" aria-label="소간 위치와 임상 설명"><title>소간 小間</title><path class="callout" d="M202 373 L470 160"/><circle cx="202" cy="373" r="8"/><text x="486" y="165" font-size="19">소간 小間</text></a><a id="dajian" class="point" href="/tung-acupuncture/fingers/#dajian" target="_top" aria-label="대간 위치와 임상 설명"><title>대간 大間</title><path class="callout" d="M202 425 L470 225"/><circle cx="202" cy="425" r="8"/><text x="486" y="230" font-size="19">대간 大間</text></a><a id="zhongjian" class="point" href="/tung-acupuncture/fingers/#zhongjian" target="_top" aria-label="중간 위치와 임상 설명"><title>중간 中間</title><path class="callout" d="M235 425 L470 290"/><circle cx="235" cy="425" r="8"/><text x="486" y="295" font-size="19">중간 中間</text></a><a id="cejian" class="point" href="/tung-acupuncture/fingers/#cejian" target="_top" aria-label="측간 위치와 임상 설명"><title>측간 側間</title><path class="callout" d="M202 477 L470 355"/><circle cx="202" cy="477" r="8"/><text x="486" y="360" font-size="19">측간 側間</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>