<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 종아리 안쪽 · 하삼황</title><desc id="desc">종아리 안쪽 · 위는 무릎, 아래는 안쪽 복사. 이 그림은 董氏心氣神針의 하삼황 위치 기술 기준입니다. 문헌 간 명명·거리 차이는 본문에서 함께 확인합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 종아리 안쪽 · 하삼황</text><text x="24" y="61" font-size="14">종아리 안쪽 · 위는 무릎, 아래는 안쪽 복사</text><path class="skin" d="M171 167 Q242 132 313 167 Q351 219 327 318 L286 548 L186 548 L176 341 Q142 252 171 167 Z"/><path class="bone" d="M206 190 Q255 170 295 191 L250 520"/><path class="landmark" d="M180 209 Q225 222 287 205 M194 529 L273 529"/><text x="206" y="124" font-size="16">무릎 안쪽</text><text x="179" y="582" font-size="14">안쪽 복사 윗모서리</text><a id="tianhuang" class="point" href="/tung-acupuncture/lower-leg/#tianhuang" target="_top" aria-label="천황 위치와 임상 설명"><title>천황 天皇</title><path class="callout" d="M235 245 L470 160"/><circle cx="235" cy="245" r="8"/><text x="486" y="165" font-size="19">천황 天皇</text></a><a id="dihuang" class="point" href="/tung-acupuncture/lower-leg/#dihuang" target="_top" aria-label="지황 위치와 임상 설명"><title>지황 地皇</title><path class="callout" d="M235 350 L470 225"/><circle cx="235" cy="350" r="8"/><text x="486" y="230" font-size="19">지황 地皇</text></a><a id="renhuang" class="point" href="/tung-acupuncture/lower-leg/#renhuang" target="_top" aria-label="인황 위치와 임상 설명"><title>인황 人皇</title><path class="callout" d="M235 455 L470 290"/><circle cx="235" cy="455" r="8"/><text x="486" y="295" font-size="19">인황 人皇</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>