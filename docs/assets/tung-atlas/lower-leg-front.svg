<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 종아리 앞면 · 사화상·사화중·사화부·사화하</title><desc id="desc">오른쪽 정강이 앞면 · 왼쪽은 안쪽, 오른쪽은 가쪽. 사화상·중·하는 董氏心氣神針, 사화부는 eLotus의 외슬안 아래 10촌 기준입니다. 높이와 뼈 가장자리의 관계를 보여 주는 교육용 개요입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="17">동씨침법 · 종아리 앞면 · 사화상·사화중·사화부·사화하</text><text x="24" y="61" font-size="14">오른쪽 정강이 앞면 · 왼쪽은 안쪽, 오른쪽은 가쪽</text><path class="skin" d="M179 146 Q262 121 348 146 L329 307 L311 562 L217 562 L199 308 Z"/><path class="bone" d="M258 218 L260 532 M318 225 L298 530"/><ellipse class="landmark" cx="260" cy="176" rx="29" ry="35"/><path class="landmark" d="M244 215 L271 215 M226 541 L307 541"/><text x="315" y="206" font-size="14">외슬안</text><text x="80" y="377" font-size="15">정강뼈</text><text x="227" y="596" font-size="15">발목 방향</text><a id="sihua-upper" class="point" href="/tung-acupuncture/lower-leg-front/#sihua-upper" target="_top" aria-label="사화상 위치와 임상 설명"><title>사화상 四花上</title><path class="callout" d="M276 265 L470 160"/><circle cx="276" cy="265" r="8"/><text x="486" y="165" font-size="19">사화상 四花上</text></a><a id="sihua-middle" class="point" href="/tung-acupuncture/lower-leg-front/#sihua-middle" target="_top" aria-label="사화중 위치와 임상 설명"><title>사화중 四花中</title><path class="callout" d="M281 382 L470 225"/><circle cx="281" cy="382" r="8"/><text x="486" y="230" font-size="19">사화중 四花中</text></a><a id="sihua-accessory" class="point" href="/tung-acupuncture/lower-leg-front/#sihua-accessory" target="_top" aria-label="사화부 위치와 임상 설명"><title>사화부 四花副</title><path class="callout" d="M284 447 L470 290"/><circle cx="284" cy="447" r="8"/><text x="486" y="295" font-size="19">사화부 四花副</text></a><a id="sihua-lower" class="point" href="/tung-acupuncture/lower-leg-front/#sihua-lower" target="_top" aria-label="사화하 위치와 임상 설명"><title>사화하 四花下</title><path class="callout" d="M287 512 L470 355"/><circle cx="287" cy="512" r="8"/><text x="486" y="360" font-size="19">사화하 四花下</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>