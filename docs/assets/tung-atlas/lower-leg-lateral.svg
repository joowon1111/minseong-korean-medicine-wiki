<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 종아리 가쪽 · 일중·이중·삼중</title><desc id="desc">종아리 가쪽 · 왼쪽은 앞, 오른쪽은 뒤. 바깥 복사뼈와 앞쪽 방향을 표시한 가쪽 면입니다. 선은 혈군의 배열이며 자침 경로나 현대 신경의 주행을 뜻하지 않습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 종아리 가쪽 · 일중·이중·삼중</text><text x="24" y="61" font-size="14">종아리 가쪽 · 왼쪽은 앞, 오른쪽은 뒤</text><path class="skin" d="M171 149 Q240 111 302 156 Q354 244 321 341 L287 526 Q283 552 261 557 L204 557 L179 333 Z"/><path class="bone" d="M255 187 L260 534"/><path class="landmark" d="M182 174 Q231 198 283 175"/><circle class="landmark" cx="260" cy="537" r="12"/><text x="190" y="91" font-size="16">무릎 가쪽</text><text x="71" y="364" font-size="14">앞 · 정강이</text><text x="333" y="364" font-size="14">뒤 · 종아리</text><text x="229" y="590" font-size="14">바깥 복사뼈</text><a id="sanzhong" class="point" href="/tung-acupuncture/lower-leg-lateral/#sanzhong" target="_top" aria-label="삼중 위치와 임상 설명"><title>삼중 三重</title><path class="callout" d="M224 341 L470 160"/><circle cx="224" cy="341" r="8"/><text x="486" y="165" font-size="19">삼중 三重</text></a><a id="erzhong" class="point" href="/tung-acupuncture/lower-leg-lateral/#erzhong" target="_top" aria-label="이중 위치와 임상 설명"><title>이중 二重</title><path class="callout" d="M224 397 L470 225"/><circle cx="224" cy="397" r="8"/><text x="486" y="230" font-size="19">이중 二重</text></a><a id="yizhong" class="point" href="/tung-acupuncture/lower-leg-lateral/#yizhong" target="_top" aria-label="일중 위치와 임상 설명"><title>일중 一重</title><path class="callout" d="M224 453 L470 290"/><circle cx="224" cy="453" r="8"/><text x="486" y="295" font-size="19">일중 一重</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>