<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 손등 · 영골·대백·중백·하백</title><desc id="desc">오른손 손등 · 엄지가 왼쪽. 뼈 윤곽은 위치 관계를 이해하기 위한 개요입니다. 주먹을 쥐는 정도에 따라 피부에서 보이는 자리가 달라질 수 있습니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 손등 · 영골·대백·중백·하백</text><text x="24" y="61" font-size="14">오른손 손등 · 엄지가 왼쪽</text><path class="skin" d="M255 570 L254 488 Q199 453 157 381 L101 302 Q88 280 105 270 Q124 260 144 290 L198 337 Q215 345 216 307 L200 144 Q199 122 217 121 Q236 121 239 145 L255 280 L258 94 Q258 69 277 69 Q297 69 297 95 L304 279 L317 121 Q319 99 338 104 Q355 107 353 132 L350 296 L372 205 Q379 183 397 191 Q414 200 407 224 L385 386 Q383 449 350 489 L352 570 Z"/><path class="bone" d="M226 303 L285 474 M291 302 L309 474 M336 315 L329 474 M380 337 L348 474 M178 374 L260 483"/><path class="landmark" d="M257 500 L350 500"/><text x="75" y="228" font-size="14">엄지 쪽</text><text x="276" y="597" font-size="14">손목</text><a id="dabai" class="point" href="/tung-acupuncture/hand-dorsal/#dabai" target="_top" aria-label="대백 위치와 임상 설명"><title>대백 大白</title><path class="callout" d="M241 348 L470 160"/><circle cx="241" cy="348" r="8"/><text x="486" y="165" font-size="19">대백 大白</text></a><a id="zhongbai" class="point" href="/tung-acupuncture/hand-dorsal/#zhongbai" target="_top" aria-label="중백 위치와 임상 설명"><title>중백 中白</title><path class="callout" d="M354 358 L470 225"/><circle cx="354" cy="358" r="8"/><text x="486" y="230" font-size="19">중백 中白</text></a><a id="xiabai" class="point" href="/tung-acupuncture/hand-dorsal/#xiabai" target="_top" aria-label="하백 위치와 임상 설명"><title>하백 下白</title><path class="callout" d="M348 405 L470 290"/><circle cx="348" cy="405" r="8"/><text x="486" y="295" font-size="19">하백 下白</text></a><a id="linggu" class="point" href="/tung-acupuncture/hand-dorsal/#linggu" target="_top" aria-label="영골 위치와 임상 설명"><title>영골 靈骨</title><path class="callout" d="M278 459 L470 355"/><circle cx="278" cy="459" r="8"/><text x="486" y="360" font-size="19">영골 靈骨</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>