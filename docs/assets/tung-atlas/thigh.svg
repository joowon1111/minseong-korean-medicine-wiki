<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="title desc"><title id="title">동씨침법 · 허벅지 · 통관·통산·통천·사마</title><desc id="desc">오른쪽 허벅지 앞면 · 왼쪽은 안쪽, 오른쪽은 가쪽. 무릎에서 몸통 방향으로 세는 높이와 앞 중앙·가쪽의 차이를 펼친 개요입니다. 통천 BL7 등 표준경혈의 동명 혈과 구별합니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:2}.bone{fill:none;stroke:#dfcbb5;stroke-width:9;stroke-linecap:round}.landmark{fill:none;stroke:#ba9c83;stroke-width:2}.callout{fill:none;stroke:#879b9c;stroke-width:1.3}.point circle{fill:#087d80;stroke:white;stroke-width:3}.point text{font-weight:700;fill:#08676b}.point:hover circle,.point:focus circle,.point:target circle{fill:#bd4c23;stroke:#7f3218}.point:hover text,.point:target text{fill:#9e3c18}.point:focus{outline:2px solid #087d80}</style><rect width="720" height="660" rx="18" fill="white"/><text x="24" y="34" font-size="21">동씨침법 · 허벅지 · 통관·통산·통천·사마</text><text x="24" y="61" font-size="14">오른쪽 허벅지 앞면 · 왼쪽은 안쪽, 오른쪽은 가쪽</text><path class="skin" d="M147 130 Q249 104 352 130 L341 450 Q336 515 310 567 L190 567 Q157 519 151 450 Z"/><path class="bone" d="M250 150 L250 480"/><path class="landmark" d="M162 245 Q180 391 204 464 M333 239 Q314 385 294 464"/><ellipse class="landmark" cx="250" cy="520" rx="34" ry="39"/><path class="landmark" d="M188 551 L312 551"/><text x="218" y="90" font-size="16">몸통 방향</text><text x="207" y="599" font-size="16">무릎 앞면</text><a id="sima-upper" class="point" href="/tung-acupuncture/thigh/#sima-upper" target="_top" aria-label="사마상 위치와 임상 설명"><title>사마상 駟馬上</title><path class="callout" d="M320 262 L470 160"/><circle cx="320" cy="262" r="8"/><text x="486" y="165" font-size="19">사마상 駟馬上</text></a><a id="sima-middle" class="point" href="/tung-acupuncture/thigh/#sima-middle" target="_top" aria-label="사마중 위치와 임상 설명"><title>사마중 駟馬中</title><path class="callout" d="M320 312 L470 225"/><circle cx="320" cy="312" r="8"/><text x="486" y="230" font-size="19">사마중 駟馬中</text></a><a id="tongtian" class="point" href="/tung-acupuncture/thigh/#tongtian" target="_top" aria-label="통천 위치와 임상 설명"><title>통천 通天</title><path class="callout" d="M250 325 L470 290"/><circle cx="250" cy="325" r="8"/><text x="486" y="295" font-size="19">통천 通天</text></a><a id="sima-lower" class="point" href="/tung-acupuncture/thigh/#sima-lower" target="_top" aria-label="사마하 위치와 임상 설명"><title>사마하 駟馬下</title><path class="callout" d="M320 362 L470 355"/><circle cx="320" cy="362" r="8"/><text x="486" y="360" font-size="19">사마하 駟馬下</text></a><a id="tongshan" class="point" href="/tung-acupuncture/thigh/#tongshan" target="_top" aria-label="통산 위치와 임상 설명"><title>통산 通山</title><path class="callout" d="M250 375 L470 420"/><circle cx="250" cy="375" r="8"/><text x="486" y="425" font-size="19">통산 通山</text></a><a id="tongguan" class="point" href="/tung-acupuncture/thigh/#tongguan" target="_top" aria-label="통관 위치와 임상 설명"><title>통관 通關</title><path class="callout" d="M250 425 L470 485"/><circle cx="250" cy="425" r="8"/><text x="486" y="490" font-size="19">통관 通關</text></a><text x="24" y="627" font-size="14">점·이름을 누르면 해당 혈 설명으로 이동 · 교육용 위치 개요</text><text x="24" y="649" font-size="12">민성 한의학 아카이브 · 출처별 위치 기준은 본문 참조 · 자침 깊이·방향 표시 아님</text></svg>