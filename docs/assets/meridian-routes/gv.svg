<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">독맥 · 시작혈부터 마지막혈까지</title><desc id="desc">꼬리뼈 아래 회음부 → 엉치·허리·등 정중선 → 목 뒤 → 정수리 → 이마·코·윗입술 안쪽. 큰 그림은 뒷면, 작은 그림은 얼굴 쪽 종점입니다. 은교는 코끝이나 턱이 아니라 위입술주름띠와 위잇몸의 만나는 곳입니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">독맥 GV</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><ellipse class="skin" cx="270" cy="135" rx="44" ry="57"/><path class="skin" d="M249 185 L248 210 L185 230 L209 282 L211 348 L193 427 L186 466 Q224 488 270 475 Q315 488 354 466 L347 427 L329 348 L331 282 L355 230 L292 210 L291 185 Z"/><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/><g transform="translate(540 0) scale(-1 1)"><path cl