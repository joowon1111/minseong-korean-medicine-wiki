<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc"><title id="title">족태양방광경 · 시작혈부터 마지막혈까지</title><desc id="desc">눈 안쪽 → 이마·정수리·뒤통수 → 척추 양옆 두 줄 → 엉덩이·허벅지 뒤 → 오금·종아리 → 가쪽 발목 → 새끼발가락. 왼쪽 큰 그림은 뒷면, 오른쪽 작은 얼굴은 시작혈입니다. 등 두 줄기는 오금에서 합류하며 혈번호대로 한 줄을 왕복하는 그림이 아닙니다.</desc><style>text{font-family:system-ui,"Noto Sans KR",sans-serif;fill:#29424a}.skin{fill:#f9efe5;stroke:#b18a72;stroke-width:1.8}.landmark{fill:none;stroke:#c7ad95;stroke-width:2}.guide{fill:none;stroke:#95a7aa;stroke-width:1.3;stroke-dasharray:5 5}.route{fill:none;stroke:#087d80;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.point circle{fill:#087d80;stroke:white;stroke-width:2}.point.end circle{fill:#ba552f}.point text{font-size:15px;font-weight:700;fill:#08676b}.point.end text{fill:#a04422}.point:hover circle,.point:focus circle,.point:target circle{fill:#bf4129;stroke:#783627;stroke-width:3}.point:focus{outline:2px solid #087d80}.callout{fill:none;stroke:#799097;stroke-width:1}.small{font-size:13px;fill:#546b73}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087d80"/></marker></defs><rect width="960" height="800" rx="18" fill="white"/><text x="30" y="39" font-size="25" class="">족태양방광경 BL</text><text x="30" y="69" font-size="16" class="">시작혈 → 지나가는 부위 → 마지막혈</text><ellipse class="skin" cx="270" cy="135" rx="44" ry="57"/><path class="skin" d="M249 185 L248 210 L185 230 L209 282 L211 348 L193 427 L186 466 Q224 488 270 475 Q315 488 354 466 L347 427 L329 348 L331 282 L355 230 L292 210 L291 185 Z"/><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M188 234 Q166 275 151 344 L121 466 L113 487 L94 499 L80 529 L74 545 Q74 551 82 548 L96 525 L91 551 Q92 559 99 553 L104 531 L103 557 Q103 567 107 562 L113 550 L114 529 L116 545 Q121 551 122 541 L124 519 L125 502 L140 517 Q154 520 148 507 L132 487 L145 474 L177 360 L211 258 Z"/></g><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/><g transform="translate(540 0) scale(-1 1)"><path class="skin" d="M187 460 Q214 480 254 475 L249 543 L246 610 L241 674 L254 707 L248 722 L181 723 L180 709 L195 676 L190 607 L181 546 Z"/></g><path class="guide" d="M270 218 L270 449"/><path class="landmark" d="M239 244 L211 271 L245 320 Z M301 244 L329 271 L295 320 Z M200 489 Q219 500 248 489 M292 489 Q321 500 340 489"/><path class="landmark" d="M198 540 L239 540 M301 540 L342 540 M197 682 L238 682 M302 682 L343 682"/><text x="45" y="116" font-size="16" class="">뒷면</text><path class="route" d="M280 83 Q303 103 297 149 L292 207"/><path class="route" d="M292 207 L294 280 L294 383 L296 440 L310 473 L313 541"/><path class="route" d="M292 219 L323 249 L329 385 L338 453 L332 484 L313 541"/><path class="route" d="M313 541 L315 601 L325 653 L330 683 L340 716"/><rect x="540" y="87" width="386" height="152" rx="12" fill="#f5f8f8"/><ellipse class="skin" cx="720" cy="147" rx="39" ry="47"/><path class="landmark" d="M696 135 L711 135 M724 135 L739 135 M718 142 L715 151 L724 151 M706 166 Q720 172 734 166"/><text x="553" y="108" font-size="14" class="">얼굴 쪽 시작혈</text><path class="guide" d="M712 135 L660 122 L477 88 L302 84"/><a id="BL10" class="point" href="/acupuncture/points/bl10-tianzhu/" target="_top" aria-label="천주 BL10 상세 도해"><title>천주 BL10</title><path class="callout" d="M292 207 L412 202"/><circle cx="292" cy="207" r="6"/><text x="422" y="207" font-size="16" class="">BL10</text></a><a id="BL23" class="point" href="/acupuncture/points/bl23-shenshu/" target="_top" aria-label="신수 BL23 상세 도해"><title>신수 BL23</title><path class="callout" d="M294 383 L412 378"/><circle cx="294" cy="383" r="6"/><text x="422" y="383" font-size="16" class="">BL23</text></a><a id="BL40" class="point" href="/acupuncture/points/bl40-weizhong/" target="_top" aria-label="위중 BL40 상세 도해"><title>위중 BL40</title><path class="callout" d="M313 541 L412 536"/><circle cx="313" cy="541" r="6"/><text x="422" y="541" font-size="16" class="">BL40</text></a><a id="BL60" class="point" href="/acupuncture/points/bl60-kunlun/" target="_top" aria-label="곤륜 BL60 상세 도해"><title>곤륜 BL60</title><path class="callout" d="M330 683 L412 678"/><circle cx="330" cy="683" r="6"/><text x="422" y="683" font-size="16" class="">BL60</text></a><a id="BL67" class="point end" href="/acupuncture/points/bl67/" target="_top" aria-label="지음 BL67 상세 도해"><title>지음 BL67</title><path class="callout" d="M340 716 L412 711"/><circle cx="340" cy="716" r="6"/><text x="422" y="716" font-size="16" class="">BL67</text></a><a id="BL1" class="point" href="/acupuncture/points/bl1/" target="_top" aria-label="정명 상세 도해"><circle cx="712" cy="135" r="6"/><text x="783" y="140" font-size="15" class="">정명 BL1</text></a><rect x="540" y="248" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="269" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/bl1/" target="_top"><text x="553" y="294" font-size="20" class="">정명 BL1</text></a><rect x="540" y="318" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="339" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/bl67/" target="_top"><text x="553" y="364" font-size="20" class="">지음 BL67</text></a><circle cx="552" cy="423" r="4" fill="#087d80"/><text x="568" y="428" font-size="15" class="">얼굴의 눈 안쪽에서 머리 위로</text><path class="guide" d="M552 435 L552 458"/><circle cx="552" cy="474" r="4" fill="#087d80"/><text x="568" y="479" font-size="15" class="">등에서는 척추 양옆 두 줄</text><path class="guide" d="M552 486 L552 509"/><circle cx="552" cy="525" r="4" fill="#087d80"/><text x="568" y="530" font-size="15" class="">엉덩이·다리 뒤에서 오금으로 합류</text><path class="guide" d="M552 537 L552 560"/><circle cx="552" cy="576" r="4" fill="#087d80"/><text x="568" y="581" font-size="15" class="">가쪽 발목 뒤를 지나 새끼발가락</text><text x="540" y="639" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>