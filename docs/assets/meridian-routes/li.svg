</text></a><a id="LI4" class="point" href="/acupuncture/points/li4-hegu/" target="_top" aria-label="합곡 LI4 상세 도해"><title>합곡 LI4</title><path class="callout" d="M117 504 L100 499"/><circle cx="117" cy="504" r="6"/><text x="38" y="504" font-size="16" class="">LI4</text></a><a id="LI1" class="point" href="/acupuncture/points/li1/" target="_top" aria-label="상양 LI1 상세 도해"><title>상양 LI1</title><path class="callout" d="M113 550 L100 545"/><circle cx="113" cy="550" r="6"/><text x="38" y="550" font-size="16" class="">LI1</text></a><rect x="540" y="123" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="144" font-size="13" class="">체표 첫 혈</text><a href="/acupuncture/points/li1/" target="_top"><text x="553" y="169" font-size="20" class="">상양 LI1</text></a><rect x="540" y="193" width="386" height="62" rx="10" fill="#f5f8f8"/><text x="553" y="214" font-size="13" class="">체표 마지막 혈</text><a href="/acupuncture/points/li20-yingxiang/" target="_top"><text x="553" y="239" font-size="20" class="">영향 LI20</text></a><circle cx="552" cy="298" r="4" fill="#087d80"/><text x="568" y="303" font-size="15" class="">검지에서 손등으로 올라감</text><path class="guide" d="M552 310 L552 333"/><circle cx="552" cy="349" r="4" fill="#087d80"/><text x="568" y="354" font-size="15" class="">팔꿈치 바깥과 어깨 앞을 지남</text><path class="guide" d="M552 361 L552 384"/><circle cx="552" cy="400" r="4" fill="#087d80"/><text x="568" y="405" font-size="15" class="">목·볼을 지나 입 주위로</text><path class="guide" d="M552 412 L552 435"/><circle cx="552" cy="451" r="4" fill="#087d80"/><text x="568" y="456" font-size="15" class="">인중에서 교차해 반대쪽 코 옆</text><text x="540" y="514" font-size="13" class="small">경혈 코드·이름을 누르면 상세 위치로 이동합니다.</text><text x="30" y="762" font-size="14" class="small">한쪽 경맥의 체표 흐름을 펼친 교육용 개요 · 내부 장부·깊이·자침 방향은 표시하지 않음</text><text x="30" y="786" font-size="12" class="small">민성 한의학 아카이브 · 정확한 위치는 연결된 361경혈 도해와 본문에서 확인</text></svg>