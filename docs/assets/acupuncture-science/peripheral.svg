<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">말초조직에서 신경계로</title><desc id="desc">조직 자극의 감각 경로와 국소 아데노신 반응을 구분한 개념도. DRG는 일차감각 뉴런의 세포체 위치이며 시냅스 중계핵이 아니다.</desc>
<defs><marker id="arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="arrow-4465aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4465aa"/></marker></defs>
<g font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
<rect width="960" height="720" rx="18" fill="#f8fafc"/>
<text x="36" y="46" font-size="30" fill="#172d43" text-anchor="start" font-weight="700">말초조직에서 신경계로</text>
<rect x="40" y="90" width="400" height="112" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="240.0" y="128" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">국소조직의 변형</text><text x="240.0" y="162" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">침과 조직의 물리적 상호작용</text><rect x="520" y="90" width="400" height="112" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="720.0" y="128" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">국소 생화학 반응</text><text x="720.0" y="162" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">ATP · 아데노신 등</text><path d="M440 146 H520" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><rect x="40" y="270" width="400" height="112" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="240.0" y="308" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">감각신경 말단</text><text x="240.0" y="342" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">Aβ · Aδ · C 등</text><path d="M240 202 V270" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><rect x="520" y="270" width="400" height="112" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="720.0" y="308" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">아데노신 A1 수용체</text><text x="720.0" y="342" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">국소 항통각 기전 연구</text><path d="M720 202 V270" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><rect x="40" y="450" width="880" height="112" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="480.0" y="488" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">몸통·팔다리: 일차감각 뉴런 → 척수</text><text x="480.0" y="522" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">세포체: 후근신경절(DRG) · 통각 처리: 척수 후각</text><path d="M240 382 V450" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><text x="480" y="609" font-size="22" fill="#172d43" text-anchor="middle" font-weight="400">감각 입력(구심성)과 근육으로 가는 운동 출력(원심성)을 구분</text><text x="480" y="646" font-size="22" fill="#172d43" text-anchor="middle" font-weight="400">얼굴 감각은 주로 삼차신경계 경로로 전달</text>
<text x="36" y="692" font-size="19" fill="#526477" text-anchor="start" font-weight="400">원본 개념도 · 본문의 사람·동물 연구 구분을 함께 읽습니다. 실제 자침 경로가 아닙니다.</text>
</g></svg>
