<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">뇌영상과 임상 결과를 함께 읽기</title><desc id="desc">연구 조건을 비교하고 영상·생리 지표와 환자의 임상 결과를 각각 측정한다. 두 결과의 상관관계만으로 치료의 인과적 매개가 입증되지는 않는다.</desc>
<defs><marker id="arrow-087f8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker><marker id="arrow-4465aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#4465aa"/></marker></defs>
<g font-family="Noto Sans KR,Malgun Gothic,Apple SD Gothic Neo,sans-serif">
<rect width="960" height="710" rx="18" fill="#f8fafc"/>
<text x="36" y="46" font-size="30" fill="#172d43" text-anchor="start" font-weight="700">뇌영상과 임상 결과를 함께 읽기</text>
<rect x="40" y="90" width="400" height="106" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="240.0" y="128" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">연구 조건 A</text><text x="240.0" y="162" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">실제 침 · 특정 자극 설정</text><rect x="520" y="90" width="400" height="106" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="720.0" y="128" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">연구 조건 B</text><text x="720.0" y="162" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">가짜침 · 통상치료 등 비교 조건</text><text x="480" y="242" font-size="23" fill="#172d43" text-anchor="middle" font-weight="400">같은 시점·같은 방법으로 두 조건을 비교</text><rect x="40" y="285" width="400" height="150" rx="14" fill="#e9f7f5" stroke="#087f8c" stroke-width="2"/><text x="240.0" y="323" font-size="25" fill="#087f8c" text-anchor="middle" font-weight="700">영상·생리 지표</text><text x="240.0" y="357" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">BOLD · 연결성 · 감각지도</text><text x="240.0" y="387" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">신경전도 등</text><rect x="520" y="285" width="400" height="150" rx="14" fill="#eef2fb" stroke="#4465aa" stroke-width="2"/><text x="720.0" y="323" font-size="25" fill="#4465aa" text-anchor="middle" font-weight="700">임상 결과</text><text x="720.0" y="357" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">통증 · 기능 · 감각 증상</text><text x="720.0" y="387" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">치료 종료 후 지속효과</text><rect x="40" y="510" width="880" height="128" rx="14" fill="#fff5e7" stroke="#ad7220" stroke-width="2"/><text x="480.0" y="548" font-size="25" fill="#ad7220" text-anchor="middle" font-weight="700">두 결과의 관계를 분석</text><text x="480.0" y="582" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">함께 변하는가?  어떤 결과를 예측하는가?</text><text x="480.0" y="612" font-size="21" fill="#172d43" text-anchor="middle" font-weight="400">상관관계와 인과적 매개를 구분</text><path d="M240 435 V510" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow-087f8c)"/><path d="M720 435 V510" fill="none" stroke="#4465aa" stroke-width="3" marker-end="url(#arrow-4465aa)"/>
<text x="36" y="682" font-size="19" fill="#526477" text-anchor="start" font-weight="400">원본 연구 개념도 · 뇌의 실제 위치나 활성화 지도를 표시한 그림이 아닙니다.</text>
</g></svg>
